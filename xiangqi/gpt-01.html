<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>H5 中国象棋</title>

<style>
body{
    margin:0;
    background:#eee;
    text-align:center;
    font-family:"Microsoft YaHei";
}

h2{
    margin:15px;
}

canvas{
    background:#f5d98b;
    border:3px solid #8b4513;
    max-width:95vw;
}

button{
    margin:10px;
    padding:10px 25px;
    font-size:16px;
}
</style>

</head>

<body>

<h2>中国象棋</h2>

<canvas id="board" width="450" height="500"></canvas>

<br>

<button onclick="restart()">重新开始</button>


<script>

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");


let size=50;


// 初始棋盘
let board=[
["车","马","象","士","将","士","象","马","车"],
["","","","","","","","",""],
["","炮","","","","","","炮",""],
["卒","","卒","","卒","","卒","","卒"],
["","","","","","","","",""],
["","","","","","","","",""],
["兵","","兵","","兵","","兵","","兵"],
["","炮","","","","","","炮",""],
["","","","","","","","",""],
["车","马","相","仕","帅","仕","相","马","车"]
];


let selected=null;


// 绘制棋盘

function draw(){

ctx.clearRect(0,0,450,500);


// 棋盘线

ctx.strokeStyle="#7b3f00";
ctx.lineWidth=2;


for(let i=0;i<10;i++){

ctx.beginPath();
ctx.moveTo(size,i*size);
ctx.lineTo(400,i*size);
ctx.stroke();

}

for(let i=0;i<9;i++){

ctx.beginPath();
ctx.moveTo(i*size,0);
ctx.lineTo(i*size,450);
ctx.stroke();

}


// 楚河汉界

ctx.font="28px serif";
ctx.fillText("楚 河",120,250);
ctx.fillText("汉 界",280,250);


// 棋子

for(let y=0;y<10;y++){

for(let x=0;x<9;x++){

let p=board[y][x];

if(p){

ctx.beginPath();

ctx.arc(
x*size,
y*size,
20,
0,
Math.PI*2
);


ctx.fillStyle="#fff2c2";
ctx.fill();

ctx.strokeStyle="#8b0000";
ctx.stroke();


ctx.fillStyle=
y<5?"#b22222":"#000";


ctx.font="25px serif";

ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
p,
x*size,
y*size
);

}

}

}


// 选中

if(selected){

ctx.strokeStyle="blue";
ctx.lineWidth=3;

ctx.strokeRect(
selected.x*size-22,
selected.y*size-22,
44,
44
);

}

}



canvas.onclick=function(e){

let rect=canvas.getBoundingClientRect();

let x=Math.round(
(e.clientX-rect.left)/size
);

let y=Math.round(
(e.clientY-rect.top)/size
);


if(selected){

move(
selected.x,
selected.y,
x,
y
);

selected=null;

}
else if(board[y][x]){

selected={x,y};

}

draw();

};



function move(x1,y1,x2,y2){


if(board[y2][x2]===""){

board[y2][x2]=board[y1][x1];

board[y1][x1]="";

ai();

}

}



function ai(){

setTimeout(()=>{


let moves=[];


for(let y=0;y<5;y++){

for(let x=0;x<9;x++){

if(board[y][x]){


let nx=x;

let ny=y+1;


if(ny<10){

moves.push([
x,y,nx,ny
]);

}


}

}

}


if(moves.length){

let m=
moves[Math.floor(Math.random()*moves.length)];


board[m[3]][m[2]]
=
board[m[1]][m[0]];


board[m[1]][m[0]]
="";

draw();

}


},500);

}




function restart(){

board=[
["车","马","象","士","将","士","象","马","车"],
["","","","","","","","",""],
["","炮","","","","","","炮",""],
["卒","","卒","","卒","","卒","","卒"],
["","","","","","","","",""],
["","","","","","","","",""],
["兵","","兵","","兵","","兵","","兵"],
["","炮","","","","","","炮",""],
["","","","","","","","",""],
["车","马","相","仕","帅","仕","相","马","车"]
];

draw();

}


draw();

</script>

</body>
</html>
