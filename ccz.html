<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171e3c">
<title>珠子归位 · Deluxe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html, body {
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:#3a3c59;
    color:#fff; padding:14px; padding:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  /* 漂浮装饰 */
  .bg-orb { position:fixed; border-radius:50%; filter:blur(60px); opacity:.25; pointer-events:none; z-index:0; }
  .orb1 { width:300px; height:300px; background:#ff6b6b; top:-80px; left:-80px; }
  .orb2 { width:260px; height:260px; background:#4ecdc4; bottom:-60px; right:-60px; }
  .orb3 { width:200px; height:200px; background:#a78bfa; top:40%; left:70%; }

  header { z-index:1; text-align:center; margin-bottom:10px; }
  h1 { font-size:24px; letter-spacing:6px;
       background:linear-gradient(90deg,#ffd76e,#ff9f43,#ffd76e);
       -webkit-background-clip:text; background-clip:text; color:transparent;
       filter:drop-shadow(0 2px 8px rgba(255,160,60,.4)); }
  .subtitle { font-size:12px; opacity:.6; margin-top:2px; letter-spacing:2px; }

  /* 状态栏 */
  .stats { z-index:1; display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; justify-content:center; }
  .stat {
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    border-radius:14px; padding:6px 16px; text-align:center; backdrop-filter:blur(8px);
    min-width:72px;
  }
  .stat .label { font-size:11px; opacity:.6; }
  .stat .value { font-size:20px; font-weight:bold; color:#ffd76e; font-variant-numeric:tabular-nums; }
  .stat.gold .value { color:#8ef7b0; }

  /* 难度选择 */
  .diff { z-index:1; display:flex; gap:6px; margin-bottom:14px; }
  .diff button {
    padding:6px 14px; border-radius:16px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.07); color:#fff; cursor:pointer; font-size:13px;
    transition:all .2s;
  }
  .diff button.active { background:linear-gradient(135deg,#ffd76e,#ff9f43); color:#5a3a00; font-weight:bold; border-color:transparent; }

  /* 棋盘 */
  #board { z-index:1; display:grid; gap:10px; justify-content:center; margin-bottom:14px; }
  .slot {
    width:54px; height:232px; border-radius:14px; cursor:pointer;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.09));
    border:2px solid rgba(255,255,255,.14);
    display:flex; flex-direction:column-reverse; align-items:center;
    padding:5px 0; transition:border-color .15s, background .15s, box-shadow .15s; position:relative;
    will-change:transform;
  }
  .slot::before { content:''; position:absolute; inset:0; border-radius:14px;
    box-shadow:inset 0 8px 18px rgba(0,0,0,.35); pointer-events:none; }
  @media (hover:hover) {
    .slot:hover { transform:translateY(-3px); border-color:rgba(255,255,255,.35); }
  }
  .slot:active { transform:scale(.96); transition:transform .05s; }
  .slot.selected { border-color:#ffd76e; background:rgba(255,215,110,.15);
    box-shadow:0 0 18px rgba(255,215,110,.45), inset 0 0 12px rgba(255,215,110,.15); }
  .slot.can-drop { border-color:rgba(140,255,180,.7); animation:glow 1.1s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 16px rgba(140,255,180,.55); } }
  .slot.full-blink { animation:shake .25s; }
  @keyframes shake { 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }

  .bead {
    width:38px; height:38px; border-radius:50%; margin-top:3px; position:relative;
    box-shadow: inset -3px -5px 8px rgba(0,0,0,.4),
                inset 3px 4px 8px rgba(255,255,255,.5),
                0 3px 6px rgba(0,0,0,.45);
    animation:drop .28s cubic-bezier(.34,1.56,.64,1);
    transition:transform .18s;
  }
  .bead::after { content:''; position:absolute; top:15%; left:20%; width:32%; height:26%;
    border-radius:50%; background:rgba(255,255,255,.75); filter:blur(1.5px); }
  @keyframes drop { from { transform:translateY(-36px) scale(.85); opacity:0; } }
  .bead.done { animation:pop .5s; }
  @keyframes pop { 30% { transform:scale(1.22); } }

  /* 按钮组 */
  .controls { z-index:1; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .btn {
    padding:10px 20px; border:none; border-radius:22px; cursor:pointer;
    background:rgba(255,255,255,.1); color:#fff; font-size:14px; font-weight:bold;
    border:1px solid rgba(255,255,255,.2); backdrop-filter:blur(6px); transition:all .15s;
  }
  .btn:hover { background:rgba(255,255,255,.2); }
  .btn:active { transform:scale(.94); }
  .btn.primary { background:linear-gradient(135deg,#ffd76e,#ff9f43); color:#5a3a00; border:none; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }

  #msg { z-index:1; margin-top:10px; font-size:14px; min-height:20px; color:#ffb3b3; transition:opacity .3s; }

  /* 胜利弹窗 */
  #win {
    position:fixed; inset:0; background:rgba(8,10,25,.82); backdrop-filter:blur(6px);
    display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20;
  }
  #win .card {
    background:linear-gradient(160deg, rgba(60,70,120,.95), rgba(30,38,80,.95));
    border:1px solid rgba(255,255,255,.2); border-radius:24px; padding:34px 44px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.6);
    animation:cardIn .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cardIn { from { transform:scale(.6) translateY(40px); opacity:0; } }
  #win h2 { font-size:32px; color:#ffd76e; margin-bottom:6px; }
  #win .stars { font-size:26px; letter-spacing:6px; margin-bottom:10px; }
  #win p { font-size:15px; opacity:.9; margin-bottom:6px; line-height:1.7; }
  #win .record { color:#8ef7b0; font-weight:bold; }

  /* 星星评级说明 */
  .star-guide { z-index:1; font-size:11px; opacity:.5; margin-top:10px; text-align:center; }

  /* ============ 手机端适配 ============ */
  @media (max-width: 600px) {
    body { padding:8px; padding:max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
    h1 { font-size:18px; letter-spacing:4px; }
    .subtitle { font-size:10px; }
    .stats { gap:5px; margin-bottom:8px; }
    .stat { padding:4px 10px; min-width:56px; border-radius:10px; }
    .stat .label { font-size:9px; }
    .stat .value { font-size:16px; }
    .diff { gap:4px; margin-bottom:10px; }
    .diff button { padding:5px 10px; font-size:11px; border-radius:12px; }
    #board { gap:6px; margin-bottom:10px; }
    .slot { width:38px; height:165px; border-radius:10px; padding:3px 0; }
    .slot::before { border-radius:10px; }
    .bead { width:27px; height:27px; margin-top:2px; }
    .controls { gap:6px; }
    .btn { padding:8px 14px; font-size:12px; border-radius:18px; }
    #msg { font-size:12px; }
    .star-guide { font-size:9px; }
    #win .card { padding:24px 28px; border-radius:18px; }
    #win h2 { font-size:24px; }
    #win .stars { font-size:20px; }
    #win p { font-size:13px; }
  }

  @media (max-width: 400px) {
    .slot { width:32px; height:140px; border-radius:8px; }
    .bead { width:22px; height:22px; }
    #board { gap:4px; }
    h1 { font-size:16px; letter-spacing:3px; }
  }

  /* 横屏手机 */
  @media (max-height: 500px) and (orientation: landscape) {
    body { flex-direction:row; flex-wrap:wrap; justify-content:center; }
    header { width:100%; margin-bottom:5px; }
    h1 { font-size:16px; }
    .stats { margin-bottom:5px; }
    .diff { margin-bottom:5px; }
    #board { margin:0 10px; }
    .slot { height:120px; }
    .bead { height:18px; width:18px; }
    .controls { width:100%; }
  }
</style>
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div>

<header>
  <h1>珠 子 归 位</h1>
  <div class="subtitle">DELUXE EDITION</div>
</header>

<div class="stats">
  <div class="stat"><div class="label">步数</div><div class="value" id="moves">0</div></div>
  <div class="stat"><div class="label">时间</div><div class="value" id="timer">0:00</div></div>
  <div class="stat gold"><div class="label">最佳</div><div class="value" id="best">—</div></div>
</div>

<div class="diff" id="diff">
  <button data-level="0">Easy · 4色</button>
  <button data-level="1" class="active">Normal · 6色</button>
  <button data-level="2">Hard · 7色</button>
</div>

<div id="board"></div>

<div class="controls">
  <button class="btn" id="undoBtn" onclick="undo()">↩️ 撤销</button>
  <button class="btn" onclick="showHint()">💡 提示</button>
  <button class="btn primary" onclick="newGame()">🔄 新游戏</button>
  <button class="btn" id="soundBtn" onclick="toggleSound()">🔊 音效</button>
</div>

<div id="msg"></div>
<div class="star-guide">⭐ 目标步数内 = 3星 ｜ 超过 = 2星 ｜ 完成即 1星</div>

<div id="win"><div class="card">
  <h2>🎉 归位成功！</h2>
  <div class="stars" id="stars"></div>
  <p>步数：<b id="wMoves"></b> ｜ 用时：<b id="wTime"></b></p>
  <p id="wRecord"></p>
  <button class="btn primary" style="margin-top:14px" onclick="newGame()">再来一局</button>
</div></div>

<script>
/* ============ 配置 ============ */
// 色相环均匀分布的高对比度颜色 (HSL色相角: 0°,45°,90°,135°,180°,225°,270°,315°)
const COLORS = [
  ['#ff3333','#990000'], // 红色 0°
  ['#ff9900','#995c00'], // 橙色 39°
  ['#ffdd00','#998500'], // 黄色 51°
  ['#66ff00','#3d9900'], // 黄绿 96°
  ['#00ff99','#00995c'], // 青绿 156°
  ['#0099ff','#005c99'], // 天蓝 204°
  ['#6600ff','#3d0099'], // 紫色 264°
  ['#ff00cc','#99007a'], // 品红 306°
  ['#ff6699','#993d5c']  // 粉红 336°
];
const LEVELS = [
  { colors: 4, extra: 2, cap: 8, par: 30 },
  { colors: 6, extra: 2, cap: 8, par: 55 },
  { colors: 7, extra: 3, cap: 8, par: 80 },
];

let cols, moves, selected = -1, level = 1;
let history = [], timerId = null, startTime = 0, seconds = 0;
let soundOn = true;
let clickLock = false; // 点击防抖锁
const CLICK_DELAY = 120; // 点击间隔(ms)

// 优化：缓存 topRun 结果，避免重复计算
let topRunCache = new Map();
// 优化：维护已排序列的计数器，O(1) 判断胜负
let sortedCount = 0;

/* ============ 音效（Web Audio，无需文件） ============ */
let audioCtx = null;
function beep(freq, dur = .1, type = 'sine', vol = .15) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const sfx = {
  pick:   () => beep(520, .08, 'triangle'),
  drop:   () => { beep(440, .07); setTimeout(()=>beep(660, .08), 40); },
  error:  () => beep(160, .18, 'sawtooth', .1),
  undo:   () => beep(300, .1, 'triangle'),
  win:    () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.2), i*130)),
};

/* ============ 核心 ============ */
function newGame() {
  const L = LEVELS[level];
  moves = 0; selected = -1; history = []; seconds = 0;
  slotEls = []; // 重置slot缓存
  topRunCache.clear(); // 清空缓存
  document.getElementById('win').style.display = 'none';
  msg('');
  updateMoves(); startTimer();

  let pool = [];
  for (let i = 0; i < L.colors; i++)
    for (let j = 0; j < L.cap; j++) pool.push(i);

  // 优化：生成可解的游戏布局
  let attempts = 0;
  const maxAttempts = 100;
  do {
    // Fisher-Yates 洗牌
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    cols = [];
    for (let i = 0; i < L.colors; i++) cols.push(pool.slice(i * L.cap, (i + 1) * L.cap));
    attempts++;
  } while (isWin() && attempts < maxAttempts);

  // 添加空列
  for (let i = 0; i < L.extra; i++) cols.push([]);

  updateSortedCount(); // 初始化排序计数
  render();
}

// 优化：检查是否陷入死局（无有效移动）
function isStuck() {
  const cap = LEVELS[level].cap;
  for (let s = 0; s < cols.length; s++) {
    if (!cols[s].length) continue;
    const n = topRun(s), color = cols[s].at(-1);
    for (let t = 0; t < cols.length; t++) {
      if (t === s) continue;
      const tc = cols[t];
      if (tc.length + n > cap) continue;
      if (tc.length > 0 && tc.at(-1) !== color) continue;
      return false; // 找到有效移动
    }
  }
  return true;
}

function topRun(ci) {  // 顶部连续同色数量（带缓存）
  if (topRunCache.has(ci)) return topRunCache.get(ci);
  const c = cols[ci];
  if (!c.length) { topRunCache.set(ci, 0); return 0; }
  let n = 1;
  for (let i = c.length - 2; i >= 0 && c[i] === c[c.length - 1]; i--) n++;
  topRunCache.set(ci, n);
  return n;
}

// 优化：判断单列是否已排序
function isColSorted(ci) {
  const c = cols[ci];
  return c.length === 0 || c.every(x => x === c[0]);
}

// 优化：更新已排序列计数
function updateSortedCount() {
  sortedCount = 0;
  for (let i = 0; i < cols.length; i++) {
    if (isColSorted(i)) sortedCount++;
  }
}
function beadColor(id) { return COLORS[id][0]; }

function clickSlot(i) {
  if (clickLock) return; // 防抖：忽略快速重复点击
  clickLock = true;
  setTimeout(() => clickLock = false, CLICK_DELAY);

  msg('');
  if (selected === -1) {
    if (!cols[i].length) { msg('这列是空的，选有珠子的列'); sfx.error(); return; }
    selected = i; sfx.pick(); render(); return;
  }
  if (i === selected) { selected = -1; render(); return; }

  const n = topRun(selected), color = cols[selected].at(-1), t = cols[i];
  const canColor = t.length === 0 || t.at(-1) === color;

  if (canColor && t.length + n <= LEVELS[level].cap) {
    // 优化：记录移动前的排序状态，增量更新
    const fromSortedBefore = isColSorted(selected);
    const toSortedBefore = isColSorted(i);

    history.push({ from: selected, to: i, n });
    t.push(...cols[selected].splice(cols[selected].length - n, n));
    moves++; updateMoves();
    selected = -1; sfx.drop();

    // 优化：增量更新排序计数
    topRunCache.delete(selected); // 清除源列缓存
    topRunCache.delete(i); // 清除目标列缓存
    const fromSortedAfter = isColSorted(selected);
    const toSortedAfter = isColSorted(i);
    if (fromSortedBefore && !fromSortedAfter) sortedCount--;
    else if (!fromSortedBefore && fromSortedAfter) sortedCount++;
    if (toSortedBefore && !toSortedAfter) sortedCount--;
    else if (!toSortedBefore && toSortedAfter) sortedCount++;

    render();
    // 优化：O(1) 判断胜负
    if (sortedCount === cols.length) setTimeout(win, 350);
  } else {
    const slotEl = slotEls[i]; // 优化：使用缓存的 DOM 元素
    if (slotEl) {
      slotEl.classList.add('full-blink');
      setTimeout(() => slotEl.classList.remove('full-blink'), 280);
    }
    msg(!canColor ? '⚠️ 只能放入空列或底部同色的列' : '⚠️ 空间不足，放不下这一串');
    sfx.error();
    selected = -1; render();
  }
}

function undo() {
  if (!history.length) return;
  const { from, to, n } = history.pop();

  // 优化：记录移动前的排序状态
  const fromSortedBefore = isColSorted(from);
  const toSortedBefore = isColSorted(to);

  cols[from].push(...cols[to].splice(cols[to].length - n, n));

  // 优化：增量更新排序计数
  topRunCache.delete(from);
  topRunCache.delete(to);
  const fromSortedAfter = isColSorted(from);
  const toSortedAfter = isColSorted(to);
  if (fromSortedBefore && !fromSortedAfter) sortedCount--;
  else if (!fromSortedBefore && fromSortedAfter) sortedCount++;
  if (toSortedBefore && !toSortedAfter) sortedCount--;
  else if (!toSortedBefore && toSortedAfter) sortedCount++;

  moves = Math.max(0, moves - 1); updateMoves();
  selected = -1; sfx.undo(); msg('已撤销一步'); render();
}

/* ============ 提示：贪心找一步“有效合并” ============ */
function showHint() {
  const cap = LEVELS[level].cap;
  let bestScore = -Infinity;
  let bestMove = null;

  // 评估所有可能的移动
  for (let s = 0; s < cols.length; s++) {
    if (!cols[s].length) continue;
    const n = topRun(s), color = cols[s].at(-1);

    for (let t = 0; t < cols.length; t++) {
      if (t === s) continue;
      const tc = cols[t];
      if (tc.length + n > cap) continue;
      if (tc.length > 0 && tc.at(-1) !== color) continue;

      // 评分函数：评估这个移动的价值
      const score = evaluateMove(s, t, n, color, cap);
      if (score > bestScore) {
        bestScore = score;
        bestMove = { from: s, to: t };
      }
    }
  }

  if (bestMove) {
    flash(bestMove.from, bestMove.to);
  } else {
    msg('暂无更好的建议，试试重新布局 🤔');
  }
}

// 优化：评分函数，评估移动的价值
function evaluateMove(from, to, n, color, cap) {
  let score = 0;
  const fromCol = cols[from];
  const toCol = cols[to];

  // 1. 完成一列的奖励（最高优先级）
  if (toCol.length + n === cap && (toCol.length === 0 || toCol.at(-1) === color)) {
    score += 1000;
  }

  // 2. 合并同色的奖励
  if (toCol.length > 0 && toCol.at(-1) === color) {
    score += 100 + n * 10;
    // 额外奖励：如果合并后该列接近完成
    if (toCol.length + n >= cap - 1) score += 50;
  }

  // 3. 移动到空列的惩罚（除非必要）
  if (toCol.length === 0) {
    score -= 30;
    // 但如果源列顶部颜色与底部不同，移动到空列是合理的
    if (fromCol.length > n && fromCol[0] !== color) {
      score += 20;
    }
  }

  // 4. 暴露新颜色的奖励（如果移动后源列底部颜色统一）
  if (fromCol.length > n) {
    const newTop = fromCol[fromCol.length - 1 - n];
    let sameCount = 1;
    for (let i = fromCol.length - 2 - n; i >= 0 && fromCol[i] === newTop; i--) sameCount++;
    score += sameCount * 5;
  }

  // 5. 避免"死锁"：如果目标列快满了且颜色不一致，降低分数
  if (toCol.length > 0 && toCol.length >= cap - 1 && toCol.at(-1) !== color) {
    score -= 200;
  }

  return score;
}
function flash(a, b) {
  // 优化：使用缓存的 DOM 元素
  [a, b].forEach((idx, k) => {
    setTimeout(() => {
      slotEls[idx].classList.add('selected');
      setTimeout(() => render(), 900);
    }, k * 300);
  });
  msg(`💡 试试从第 ${a + 1} 列 → 第 ${b + 1} 列`);
}

/* ============ 胜负 ============ */
function isWin() {
  // 优化：使用计数器 O(1) 判断
  return sortedCount === cols.length;
}
function win() {
  stopTimer(); sfx.win();
  const L = LEVELS[level];
  const stars = moves <= L.par ? '⭐⭐⭐' : moves <= L.par * 1.5 ? '⭐⭐' : '⭐';
  document.getElementById('stars').textContent = stars;
  document.getElementById('wMoves').textContent = moves;
  document.getElementById('wTime').textContent = fmt(seconds);

  const key = 'ballsort_best_' + level;
  const prev = +localStorage.getItem(key) || Infinity;
  let rec = '';
  if (moves < prev) {
    localStorage.setItem(key, moves);
    rec = '🏆 新纪录！'; updateBest();
  } else rec = `历史最佳：${prev} 步`;
  document.getElementById('wRecord').innerHTML = `<span class="record">${rec}</span>`;
  document.getElementById('win').style.display = 'flex';
  confetti();
}
function confetti() {
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    const c = COLORS[Math.floor(Math.random() * COLORS.length)][0];
    p.style.cssText = `position:fixed;width:8px;height:14px;background:${c};
      left:${Math.random()*100}vw;top:-20px;z-index:19;pointer-events:none;border-radius:2px;`;
    document.body.appendChild(p);
    const fall = p.animate([
      { transform:`translateY(0) rotate(0)`, opacity:1 },
      { transform:`translateY(105vh) rotate(${720*Math.random()}deg)`, opacity:.4 }
    ], { duration: 1800 + Math.random()*1500, easing:'cubic-bezier(.2,.6,.8,1)' });
    fall.onfinish = () => p.remove();
  }
}

/* ============ 渲染（局部更新，避免闪动） ============ */
let slotEls = []; // 缓存slot DOM元素
let prevColLengths = []; // 优化：记录上次的珠子数量，避免重复比较

function render() {
  const board = document.getElementById('board');
  const isMobile = window.innerWidth <= 600;
  const slotWidth = isMobile ? (window.innerWidth <= 400 ? 32 : 38) : 54;
  board.style.gridTemplateColumns = `repeat(${cols.length}, ${slotWidth}px)`;

  // 首次渲染：创建所有slot元素
  if (slotEls.length !== cols.length) {
    board.innerHTML = '';
    slotEls = [];
    prevColLengths = [];
    cols.forEach((col, i) => {
      const s = document.createElement('div');
      s.className = 'slot';
      s.onclick = () => clickSlot(i);
      board.appendChild(s);
      slotEls.push(s);
      prevColLengths.push(col.length);
    });
  }

  // 优化：预计算选中列的信息，避免重复计算
  const selTopRun = selected >= 0 ? topRun(selected) : 0;
  const selColor = selected >= 0 ? cols[selected].at(-1) : -1;
  const cap = LEVELS[level].cap;

  // 局部更新每个slot
  cols.forEach((col, i) => {
    const s = slotEls[i];
    if (!s) return;

    // 更新选中状态
    s.classList.toggle('selected', i === selected);

    // 优化：使用预计算的值判断可放置
    let canDrop = false;
    if (selected >= 0 && i !== selected) {
      canDrop = (col.length === 0 || col.at(-1) === selColor) && col.length + selTopRun <= cap;
    }
    s.classList.toggle('can-drop', canDrop);

    // 优化：只在珠子数量变化时更新珠子，使用缓存的长度比较
    if (prevColLengths[i] !== col.length) {
      prevColLengths[i] = col.length;
      s.innerHTML = '';
      // 优化：使用 DocumentFragment 减少重排
      const fragment = document.createDocumentFragment();
      col.forEach((c, j) => {
        const b = document.createElement('div');
        b.className = 'bead';
        b.style.background = `radial-gradient(circle at 35% 30%, #ffffffcc, ${beadColor(c)} 60%, ${COLORS[c][1]})`;
        fragment.appendChild(b);
      });
      s.appendChild(fragment);
    }
  });

  document.getElementById('undoBtn').disabled = !history.length;
}

/* ============ 杂项 ============ */
function msg(t) {
  const m = document.getElementById('msg');
  m.textContent = t; m.style.color = t.startsWith('💡') ? '#ffd76e' : t.startsWith('已') ? '#8ef7b0' : '#ffb3b3';
}
function updateMoves() { document.getElementById('moves').textContent = moves; }
function updateBest() {
  const b = localStorage.getItem('ballsort_best_' + level);
  document.getElementById('best').textContent = b ? b + '步' : '—';
}
function startTimer() {
  clearInterval(timerId); startTime = Date.now();
  timerId = setInterval(() => {
    seconds = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timer').textContent = fmt(seconds);
  }, 500);
}
function stopTimer() { clearInterval(timerId); }
function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊 音效' : '🔇 静音';
}

document.getElementById('diff').addEventListener('click', e => {
  if (!e.target.dataset.level) return;
  level = +e.target.dataset.level;
  document.querySelectorAll('.diff button').forEach(b => b.classList.toggle('active', b === e.target));
  updateBest(); newGame();
});
document.addEventListener('keydown', e => {
  if (e.key === 'z' || e.key === 'Z') undo();
  if (e.key === 'Escape') { selected = -1; render(); }
  if (e.key >= '1' && e.key <= '9') clickSlot(+e.key - 1);
});

updateBest(); newGame();
</script>
</body>
