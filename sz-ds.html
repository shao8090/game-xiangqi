<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>数字归位 · 华容道</title>
<style>
*{box-sizing:border-box;user-select:none;}
html,body{width:100%;}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#0b1a2e 0%,#1b2f44 100%);display:flex;justify-content:center;align-items:flex-start;font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;padding:0;}
.game-wrapper{width:100%;max-width:560px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px);border-radius:0;padding:12px 6px 20px;box-shadow:0 25px 50px -8px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.04);transition:.25s;}
.game-container{width:100%;max-width:100%;margin:0 auto;padding:0;}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;color:#e8f0fe;padding:0 4px;}
.title{font-size:26px;font-weight:600;letter-spacing:1px;background:linear-gradient(135deg,#f0e9d8,#b8d0e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 2px 8px rgba(0,20,40,.5);}
.title small{font-size:14px;font-weight:400;-webkit-text-fill-color:#8aa3c0;background:none;margin-left:8px;}
.stats{display:flex;gap:20px;font-size:15px;font-weight:500;background:rgba(0,0,0,.25);padding:8px 16px;border-radius:40px;backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,.06);}
.stats span{color:#b6d0e8;}
.stats strong{color:#f2f9ff;font-weight:600;min-width:28px;display:inline-block;text-align:center;}
.board{display:grid;gap:5px;background:rgba(0,0,0,.35);border-radius:14px;padding:6px;box-shadow:inset 0 4px 12px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.04);aspect-ratio:1/1;width:100%;margin-bottom:16px;transition:.2s;}
.board.size-4{grid-template-columns:repeat(4,1fr);}
.board.size-5{grid-template-columns:repeat(5,1fr);}
.board.size-6{grid-template-columns:repeat(6,1fr);}
.tile{background:radial-gradient(circle at 30% 30%,#f5f9ff,#c8d8ee);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,9.5vw,40px);font-weight:700;color:#1d3146;cursor:pointer;box-shadow:0 4px 0 #8a9fb0,0 6px 14px rgba(0,0,0,.25);transition:all .12s cubic-bezier(.34,1.56,.64,1);aspect-ratio:1/1;text-shadow:0 1px 2px rgba(255,255,255,.3);will-change:transform;position:relative;line-height:1;}
.board.size-5 .tile{font-size:clamp(15px,7vw,32px);}
.board.size-6 .tile{font-size:clamp(12px,5.5vw,26px);}
.tile:hover:not(.empty){transform:scale(1.02);filter:brightness(1.05);}
.tile:active:not(.empty){transform:scale(.94);box-shadow:0 2px 0 #6a7f90;}
.tile.empty{background:transparent;box-shadow:none;cursor:default;transform:none !important;filter:none !important;color:transparent;}
.tile[data-value="1"]{background:radial-gradient(circle at 30% 30%,#f9f1e0,#e4cfb0);}
.tile[data-value="2"]{background:radial-gradient(circle at 30% 30%,#e0f0f9,#b8d4e8);}
.tile[data-value="3"]{background:radial-gradient(circle at 30% 30%,#e6f0da,#c6dbb0);}
.tile[data-value="4"]{background:radial-gradient(circle at 30% 30%,#f9e6e6,#e8c8c8);}
.tile[data-value="5"]{background:radial-gradient(circle at 30% 30%,#f0e6f9,#d8c8e8);}
.tile[data-value="6"]{background:radial-gradient(circle at 30% 30%,#e6f9f0,#b8e0d0);}
.tile[data-value="7"]{background:radial-gradient(circle at 30% 30%,#f9f0e6,#e8d4b8);}
.tile[data-value="8"]{background:radial-gradient(circle at 30% 30%,#e6eaf9,#b8c8e8);}
.tile[data-value="9"]{background:radial-gradient(circle at 30% 30%,#f9e6f0,#e8c8d8);}
.tile[data-value="10"]{background:radial-gradient(circle at 30% 30%,#e6f9e6,#b8dbb8);}
.tile[data-value="11"]{background:radial-gradient(circle at 30% 30%,#f9f0e6,#e8dcc8);}
.tile[data-value="12"]{background:radial-gradient(circle at 30% 30%,#e0eaf9,#b8cce8);}
.tile[data-value="13"]{background:radial-gradient(circle at 30% 30%,#f9e6e6,#e8c8c0);}
.tile[data-value="14"]{background:radial-gradient(circle at 30% 30%,#e6f0f9,#b8d4e0);}
.tile[data-value="15"]{background:radial-gradient(circle at 30% 30%,#f0e6e6,#d8c8c0);}
.tile[data-value="16"]{background:radial-gradient(circle at 30% 30%,#e6f9f0,#b8e0c8);}
.tile[data-value="17"]{background:radial-gradient(circle at 30% 30%,#f9e6e8,#e8c8d0);}
.tile[data-value="18"]{background:radial-gradient(circle at 30% 30%,#e8e6f9,#c8c8e8);}
.tile[data-value="19"]{background:radial-gradient(circle at 30% 30%,#f9f0e6,#e8d8c0);}
.tile[data-value="20"]{background:radial-gradient(circle at 30% 30%,#e6f0f9,#b8d0e8);}
.tile[data-value="21"]{background:radial-gradient(circle at 30% 30%,#f0f9e6,#d0e8b8);}
.tile[data-value="22"]{background:radial-gradient(circle at 30% 30%,#f9e6f0,#e8c8d8);}
.tile[data-value="23"]{background:radial-gradient(circle at 30% 30%,#e6f9e8,#b8e0d0);}
.tile[data-value="24"]{background:radial-gradient(circle at 30% 30%,#f0e6f9,#d0c8e8);}
.tile[data-value="25"]{background:radial-gradient(circle at 30% 30%,#f9e8e6,#e8ccc8);}
.tile[data-value="26"]{background:radial-gradient(circle at 30% 30%,#e6f9f9,#b8e0e0);}
.tile[data-value="27"]{background:radial-gradient(circle at 30% 30%,#f9f9e6,#e8e8c0);}
.tile[data-value="28"]{background:radial-gradient(circle at 30% 30%,#e8f9e6,#c0e0b8);}
.tile[data-value="29"]{background:radial-gradient(circle at 30% 30%,#f9e6e6,#e8c8c8);}
.tile[data-value="30"]{background:radial-gradient(circle at 30% 30%,#e6e8f9,#b8c8e8);}
.tile[data-value="31"]{background:radial-gradient(circle at 30% 30%,#f9f0e8,#e8dcc8);}
.tile[data-value="32"]{background:radial-gradient(circle at 30% 30%,#e8f9f0,#c0e0d0);}
.tile[data-value="33"]{background:radial-gradient(circle at 30% 30%,#f9e8f0,#e8c8d8);}
.tile[data-value="34"]{background:radial-gradient(circle at 30% 30%,#e6f9e6,#b8e0b8);}
.tile[data-value="35"]{background:radial-gradient(circle at 30% 30%,#f0f0f9,#d0d0e8);}
.size-selector{display:flex;justify-content:center;gap:8px;margin-bottom:14px;}
.size-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);padding:8px 20px;border-radius:20px;font-size:14px;font-weight:600;color:#b6d0e8;cursor:pointer;transition:all .2s;}
.size-btn:hover{background:rgba(255,255,255,.12);color:#e8f0fe;}
.size-btn.active{background:linear-gradient(135deg,#4f8cc9,#2c5f8f);border-color:rgba(255,255,255,.20);color:#fff;box-shadow:0 4px 12px rgba(40,100,180,.3);}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:0 4px;}
.btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);padding:12px 24px;border-radius:40px;font-size:16px;font-weight:600;color:#e8f0fe;cursor:pointer;backdrop-filter:blur(4px);transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.2);display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.3px;flex:1 1 auto;}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.20);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3);}
.btn:active{transform:translateY(0);box-shadow:0 2px 8px rgba(0,0,0,.2);}
.btn-primary{background:linear-gradient(135deg,#4f8cc9,#2c5f8f);border-color:rgba(255,255,255,.15);color:#fff;box-shadow:0 4px 16px rgba(40,100,180,.3);}
.btn-primary:hover{background:linear-gradient(135deg,#5f9cd9,#3a6f9f);box-shadow:0 8px 24px rgba(40,100,180,.4);}
.btn-success{background:linear-gradient(135deg,#3ba37a,#1e7a58);border-color:rgba(255,255,255,.10);color:#fff;box-shadow:0 4px 16px rgba(30,130,80,.25);}
.btn-success:hover{background:linear-gradient(135deg,#4bb38a,#2a8a68);}
.btn:disabled{opacity:.4;pointer-events:none;transform:none !important;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:999;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:linear-gradient(145deg,#1d3146,#142433);border-radius:40px;padding:40px 32px 36px;max-width:400px;width:100%;text-align:center;border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 80px rgba(0,0,0,.6);animation:modalPop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes modalPop{0%{transform:scale(.8);opacity:0;}100%{transform:scale(1);opacity:1;}}
.modal .emoji{font-size:64px;margin-bottom:8px;display:block;}
.modal h2{color:#f2f9ff;font-size:28px;font-weight:700;margin:8px 0;letter-spacing:.5px;}
.modal p{color:#b0c8e0;font-size:17px;margin:8px 0 24px;line-height:1.6;}
.modal .btn{width:100%;padding:14px;font-size:18px;}
@media (max-width:500px){
.game-wrapper{padding:10px 4px 16px;}
.board{gap:4px;padding:5px;border-radius:12px;margin-bottom:14px;}
.tile{border-radius:9px;box-shadow:0 3px 0 #8a9fb0,0 4px 8px rgba(0,0,0,.2);}
.header{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px;}
.stats{justify-content:space-around;padding:6px 12px;font-size:14px;}
.title{font-size:20px;text-align:center;}
.size-btn{padding:6px 14px;font-size:12px;}
.controls{gap:8px;}
.controls .btn{font-size:14px;padding:10px 12px;flex:1 1 30%;}
.modal{padding:32px 24px 28px;}
.modal h2{font-size:24px;}
}
@media (max-width:360px){
.board{gap:3px;padding:4px;border-radius:10px;}
.tile{border-radius:7px;box-shadow:0 2px 0 #8a9fb0;}
.stats{font-size:12px;gap:12px;}
.controls .btn{font-size:13px;padding:9px 8px;}
}
</style>
</head>
<body>

<!-- 游戏卡片 -->
<div class="game-wrapper">
<div class="game-container">

<!-- 头部：标题 + 统计 -->
<div class="header">
<div class="title">
🧩 归位
<small id="sizeLabel">4×4</small>
</div>
<div class="stats">
<span>步数 <strong id="moveCount">0</strong></span>
<span>⏱ <strong id="timerDisplay">0</strong>s</span>
</div>
</div>

<!-- 大小选择器 -->
<div class="size-selector">
<button class="size-btn active" data-size="4">4×4</button>
<button class="size-btn" data-size="5">5×5</button>
<button class="size-btn" data-size="6">6×6</button>
</div>

<!-- 棋盘 -->
<div class="board size-4" id="board"></div>

<!-- 控制按钮 -->
<div class="controls">
<button class="btn btn-primary" id="shuffleBtn">🎲 打乱</button>
<button class="btn" id="resetBtn">⟳ 重置</button>
<button class="btn btn-success" id="solveBtn" disabled>✨ 完成</button>
</div>

<p id="hintText" style="color:#7a95b0;font-size:13px;text-align:center;margin-top:16px;opacity:.7;letter-spacing:.3px;">
点击同行/同列数字批量移动 · 目标 1~15 顺序排列
</p>
</div>
</div>

<!-- 胜利弹窗 -->
<div class="modal-overlay" id="winModal">
<div class="modal">
<span class="emoji">🎉</span>
<h2>完美归位！</h2>
<p id="winMessage">你用了 0 步，耗时 0 秒</p>
<button class="btn btn-primary" id="winContinueBtn">🔄 再来一局</button>
</div>
</div>

<script>
(function() {
'use strict';

// ---------- 配置 ----------
let SIZE = 4;
let TOTAL_TILES = SIZE * SIZE;
const EMPTY_VALUE = 0;

// DOM 引用
const boardEl = document.getElementById('board');
const moveCountEl = document.getElementById('moveCount');
const timerDisplayEl = document.getElementById('timerDisplay');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');
const solveBtn = document.getElementById('solveBtn');
const winModal = document.getElementById('winModal');
const winMessage = document.getElementById('winMessage');
const winContinueBtn = document.getElementById('winContinueBtn');
const sizeLabel = document.getElementById('sizeLabel');
const sizeBtns = document.querySelectorAll('.size-btn');
const hintText = document.getElementById('hintText');

// ---------- 状态 ----------
let tiles = [];
let emptyIndex = 0;
let moves = 0;
let timerSeconds = 0;
let timerInterval = null;
let isGameActive = false;
let isGameFinished = false;
let isSolving = false;

// ---------- 工具 ----------
function getRow(idx) { return Math.floor(idx / SIZE); }
function getCol(idx) { return idx % SIZE; }
function getIndex(row, col) { return row * SIZE + col; }

function isValidPos(row, col) {
return row >= 0 && row < SIZE && col >= 0 && col < SIZE;
}

function getNeighbors(idx) {
const row = getRow(idx);
const col = getCol(idx);
const result = [];
const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
for (const [dr, dc] of dirs) {
const nr = row + dr;
const nc = col + dc;
if (isValidPos(nr, nc)) {
result.push(getIndex(nr, nc));
}
}
return result;
}

// ---------- 棋盘渲染 ----------
function render() {
boardEl.innerHTML = '';
for (let i = 0; i < TOTAL_TILES; i++) {
const val = tiles[i];
const tile = document.createElement('div');
tile.className = 'tile' + (val === EMPTY_VALUE ? ' empty' : '');
if (val !== EMPTY_VALUE) {
tile.textContent = val;
tile.setAttribute('data-value', val);
}
tile.dataset.index = i;
tile.addEventListener('click', () => onTileClick(i));
boardEl.appendChild(tile);
}
moveCountEl.textContent = moves;
timerDisplayEl.textContent = timerSeconds;
}

// ---------- 移动逻辑（支持批量移动） ----------
function tryMove(index) {
if (isGameFinished || isSolving) return false;

const emptyRow = getRow(emptyIndex);
const emptyCol = getCol(emptyIndex);
const targetRow = getRow(index);
const targetCol = getCol(index);

const sameRow = emptyRow === targetRow;
const sameCol = emptyCol === targetCol;

if (!sameRow && !sameCol) return false;

let step = 0;
let movedCount = 0;

if (sameRow) {
step = targetCol > emptyCol ? 1 : -1;
let currentCol = emptyCol + step;
let currentEmptyIndex = emptyIndex;

while (currentCol !== targetCol + step) {
const tileIndex = getIndex(emptyRow, currentCol);
tiles[currentEmptyIndex] = tiles[tileIndex];
tiles[tileIndex] = EMPTY_VALUE;
currentEmptyIndex = tileIndex;
currentCol += step;
movedCount++;
}
emptyIndex = currentEmptyIndex;
} else {
step = targetRow > emptyRow ? 1 : -1;
let currentRow = emptyRow + step;
let currentEmptyIndex = emptyIndex;

while (currentRow !== targetRow + step) {
const tileIndex = getIndex(currentRow, emptyCol);
tiles[currentEmptyIndex] = tiles[tileIndex];
tiles[tileIndex] = EMPTY_VALUE;
currentEmptyIndex = tileIndex;
currentRow += step;
movedCount++;
}
emptyIndex = currentEmptyIndex;
}

if (movedCount === 0) return false;

moves++;
moveCountEl.textContent = moves;

if (!isGameActive && !timerInterval) {
isGameActive = true;
timerInterval = setInterval(() => {
timerSeconds++;
timerDisplayEl.textContent = timerSeconds;
}, 1000);
}

render();
checkWin();
return true;
}

// ---------- 检查胜利 ----------
function checkWin() {
for (let i = 0; i < TOTAL_TILES - 1; i++) {
if (tiles[i] !== i + 1) return;
}
if (tiles[TOTAL_TILES - 1] !== EMPTY_VALUE) return;

isGameFinished = true;
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
}
isGameActive = false;

winMessage.textContent = `你用了 ${moves} 步，耗时 ${timerSeconds} 秒 🎊`;
winModal.classList.add('active');
solveBtn.disabled = false;
}

// ---------- 打乱 ----------
function shuffleBoard() {
if (isSolving) return;
stopTimer();
isGameActive = false;
isGameFinished = false;
winModal.classList.remove('active');
solveBtn.disabled = true;

const solved = [];
for (let i = 1; i < TOTAL_TILES; i++) solved.push(i);
solved.push(EMPTY_VALUE);
tiles = solved.slice();
emptyIndex = TOTAL_TILES - 1;

const iterations = 200 + Math.floor(Math.random() * 150);
let lastMoveIdx = -1;
for (let i = 0; i < iterations; i++) {
const neighbors = getNeighbors(emptyIndex);
let candidates = neighbors.filter(n => n !== lastMoveIdx);
if (candidates.length === 0) candidates = neighbors;
const pick = candidates[Math.floor(Math.random() * candidates.length)];
lastMoveIdx = emptyIndex;
tiles[emptyIndex] = tiles[pick];
tiles[pick] = EMPTY_VALUE;
emptyIndex = pick;
}

moves = 0;
timerSeconds = 0;
render();
moveCountEl.textContent = '0';
timerDisplayEl.textContent = '0';
}

// ---------- 重置 ----------
function resetToSolved() {
if (isSolving) return;
stopTimer();
isGameActive = false;
isGameFinished = false;
winModal.classList.remove('active');
solveBtn.disabled = true;

const solved = [];
for (let i = 1; i < TOTAL_TILES; i++) solved.push(i);
solved.push(EMPTY_VALUE);
tiles = solved.slice();
emptyIndex = TOTAL_TILES - 1;
moves = 0;
timerSeconds = 0;
render();
moveCountEl.textContent = '0';
timerDisplayEl.textContent = '0';
}

// ---------- 计时器 ----------
function stopTimer() {
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
}
isGameActive = false;
}

// ---------- 点击 ----------
function onTileClick(index) {
if (isGameFinished || isSolving) return;
tryMove(index);
}

// ---------- 自动求解 BFS ----------
function solvePuzzle() {
if (isSolving) return;
if (isGameFinished) return;

let isSolved = true;
for (let i = 0; i < TOTAL_TILES - 1; i++) {
if (tiles[i] !== i + 1) { isSolved = false; break; }
}
if (isSolved && tiles[TOTAL_TILES - 1] === EMPTY_VALUE) {
checkWin();
return;
}

function encode(state) { return state.join(','); }
function decode(str) { return str.split(',').map(Number); }

const startEnc = encode(tiles);
const target = [];
for (let i = 1; i < TOTAL_TILES; i++) target.push(i);
target.push(EMPTY_VALUE);
const targetEnc = encode(target);

if (startEnc === targetEnc) {
checkWin();
return;
}

const queue = [];
const visited = new Set();
const parent = new Map();

queue.push(startEnc);
visited.add(startEnc);

const MAX_STATES = 50000;
let found = false;
let solution = [];

while (queue.length > 0 && visited.size < MAX_STATES) {
const curEnc = queue.shift();
const curState = decode(curEnc);
const emptyIdx = curState.indexOf(EMPTY_VALUE);

const neighbors = getNeighbors(emptyIdx);
for (const nIdx of neighbors) {
const newState = curState.slice();
newState[emptyIdx] = newState[nIdx];
newState[nIdx] = EMPTY_VALUE;
const newEnc = encode(newState);

if (!visited.has(newEnc)) {
visited.add(newEnc);
parent.set(newEnc, { parentEnc: curEnc, moveFrom: nIdx, moveTo: emptyIdx });
if (newEnc === targetEnc) {
found = true;
let path = [];
let current = newEnc;
while (current !== startEnc) {
const info = parent.get(current);
path.push({ from: info.moveFrom, to: info.moveTo });
current = info.parentEnc;
}
path.reverse();
solution = path;
break;
}
queue.push(newEnc);
}
}
if (found) break;
}

if (!found || solution.length === 0) {
alert('当前状态较复杂，无法自动求解（请尝试打乱后重试）');
return;
}

if (solution.length > 50) {
alert(`找到解法需要 ${solution.length} 步，但为了演示只执行前 50 步`);
solution = solution.slice(0, 50);
}

isSolving = true;
solveBtn.disabled = true;
let stepIndex = 0;

function doStep() {
if (stepIndex >= solution.length) {
isSolving = false;
solveBtn.disabled = false;
checkWin();
return;
}
const step = solution[stepIndex];
const fromIdx = step.from;
const emptyIdxNow = tiles.indexOf(EMPTY_VALUE);
const neighborsNow = getNeighbors(emptyIdxNow);
if (neighborsNow.includes(fromIdx)) {
tryMove(fromIdx);
} else {
console.warn('步数不同步，跳过');
}
stepIndex++;
setTimeout(doStep, 120);
}

doStep();
}

// ---------- 切换棋盘大小 ----------
function changeSize(newSize) {
if (SIZE === newSize) return;
SIZE = newSize;
TOTAL_TILES = SIZE * SIZE;

sizeBtns.forEach(btn => {
btn.classList.toggle('active', parseInt(btn.dataset.size) === newSize);
});

boardEl.className = 'board size-' + newSize;
sizeLabel.textContent = SIZE + '×' + SIZE;

const maxNum = TOTAL_TILES - 1;
hintText.textContent = `点击同行/同列数字批量移动 · 目标 1~${maxNum} 顺序排列`;

resetToSolved();
}

// ---------- 事件绑定 ----------
shuffleBtn.addEventListener('click', shuffleBoard);
resetBtn.addEventListener('click', resetToSolved);
solveBtn.addEventListener('click', solvePuzzle);

sizeBtns.forEach(btn => {
btn.addEventListener('click', () => {
changeSize(parseInt(btn.dataset.size));
});
});

winContinueBtn.addEventListener('click', () => {
winModal.classList.remove('active');
shuffleBoard();
});

winModal.addEventListener('click', (e) => {
if (e.target === winModal) {
// 不关闭
}
});

document.addEventListener('keydown', (e) => {
if (e.key === 'r' || e.key === 'R') {
e.preventDefault();
resetToSolved();
} else if (e.key === 's' || e.key === 'S') {
e.preventDefault();
shuffleBoard();
} else if (e.key === 'Enter' && winModal.classList.contains('active')) {
winContinueBtn.click();
}
});

// ---------- 初始化 ----------
resetToSolved();

window.__game = {
tiles: () => tiles,
shuffle: shuffleBoard,
reset: resetToSolved,
solve: solvePuzzle,
};

})();
</script>
