            transition: 0.25s;

            color: #e8f0fe;
            padding: 0 4px;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f0e9d8, #b8d0e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 8px rgba(0, 20, 40, 0.5);
        }

        .title small {
            font-size: 14px;
            font-weight: 400;
            -webkit-text-fill-color: #8aa3c0;
            background: none;
            margin-left: 8px;
        }

        .stats {
            display: flex;
            gap: 22px;
            font-size: 15px;

            background: rgba(0, 0, 0, 0.25);
            padding: 8px 18px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stats span {
            color: #b6d0e8;
        }

        .stats strong {
            color: #f2f9ff;
            font-weight: 600;
            min-width: 28px;
            display: inline-block;
            text-align: center;
        }

        /* ---------- 网格 ---------- */
        .board {
            display: grid;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            padding: 14px;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            aspect-ratio: 1 / 1;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .board.size-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .board.size-5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .board.size-6 {
            grid-template-columns: repeat(6, 1fr);
        }

        .tile {
            background: radial-gradient(circle at 30% 30%, #f5f9ff, #c8d8ee);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #1d3146;
            cursor: pointer;
            box-shadow: 0 6px 0 #8a9fb0, 0 8px 18px rgba(0, 0, 0, 0.25);
            transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
            aspect-ratio: 1 / 1;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
            will-change: transform;
            position: relative;
        }

        .tile:hover:not(.empty) {

            filter: brightness(1.05);
        }

        .tile:active:not(.empty) {

        }

        .tile.empty {
            background: transparent;
            box-shadow: none;

            transform: none !important;

        }

<body>

    <!-- 游戏卡片 -->
    <div class="game-wrapper">
        <div class="game-container">

            <!-- 头部：标题 + 统计 -->
            <div class="header">
                <div class="title">
                    🧩 归位
                    <small id="sizeLabel">4×4</small>
                </div>
                <div class="stats">
                    <span>步数 <strong id="moveCount">0</strong></span>
                    <span>⏱ <strong id="timerDisplay">0</strong>s</span>
                </div>
            </div>

            <!-- 大小选择器 -->
            <div class="size-selector">
                <button class="size-btn active" data-size="4">4×4</button>
                <button class="size-btn" data-size="5">5×5</button>
                <button class="size-btn" data-size="6">6×6</button>
            </div>

            <!-- 棋盘 -->
            <div class="board size-4" id="board"></div>

            <!-- 控制按钮 -->
            <div class="controls">
                <button class="btn btn-primary" id="shuffleBtn">🎲 打乱</button>
                <button class="btn" id="resetBtn">⟳ 重置</button>
                <button class="btn btn-success" id="solveBtn" disabled>✨ 完成</button>
            </div>

            <p id="hintText" style="color:#7a95b0; font-size:13px; text-align:center; margin-top:18px; opacity:0.7; letter-spacing:0.3px;">
                点击同行/同列数字批量移动 · 目标 1~15 顺序排列
            </p>
        </div>
    </div>

    <!-- 胜利弹窗 -->
    <div class="modal-overlay" id="winModal">
        <div class="modal">
            <span class="emoji">🎉</span>
            <h2>完美归位！</h2>
            <p id="winMessage">你用了 0 步，耗时 0 秒</p>
            <button class="btn btn-primary" id="winContinueBtn">🔄 再来一局</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 配置 ----------
            let SIZE = 4;
            let TOTAL_TILES = SIZE * SIZE;
            const EMPTY_VALUE = 0;

            // DOM 引用
            const boardEl = document.getElementById('board');
            const moveCountEl = document.getElementById('moveCount');
            const timerDisplayEl = document.getElementById('timerDisplay');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const solveBtn = document.getElementById('solveBtn');
            const winModal = document.getElementById('winModal');
            const winMessage = document.getElementById('winMessage');
            const winContinueBtn = document.getElementById('winContinueBtn');
            const sizeLabel = document.getElementById('sizeLabel');
            const sizeBtns = document.querySelectorAll('.size-btn');
            const hintText = document.getElementById('hintText');

            // ---------- 状态 ----------
            let tiles = []; // 一维数组，0 代表空格
            let emptyIndex = 0; // 空格索引
            let moves = 0;
            let timerSeconds = 0;
            let timerInterval = null;
            let isGameActive = false; // 是否开始计时（有移动）
            let isGameFinished = false; // 是否胜利
            let isSolving = false; // 是否正在自动求解（防止干扰）

            // ---------- 工具 ----------
            function getRow(idx) { return Math.floor(idx / SIZE); }
            function getCol(idx) { return idx % SIZE; }
            function getIndex(row, col) { return row * SIZE + col; }

            // 检查是否在边界内
            function isValidPos(row, col) {
                return row >= 0 && row < SIZE && col >= 0 && col < SIZE;
            }

            // 获取相邻索引（上下左右）
            function getNeighbors(idx) {
                const row = getRow(idx);
                const col = getCol(idx);
                const result = [];
                const dirs = [
                    [-1, 0],
                    [1, 0],
                    [0, -1],
                    [0, 1]
                ];
                for (const [dr, dc] of dirs) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (isValidPos(nr, nc)) {
                        result.push(getIndex(nr, nc));
                    }
                }
                return result;
            }

            // ---------- 棋盘渲染 ----------
            function render() {
                boardEl.innerHTML = '';
                for (let i = 0; i < TOTAL_TILES; i++) {
                    const val = tiles[i];
                    const tile = document.createElement('div');
                    tile.className = 'tile' + (val === EMPTY_VALUE ? ' empty' : '');
                    if (val !== EMPTY_VALUE) {
                        tile.textContent = val;
                        tile.setAttribute('data-value', val);
                    }
                    tile.dataset.index = i;
                    tile.addEventListener('click', () => onTileClick(i));
                    boardEl.appendChild(tile);
                }
                // 更新步数 & 计时显示
                moveCountEl.textContent = moves;
                timerDisplayEl.textContent = timerSeconds;
            }

            // ---------- 移动逻辑（支持批量移动） ----------
            function tryMove(index) {
                if (isGameFinished || isSolving) return false;

                const emptyRow = getRow(emptyIndex);
                const emptyCol = getCol(emptyIndex);
                const targetRow = getRow(index);
                const targetCol = getCol(index);

                // 检查是否在同一行或同一列
                const sameRow = emptyRow === targetRow;
                const sameCol = emptyCol === targetCol;

                if (!sameRow && !sameCol) return false;

                // 计算移动方向和步数
                let step = 0;
                let movedCount = 0;

                if (sameRow) {
                    // 水平移动
                    step = targetCol > emptyCol ? 1 : -1;
                    let currentCol = emptyCol + step;
                    let currentEmptyIndex = emptyIndex;

                    while (currentCol !== targetCol + step) {
                        const tileIndex = getIndex(emptyRow, currentCol);
                        tiles[currentEmptyIndex] = tiles[tileIndex];
                        tiles[tileIndex] = EMPTY_VALUE;
                        currentEmptyIndex = tileIndex;
                        currentCol += step;
                        movedCount++;
                    }
                    emptyIndex = currentEmptyIndex;
                } else {
                    // 垂直移动
                    step = targetRow > emptyRow ? 1 : -1;
                    let currentRow = emptyRow + step;
                    let currentEmptyIndex = emptyIndex;

                    while (currentRow !== targetRow + step) {
                        const tileIndex = getIndex(currentRow, emptyCol);
                        tiles[currentEmptyIndex] = tiles[tileIndex];
                        tiles[tileIndex] = EMPTY_VALUE;
                        currentEmptyIndex = tileIndex;
                        currentRow += step;
                        movedCount++;
                    }
                    emptyIndex = currentEmptyIndex;
                }

                if (movedCount === 0) return false;

                moves++;
                moveCountEl.textContent = moves;

                // 首次移动开始计时
                if (!isGameActive && !timerInterval) {
                    isGameActive = true;
                    timerInterval = setInterval(() => {
                        timerSeconds++;
                        timerDisplayEl.textContent = timerSeconds;
                    }, 1000);
                }

                render();
                checkWin();
                return true;
            }

            // ---------- 检查胜利 ----------
            function checkWin() {
                // 目标: [1,2,3,...,15,0]
                for (let i = 0; i < TOTAL_TILES - 1; i++) {
                    if (tiles[i] !== i + 1) return;
                }
                if (tiles[TOTAL_TILES - 1] !== EMPTY_VALUE) return;

                // 胜利！
                isGameFinished = true;
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isGameActive = false;

                // 显示弹窗
                winMessage.textContent = `你用了 ${moves} 步，耗时 ${timerSeconds} 秒 🎊`;
                winModal.classList.add('active');
                solveBtn.disabled = false; // 完成按钮可点（但实际已胜利）
            }

            // ---------- 打乱 (Fisher-Yates 洗牌 + 可解性保证) ----------
            function shuffleBoard() {
                if (isSolving) return;
                // 重置计时
                stopTimer();
                isGameActive = false;
                isGameFinished = false;
                winModal.classList.remove('active');
                solveBtn.disabled = true;

                // 从完成状态开始
                const solved = [];
                for (let i = 1; i < TOTAL_TILES; i++) solved.push(i);
                solved.push(EMPTY_VALUE);
                tiles = solved.slice();
                emptyIndex = TOTAL_TILES - 1;

                // 执行多次随机移动 (保证可解)
                const iterations = 200 + Math.floor(Math.random() * 150);
                let lastMoveIdx = -1;
                for (let i = 0; i < iterations; i++) {
                    const neighbors = getNeighbors(emptyIndex);
                    // 过滤掉上一步移动过来的（避免来回无效），但允许偶尔重复
                    let candidates = neighbors.filter(n => n !== lastMoveIdx);
                    if (candidates.length === 0) candidates = neighbors;
                    const pick = candidates[Math.floor(Math.random() * candidates.length)];
                    lastMoveIdx = emptyIndex;
                    // 交换
                    tiles[emptyIndex] = tiles[pick];
                    tiles[pick] = EMPTY_VALUE;
                    emptyIndex = pick;
                }

                moves = 0;
                timerSeconds = 0;
                render();
                moveCountEl.textContent = '0';
                timerDisplayEl.textContent = '0';
            }

            // ---------- 重置到完成状态 ----------
            function resetToSolved() {
                if (isSolving) return;
                stopTimer();
                isGameActive = false;
                isGameFinished = false;
                winModal.classList.remove('active');
                solveBtn.disabled = true;

                const solved = [];
                for (let i = 1; i < TOTAL_TILES; i++) solved.push(i);
                solved.push(EMPTY_VALUE);
                tiles = solved.slice();
                emptyIndex = TOTAL_TILES - 1;
                moves = 0;
                timerSeconds = 0;
                render();
                moveCountEl.textContent = '0';
                timerDisplayEl.textContent = '0';
            }

            // ---------- 计时器控制 ----------
            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isGameActive = false;
            }

            // ---------- 点击事件 ----------
            function onTileClick(index) {
                if (isGameFinished || isSolving) return;
                tryMove(index);
            }

            // ---------- 自动求解 (BFS) ----------
            // 因为 4x4 状态空间太大，这里使用简单 BFS 可能较慢，但为了演示实现一个带剪枝的 BFS
            // 实际我们使用一个简单策略: 从当前状态反向搜索到目标，最多搜索 20000 个状态
            // 为了用户体验，限制搜索深度 25 步以内，超出则提示
            function solvePuzzle() {
                if (isSolving) return;
                if (isGameFinished) {
                    // 如果已经胜利，重置再解？
                    return;
                }

                // 如果当前状态已经是目标
                let isSolved = true;
                for (let i = 0; i < TOTAL_TILES - 1; i++) {
                    if (tiles[i] !== i + 1) { isSolved = false; break; }
                }
                if (isSolved && tiles[TOTAL_TILES - 1] === EMPTY_VALUE) {
                    // 已经胜利
                    checkWin();
                    return;
                }

                // 使用 BFS 搜索从当前状态到目标的最短路径
                // 状态编码: 用字符串表示 tiles 数组
                function encode(state) { return state.join(','); }

                function decode(str) { return str.split(',').map(Number); }

                const startEnc = encode(tiles);
                const target = [];
                for (let i = 1; i < TOTAL_TILES; i++) target.push(i);
                target.push(EMPTY_VALUE);
                const targetEnc = encode(target);

                if (startEnc === targetEnc) {
                    checkWin();
                    return;
                }

                // BFS
                const queue = [];
                const visited = new Set();
                const parent = new Map(); // childEnc -> { parentEnc, moveFrom, moveTo }

                queue.push(startEnc);
                visited.add(startEnc);

                const MAX_STATES = 50000;
                let found = false;
                let solution = []; // 存储移动序列 (从初始到目标)

                while (queue.length > 0 && visited.size < MAX_STATES) {
                    const curEnc = queue.shift();
                    const curState = decode(curEnc);
                    const emptyIdx = curState.indexOf(EMPTY_VALUE);

                    const neighbors = getNeighbors(emptyIdx);
                    for (const nIdx of neighbors) {
                        const newState = curState.slice();
                        newState[emptyIdx] = newState[nIdx];
                        newState[nIdx] = EMPTY_VALUE;
                        const newEnc = encode(newState);

                        if (!visited.has(newEnc)) {
                            visited.add(newEnc);
                            parent.set(newEnc, { parentEnc: curEnc, moveFrom: nIdx, moveTo: emptyIdx });
                            if (newEnc === targetEnc) {
                                found = true;
                                // 重建路径
                                let path = [];
                                let current = newEnc;
                                while (current !== startEnc) {
                                    const info = parent.get(current);
                                    path.push({ from: info.moveFrom, to: info.moveTo });
                                    current = info.parentEnc;
                                }
                                path.reverse();
                                solution = path;
                                break;
                            }
                            queue.push(newEnc);
                        }
                    }
                    if (found) break;
                }

                if (!found || solution.length === 0) {
                    // 没找到解，提示
                    alert('当前状态较复杂，无法自动求解（请尝试打乱后重试）');
                    return;
                }

                if (solution.length > 50) {
                    alert(`找到解法需要 ${solution.length} 步，但为了演示只执行前 50 步`);
                    solution = solution.slice(0, 50);
                }

                // 执行解法
                isSolving = true;
                solveBtn.disabled = true;
                let stepIndex = 0;

                function doStep() {
                    if (stepIndex >= solution.length) {
                        isSolving = false;
                        solveBtn.disabled = false;
                        // 检查是否胜利
                        checkWin();
                        return;
                    }
                    const step = solution[stepIndex];
                    // 注意: 我们的移动是 from -> to，to 是空格位置
                    // 但 tryMove 期望点击 from 的数字块
                    const fromIdx = step.from;
                    // 但有可能状态已经变化，需要重新计算空格位置
                    const emptyIdxNow = tiles.indexOf(EMPTY_VALUE);
                    // 如果 fromIdx 不是空格相邻，跳过（理论上不会）
                    const neighborsNow = getNeighbors(emptyIdxNow);
                    if (neighborsNow.includes(fromIdx)) {
                        tryMove(fromIdx);
                    } else {
                        // 容错：跳过这一步
                        console.warn('步数不同步，跳过');
                    }
                    stepIndex++;
                    // 延迟执行下一步
                    setTimeout(doStep, 120);
                }

                // 执行前重置计时（不计入玩家步数）
                // 但 moves 已在 tryMove 中累加，我们需要在开始前记录，执行完后恢复？
                // 更好的方式：我们不希望自动求解增加步数，但为了体验，可以保留步数显示为玩家操作步数
                // 这里我们暂时允许步数增加，但用户也可以接受
                // 开始执行
                doStep();
            }

            // ---------- 切换棋盘大小 ----------
            function changeSize(newSize) {
                if (SIZE === newSize) return;
                SIZE = newSize;
                TOTAL_TILES = SIZE * SIZE;

                // 更新按钮状态
                sizeBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.size) === newSize);
                });

                // 更新棋盘类名
                boardEl.className = 'board size-' + newSize;

                // 更新标题
                sizeLabel.textContent = SIZE + '×' + SIZE;

                // 更新提示文字
                const maxNum = TOTAL_TILES - 1;
                hintText.textContent = `点击同行/同列数字批量移动 · 目标 1~${maxNum} 顺序排列`;

                // 重置游戏
                resetToSolved();
            }

            // ---------- 事件绑定 ----------
            shuffleBtn.addEventListener('click', shuffleBoard);
            resetBtn.addEventListener('click', resetToSolved);
            solveBtn.addEventListener('click', solvePuzzle);

            sizeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    changeSize(parseInt(btn.dataset.size));
                });
            });

            winContinueBtn.addEventListener('click', () => {
                winModal.classList.remove('active');
                shuffleBoard();
            });

            // 点击弹窗外关闭（用户友好）
            winModal.addEventListener('click', (e) => {
                if (e.target === winModal) {
                    // 不关闭，要求用户点击按钮
                }
            });

            // ---------- 键盘快捷键 (R 重置, S 打乱) ----------
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    resetToSolved();
                } else if (e.key === 's' || e.key === 'S') {
                    e.preventDefault();
                    shuffleBoard();
                } else if (e.key === 'Enter' && winModal.classList.contains('active')) {
                    winContinueBtn.click();
                }
            });

            // ---------- 初始化 ----------
            resetToSolved();

            // 暴露一些接口到控制台用于调试
            window.__game = {
                tiles: () => tiles,
                shuffle: shuffleBoard,
                reset: resetToSolved,
                solve: solvePuzzle,
            };

        })();
    </script>
</body>
</html>
