<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>魔方小游戏 · Vue2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:radial-gradient(1200px 800px at 50% 15%,#2b3a67,#1a2238 60%,#10142a);color:#fff}
  #app{position:relative;width:100%;height:100%;overflow:hidden}

  /* ===== 3D 画布容器（全屏常驻，杜绝重排拉伸） ===== */
  .cube-canvas{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:1;touch-action:none;overflow:hidden;
  }
  .cube-canvas canvas{
    display:block;width:100%;height:100%;
    touch-action:none;outline:none;
  }

  /* ===== UI 悬浮层 (HUD) ===== */
  .hud-overlay{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;
    transition:opacity .25s cubic-bezier(.25,.8,.25,1), transform .25s cubic-bezier(.25,.8,.25,1);
  }
  .hud-overlay.hud-hidden{
    opacity:0;
    pointer-events:none !important;
    transform:scale(0.98);
  }

  .hud-top{
    pointer-events:auto;
    background:linear-gradient(180deg, rgba(16,20,42,0.85) 0%, rgba(16,20,42,0.55) 75%, transparent 100%);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding-bottom:12px;
  }
  .hud-bottom{
    pointer-events:auto;
    background:linear-gradient(0deg, rgba(16,20,42,0.85) 0%, rgba(16,20,42,0.55) 75%, transparent 100%);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding-top:10px;
  }

  /* ===== 工具栏网格 ===== */
  .toolbar-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:8px 12px;
    align-items:center;
  }
  .toolbar-row.bottom{
    grid-template-columns:1fr 1fr 1fr;
    padding:6px 12px 14px;
  }

  /* ===== 按钮 ===== */
  .btn{
    border:none;cursor:pointer;color:#fff;font-size:13px;
    padding:9px 4px;border-radius:10px;text-align:center;
    background:linear-gradient(135deg,#4f6df5,#7b3ff2);
    box-shadow:0 4px 14px rgba(79,109,245,.35);
    transition:transform .1s,opacity .15s,box-shadow .15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:inherit;
  }
  .btn:active{transform:scale(.94)}
  .btn.gray{background:linear-gradient(135deg,#3a4358,#2a3040);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .btn:disabled{opacity:.32;cursor:not-allowed;transform:none}
  .btn.rec.active{
    background:linear-gradient(135deg,#e11d48,#f43f5e);
    box-shadow:0 4px 14px rgba(225,29,72,.5);
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

  /* ===== 悬浮快捷呼出浮标 ===== */
  .wake-btn{
    position:absolute;top:14px;right:14px;z-index:9;
    background:rgba(20,24,42,0.6);border:1px solid rgba(255,255,255,0.15);
    color:rgba(255,255,255,0.85);font-size:12px;padding:6px 10px;border-radius:20px;
    backdrop-filter:blur(8px);cursor:pointer;transition:opacity .2s;
  }

  /* ===== 统计单元格 ===== */
  .stat-cell{
    font-size:12px;opacity:.9;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,0.5);
  }
  .stat-cell b{font-size:15px;color:#7fe3ff;margin-left:2px}

  /* ===== Toast ===== */
  #toast{
    position:fixed;left:50%;top:18%;transform:translateX(-50%);
    background:rgba(10,14,28,.88);border:1px solid rgba(255,255,255,.1);
    color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .3s, transform .3s;
    z-index:200;white-space:nowrap;max-width:90vw;overflow:hidden;
    text-overflow:ellipsis;box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 模态窗 ===== */
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.7);
    display:flex;align-items:center;justify-content:center;z-index:100;
    backdrop-filter:blur(4px);
  }
  .modal-box{
    background:#1e2436;border-radius:16px;padding:20px;
    width:90%;max-width:400px;max-height:82vh;overflow-y:auto;
    color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,0.08);
  }
  .modal-box h3{margin:0 0 14px;font-size:18px}
  .modal-box input{
    width:100%;padding:12px;border:1px solid #3a4358;border-radius:10px;
    background:#10142a;color:#fff;font-size:15px;outline:none;margin-bottom:14px;
  }
  .modal-box input:focus{border-color:#7b3ff2}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}

  .snapshot-list{max-height:240px;overflow-y:auto;margin-top:4px}
  .snapshot-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:#10142a;border-radius:10px;margin-bottom:8px;
  }
  .snapshot-info{flex:1;overflow:hidden;min-width:0}
  .snapshot-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .snapshot-time{font-size:11px;opacity:.5;margin-top:2px}
  .snapshot-actions{display:flex;gap:6px;flex-shrink:0}
  .snapshot-actions button{
    border:none;cursor:pointer;font-size:12px;padding:6px 10px;border-radius:8px;color:#fff;
    background:linear-gradient(135deg,#4f6df5,#7b3ff2);font-family:inherit;
  }
  .snapshot-actions button.del{background:linear-gradient(135deg,#c41e3a,#ff5800)}
  .empty-tip{text-align:center;opacity:.5;padding:22px 0;font-size:13px}
  .formula-preview{
    background:#10142a;border:1px solid #3a4358;border-radius:10px;padding:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.7;
    word-break:break-all;max-height:120px;overflow-y:auto;margin-bottom:14px;color:#7fe3ff;
  }
  .formula-mini{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#7fe3ff;
    opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;
  }
  .tip-text{font-size:11px;opacity:.45;line-height:1.6;margin-bottom:12px}
</style>
</head>
<body>

<div id="app">
  <!-- 3D 魔方全景渲染舞台 -->
  <cube-canvas @ready="onEngineReady"></cube-canvas>

  <!-- 隐藏状态下的唤醒浮标 -->
  <div v-show="!uiVisible" class="wake-btn" @click="toggleUI">
    👁️ 显示面板
  </div>

  <!-- HUD 工具交互悬浮层 -->
  <div class="hud-overlay" :class="{ 'hud-hidden': !uiVisible }">
    <!-- 顶部操作区 -->
    <div class="hud-top">
      <div class="toolbar-row">
        <button class="btn gray" @click="openSnapshotLibrary">📸 快照库</button>
        <button class="btn gray" @click="openFormulaLibrary">📐 步骤库</button>
        <div class="stat-cell">步数<b>{{ moves }}</b></div>
        <button class="btn" :disabled="locked" @click="onReset">↺ 复原</button>
      </div>

      <div class="toolbar-row">
        <button class="btn" :disabled="locked" @click="openSnapshotModal">💾 存快照</button>
        <button class="btn rec" :class="{active: recording}" :disabled="locked" @click="onRecord">
          {{ recording ? '⏹ ' + recordedMoves.length : '⏺ 记录' }}
        </button>
        <div class="stat-cell">时间<b>{{ timeText }}</b></div>
        <button class="btn" :disabled="locked" @click="onShuffle">🔀 打乱</button>
      </div>
    </div>

    <!-- 底部操作区 -->
    <div class="hud-bottom">
      <div class="toolbar-row bottom">
        <button class="btn gray" :disabled="locked || !canPrev" @click="onPrev">⏪ 上一步</button>
        <button class="btn gray" @click="onResetView">↺ 视角</button>
        <button class="btn gray" :disabled="locked || !canNext" @click="onNext">下一步 ⏩</button>
      </div>
    </div>
  </div>

  <toast-msg :show="toast.show" :msg="toast.msg"></toast-msg>

  <modal-layer v-if="activeModal" @close="closeModal">
    <save-snapshot-modal
      v-if="activeModal === 'snapshot-save'"
      @save="onSaveSnapshot"
      @close="closeModal"></save-snapshot-modal>

    <save-formula-modal
      v-else-if="activeModal === 'formula-save'"
      :moves="recordedMoves"
      @save="onSaveFormula"
      @close="closeModal"></save-formula-modal>

    <library-modal
      v-else-if="activeModal === 'snapshot-lib'"
      title="📸 快照库"
      :items="snapshots"
      empty-text="暂无快照"
      action-label="恢复"
      @action="onRestoreSnapshot"
      @delete="onDeleteSnapshot"
      @close="closeModal"></library-modal>

    <library-modal
      v-else-if="activeModal === 'formula-lib'"
      title="📐 步骤库"
      :items="formulas"
      empty-text="暂无公式，点击「⏺ 记录」开始录制"
      action-label="执行"
      @action="onPlayFormula"
      @delete="onDeleteFormula"
      @close="closeModal"></library-modal>
  </modal-layer>
</div>

<script src="./../js/three.min.js"></script>
<script src="./../js/vue.min.js"></script>
<script>
/* =========================================================================
   常量 & 工具函数
   ========================================================================= */
const FACE_COLOR = {
  R: 0xb71234, L: 0xff5800, U: 0xffffff,
  D: 0xffd500, F: 0x009b48, B: 0x0046ad, X: 0x14141c
};

const FACES = [
  { key:'R', axis:'x', sign: 1 },
  { key:'L', axis:'x', sign:-1 },
  { key:'U', axis:'y', sign: 1 },
  { key:'D', axis:'y', sign:-1 },
  { key:'F', axis:'z', sign: 1 },
  { key:'B', axis:'z', sign:-1 }
];

const FORMULA_KEY  = 'mf03_formulas';
const SNAPSHOT_KEY = 'mf03_snapshots';
const CUBE_HALF    = 1.5;

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const pad2  = n => String(n).padStart(2, '0');

function loadJSON(key, fallback){
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v || fallback;
  } catch(e){
    return fallback;
  }
}

function fmtTime(ms){
  const s = Math.floor(Math.max(0, ms) / 1000);
  return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
}

const easeInOut = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

function tween(duration, onUpdate){
  return new Promise(resolve => {
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / duration);
      onUpdate(easeInOut(k), k);
      if (k < 1) requestAnimationFrame(step);
      else resolve();
    };
    requestAnimationFrame(step);
  });
}

function stepToNotation({ axis, layer, dir }){
  const comp = axis.x ? 'x' : axis.y ? 'y' : 'z';
  let letter, cw;
  if (comp === 'x'){
    if (layer > 0){ letter = 'R'; cw = -1; }
    else if (layer < 0){ letter = 'L'; cw = 1; }
    else { letter = 'M'; cw = 1; }
  } else if (comp === 'y'){
    if (layer > 0){ letter = 'U'; cw = -1; }
    else if (layer < 0){ letter = 'D'; cw = 1; }
    else { letter = 'E'; cw = 1; }
  } else {
    if (layer > 0){ letter = 'F'; cw = -1; }
    else if (layer < 0){ letter = 'B'; cw = 1; }
    else { letter = 'S'; cw = -1; }
  }
  if (Math.abs(dir) === 2) return letter + '2';
  return dir === cw ? letter : letter + "'";
}

function genScramble(count){
  const axes = [
    { x:1, y:0, z:0 },
    { x:0, y:1, z:0 },
    { x:0, y:0, z:1 }
  ];
  const seq = [];
  let lastKey = '';
  while (seq.length < count){
    const axis  = axes[(Math.random() * 3) | 0];
    const layer = ((Math.random() * 3) | 0) - 1;
    const dir   = Math.random() < 0.5 ? 1 : -1;
    const comp  = axis.x !== 0 ? 'x' : (axis.y !== 0 ? 'y' : 'z');
    const key   = comp + layer;
    if (key === lastKey) continue;
    lastKey = key;
    seq.push({ axis, layer, dir });
  }
  return seq;
}

/* =========================================================================
   CubeEngine —— 重构升级的 Three.js 魔方引擎
   ========================================================================= */
class CubeEngine {
  constructor(container){
    this.container = container;

    this.cubies   = [];
    this._pending = 0;
    this._chain   = Promise.resolve();
    this._history = [];
    this._cursor  = 0;

    this.onHistoryChange = null;
    this.onUserTurn      = null;
    this.onUserTurnEnd   = null;
    this.onBlankDblClick = null;

    this.DEFAULT_THETA = 0.8;
    this.DEFAULT_PHI   = 1.02;
    this.FILL_RATIO    = 0.48; 
    this.MIN_ZOOM      = 0.5;
    this.MAX_ZOOM      = 2.5;

    this.theta = this.DEFAULT_THETA;
    this.phi   = this.DEFAULT_PHI;
    this.zoom  = 1;
    this._baseDistance = 20;

    this._ndc   = new THREE.Vector2();
    this._ray   = new THREE.Raycaster();
    this._drag  = null;
    this._pinch = null;
    this._lastTap = null;

    this._initRenderer();
    this._initScene();
    this._buildCube();
    this._bindEvents();
    this.resize();

    this._tick = this._tick.bind(this);
    this._rafId = requestAnimationFrame(this._tick);
  }

  _initRenderer(){
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.dom = this.renderer.domElement;
    this.container.appendChild(this.dom);
  }

  _initScene(){
    this.scene  = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);

    this.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dl = new THREE.DirectionalLight(0xffffff, 0.45);
    dl.position.set(6, 10, 8);
    this.scene.add(dl);
  }

  _buildCube(){
    this.geometry  = new THREE.BoxGeometry(0.96, 0.96, 0.96);
    this.materials = {};
    for (const f of FACES){
      this.materials[f.key] = new THREE.MeshLambertMaterial({ color: FACE_COLOR[f.key] });
    }
    this.materials.X = new THREE.MeshLambertMaterial({ color: FACE_COLOR.X });

    for (let x = -1; x <= 1; x++)
    for (let y = -1; y <= 1; y++)
    for (let z = -1; z <= 1; z++){
      if (!x && !y && !z) continue;

      const pos = { x, y, z };
      const mats = FACES.map(f =>
        pos[f.axis] === f.sign ? this.materials[f.key] : this.materials.X
      );

      const stickers = FACES
        .filter(f => pos[f.axis] === f.sign)
        .map(f => ({
          normal: new THREE.Vector3(
            f.axis === 'x' ? f.sign : 0,
            f.axis === 'y' ? f.sign : 0,
            f.axis === 'z' ? f.sign : 0
          ),
          color: f.key
        }));

      const cubie = new THREE.Mesh(this.geometry, mats);
      cubie.position.set(x, y, z);
      cubie.userData = { home: cubie.position.clone(), stickers };

      this.scene.add(cubie);
      this.cubies.push(cubie);
    }
  }

  /**
   * 改进的相机适配算法：根据屏幕短边等比缩放，彻底消除拉伸及大小异常变动
   */
  _updateCamera(){
    const w = this.container.clientWidth  || 1;
    const h = this.container.clientHeight || 1;
    const aspect = w / h;

    this.camera.aspect = aspect;
    this.camera.updateProjectionMatrix();

    const fovRad = (this.camera.fov * Math.PI) / 180;
    const tanHalf = Math.tan(fovRad / 2);
    // 以视口短边为基准，确保横竖屏或视图切换时魔方视觉尺寸完全稳定
    const effectiveTan = aspect < 1 ? tanHalf * aspect : tanHalf;
    this._baseDistance = (CUBE_HALF / effectiveTan) / this.FILL_RATIO;

    const dist = this._baseDistance / this.zoom;
    this.camera.position.setFromSphericalCoords(dist, this.phi, this.theta);
    this.camera.lookAt(0, 0, 0);
  }

  resetView(){
    this.theta = this.DEFAULT_THETA;
    this.phi   = this.DEFAULT_PHI;
    this.zoom  = 1;
    this._updateCamera();
  }

  resize(){
    const w = this.container.clientWidth;
    const h = this.container.clientHeight;
    if (w <= 0 || h <= 0) return;

    // 严谨同步物理渲染尺寸与 CSS 显示尺寸，杜绝形变拉伸
    this.renderer.setSize(w, h, true);
    this._updateCamera();
  }

  _bindEvents(){
    const dom = this.dom;
    this._h = {
      down:   e => this._onDown(e),
      move:   e => this._onMove(e),
      up:     e => this._onUp(e),
      wheel:  e => this._onWheel(e),
      ts:     e => this._onTouchStart(e),
      tm:     e => this._onTouchMove(e),
      te:     () => { this._pinch = null; },
      resize: () => this.resize()
    };

    dom.addEventListener('pointerdown',   this._h.down);
    dom.addEventListener('pointermove',   this._h.move);
    window.addEventListener('pointerup',    this._h.up);
    window.addEventListener('pointercancel', this._h.up);
    dom.addEventListener('wheel',      this._h.wheel, { passive: false });
    dom.addEventListener('touchstart', this._h.ts,    { passive: false });
    dom.addEventListener('touchmove',  this._h.tm,    { passive: false });
    dom.addEventListener('touchend',   this._h.te);
    window.addEventListener('resize',  this._h.resize);

    if (window.ResizeObserver) {
      this._ro = new ResizeObserver(() => this.resize());
      this._ro.observe(this.container);
    }
  }

  _onWheel(e){
    e.preventDefault();
    this.zoom = clamp(this.zoom * (1 - e.deltaY * 0.001), this.MIN_ZOOM, this.MAX_ZOOM);
    this._updateCamera();
  }

  _onTouchStart(e){
    if (e.touches.length !== 2) return;
    this._drag = null;
    this._lastTap = null;

    const [a, b] = e.touches;
    this._pinch = {
      dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
      zoom: this.zoom
    };
  }

  _onTouchMove(e){
    if (e.touches.length !== 2 || !this._pinch) return;
    e.preventDefault();

    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (dist <= 0) return;

    this.zoom = clamp(
      this._pinch.zoom * (dist / this._pinch.dist),
      this.MIN_ZOOM,
      this.MAX_ZOOM
    );
    this._updateCamera();
  }

  _onDown(e){
    e.preventDefault();
    this.dom.setPointerCapture(e.pointerId);

    const rect = this.dom.getBoundingClientRect();
    this._ndc.set(
      ((e.clientX - rect.left) / rect.width)  * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    this._ray.setFromCamera(this._ndc, this.camera);

    const hits = this.isBusy() ? [] : this._ray.intersectObjects(this.cubies, false);

    if (hits.length){
      const hit = hits[0];
      const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      normal.set(Math.round(normal.x), Math.round(normal.y), Math.round(normal.z));

      this._drag = {
        type: 'layer',
        cubie: hit.object,
        normal,
        point: hit.point.clone(),
        startX: e.clientX,
        startY: e.clientY,
        resolved: false
      };
    } else {
      this._drag = {
        type: 'view',
        startX: e.clientX,
        startY: e.clientY,
        lastX: e.clientX,
        lastY: e.clientY,
        moved: false
      };
    }
  }

  _onMove(e){
    const d = this._drag;
    if (!d) return;

    if (d.type === 'view'){
      const dx = e.clientX - d.lastX;
      const dy = e.clientY - d.lastY;
      d.lastX = e.clientX;
      d.lastY = e.clientY;

      if (!d.moved && Math.hypot(e.clientX - d.startX, e.clientY - d.startY) > 5){
        d.moved = true;
      }
      if (!d.moved) return;

      this.theta -= dx * 0.008;
      this.phi    = clamp(this.phi - dy * 0.008, 0.15, Math.PI - 0.15);
      this._updateCamera();
      return;
    }

    if (d.resolved) return;

    const dx = e.clientX - d.startX;
    const dy = e.clientY - d.startY;
    if (Math.hypot(dx, dy) > 14){
      d.resolved = true;
      this._drag = null;
      this._applyDrag(d, dx, dy);
    }
  }

  _onUp(e){
    const d = this._drag;
    this._drag = null;
    this._pinch = null;
    if (!d) return;

    const isTap = d.type === 'layer' ? !d.resolved : !d.moved;
    if (!isTap){
      this._lastTap = null;
      return;
    }

    const now = performance.now();
    const last = this._lastTap;
    if (last && now - last.time < 350 &&
        Math.hypot(e.clientX - last.x, e.clientY - last.y) < 30){
      this._lastTap = null;
      if (this.onBlankDblClick) this.onBlankDblClick();
    } else {
      this._lastTap = { x: e.clientX, y: e.clientY, time: now };
    }
  }

  _applyDrag(drag, dx, dy){
    const n = drag.normal;
    const tangents = [];
    if (n.x === 0) tangents.push(new THREE.Vector3(1, 0, 0));
    if (n.y === 0) tangents.push(new THREE.Vector3(0, 1, 0));
    if (n.z === 0) tangents.push(new THREE.Vector3(0, 0, 1));

    const dragVec = new THREE.Vector2(dx, -dy).normalize();

    let best = null;
    let bestAbs = 0;
    for (const t of tangents){
      const s = this._screenDir(drag.point, t).dot(dragVec);
      if (Math.abs(s) > bestAbs){
        bestAbs = Math.abs(s);
        best = t.clone().multiplyScalar(Math.sign(s));
      }
    }
    if (!best) return;

    const axisVec = new THREE.Vector3().crossVectors(n, best);
    const comp = Math.abs(axisVec.x) > 0.5 ? 'x'
               : Math.abs(axisVec.y) > 0.5 ? 'y'
               : 'z';

    const step = {
      axis:  { x: axisVec.x, y: axisVec.y, z: axisVec.z },
      layer: Math.round(drag.cubie.position[comp]),
      dir:   axisVec[comp] > 0 ? 1 : -1
    };

    this.pushHistory(step);
    if (this.onUserTurn) this.onUserTurn(step);

    const p = this.turn(step.axis, step.layer, step.dir, 200);
    if (this.onUserTurnEnd){
      p.then(() => this.onUserTurnEnd(), () => {});
    }
  }

  _screenDir(point, vec){
    const a = point.clone().project(this.camera);
    const b = point.clone().add(vec).project(this.camera);
    return new THREE.Vector2(b.x - a.x, b.y - a.y).normalize();
  }

  isBusy(){ return this._pending > 0; }

  turn(axis, layer, dir, duration = 200){
    this._pending++;
    const run = () => this._animateMove(axis, layer, dir, duration);
    const p = this._chain.then(run, run);
    this._chain = p.catch(() => {});
    return p.finally(() => { this._pending--; });
  }

  _animateMove(axis, layer, dir, duration){
    const comp  = axis.x !== 0 ? 'x' : (axis.y !== 0 ? 'y' : 'z');
    const pivot = new THREE.Group();
    this.scene.add(pivot);

    for (const c of this.cubies){
      if (Math.round(c.position[comp]) === layer) pivot.attach(c);
    }

    const target = (Math.PI / 2) * dir;

    return tween(duration, k => {
      pivot.rotation[comp] = target * k;
    }).then(() => {
      pivot.rotation[comp] = target;
      pivot.updateMatrixWorld(true);

      for (const child of pivot.children.slice()){
        this.scene.attach(child);
        child.position.set(
          Math.round(child.position.x),
          Math.round(child.position.y),
          Math.round(child.position.z)
        );
      }
      this.scene.remove(pivot);
    });
  }

  pushHistory(step){
    this._history.length = this._cursor;
    this._history.push(step);
    this._cursor++;
    this._emitHistory();
  }

  clearHistory(){
    this._history = [];
    this._cursor = 0;
    this._emitHistory();
  }

  getHistoryState(){
    return { index: this._cursor, length: this._history.length };
  }

  _emitHistory(){
    if (this.onHistoryChange){
      this.onHistoryChange(this._cursor, this._history.length);
    }
  }

  goPrev(){
    if (this._cursor <= 0 || this.isBusy()) return null;
    const step = this._history[--this._cursor];
    const p = this.turn(step.axis, step.layer, -step.dir, 140);
    this._emitHistory();
    return p;
  }

  goNext(){
    if (this._cursor >= this._history.length || this.isBusy()) return null;
    const step = this._history[this._cursor++];
    const p = this.turn(step.axis, step.layer, step.dir, 140);
    this._emitHistory();
    return p;
  }

  reset(){
    for (const c of this.cubies){
      c.position.copy(c.userData.home);
      c.quaternion.identity();
    }
    this.resetView();
    this.clearHistory();
  }

  capture(){
    return this.cubies.map(c => ({
      pos:  { x: c.position.x,   y: c.position.y,   z: c.position.z },
      quat: { x: c.quaternion.x, y: c.quaternion.y, z: c.quaternion.z, w: c.quaternion.w }
    }));
  }

  restore(state){
    if (!state || state.length !== this.cubies.length) return false;
    state.forEach((s, i) => {
      this.cubies[i].position.set(s.pos.x, s.pos.y, s.pos.z);
      this.cubies[i].quaternion.set(s.quat.x, s.quat.y, s.quat.z, s.quat.w);
    });
    return true;
  }

  isSolved(){
    const faces = new Map();
    const n = new THREE.Vector3();

    for (const c of this.cubies){
      for (const s of c.userData.stickers){
        n.copy(s.normal).applyQuaternion(c.quaternion);
        const key = `${Math.round(n.x)},${Math.round(n.y)},${Math.round(n.z)}`;

        let set = faces.get(key);
        if (!set) faces.set(key, set = new Set());
        set.add(s.color);
      }
    }

    for (const set of faces.values()){
      if (set.size > 1) return false;
    }
    return true;
  }

  _tick(){
    this._rafId = requestAnimationFrame(this._tick);
    this.renderer.render(this.scene, this.camera);
  }

  dispose(){
    cancelAnimationFrame(this._rafId);

    if (this._ro) this._ro.disconnect();

    this.dom.removeEventListener('pointerdown',   this._h.down);
    this.dom.removeEventListener('pointermove',   this._h.move);
    window.removeEventListener('pointerup',       this._h.up);
    window.removeEventListener('pointercancel',   this._h.up);
    this.dom.removeEventListener('wheel',         this._h.wheel);
    this.dom.removeEventListener('touchstart',    this._h.ts);
    this.dom.removeEventListener('touchmove',     this._h.tm);
    this.dom.removeEventListener('touchend',      this._h.te);
    window.removeEventListener('resize',          this._h.resize);

    this.geometry.dispose();
    for (const k in this.materials) this.materials[k].dispose();
    this.renderer.dispose();

    if (this.dom.parentNode) this.dom.parentNode.removeChild(this.dom);
  }
}

Vue.component('cube-canvas', {
  template: '<div class="cube-canvas" ref="wrap"></div>',
  mounted(){
    this.engine = new CubeEngine(this.$refs.wrap);
    this.$emit('ready', this.engine);
  },
  beforeDestroy(){
    if (this.engine) this.engine.dispose();
  }
});

});

            <div class="snapshot-title">{{ it.title }}</div>

/* =========================================================================
   根实例
   ========================================================================= */
new Vue({
  el: '#app',

  data(){
    return {
      engine: null,
      uiVisible: true,

      moves: 0,
      timeText: '00:00',
      timing: false,
      tStart: 0,
      timerId: null,
      started: false,

      canPrev: false,
      canNext: false,
      locked: false,

      recording: false,
      recordedMoves: [],

      activeModal: null,
      snapshots: [],
      formulas: [],
      toast: { show: false, msg: '' }
    };
  },

  created(){
    this.snapshots = loadJSON(SNAPSHOT_KEY, []);
    this.formulas  = loadJSON(FORMULA_KEY, []);
    this._toastTimer = null;
  },

  beforeDestroy(){
    this.stopTimer();
    clearTimeout(this._toastTimer);
  },

  methods: {
    onEngineReady(engine){
      this.engine = engine;

      engine.onHistoryChange = (index, length) => {
        this.canPrev = index > 0;
        this.canNext = index < length;
      };

      engine.onUserTurn = step => {
        this.startTimer();
        this.moves++;
        if (this.recording) this.recordedMoves.push(step);
      };

      engine.onUserTurnEnd = () => {
        if (this.started && engine.isSolved()){
          this.stopTimer();
          this.started = false;
          this.showToast(`🎉 还原成功！步数 ${this.moves}，用时 ${this.timeText}`);
        }
      };

      // 双击空白处切换 UI 显隐
      engine.onBlankDblClick = () => this.toggleUI();

      const { index, length } = engine.getHistoryState();
      this.canPrev = index > 0;
      this.canNext = index < length;
    },

    toggleUI(){
      this.uiVisible = !this.uiVisible;
      this.showToast(this.uiVisible ? '已显示面板' : '已隐藏面板，双击空白处可恢复');
    },

    blockIfBusy(){
      if (this.engine && this.engine.isBusy()){
        this.showToast('动画进行中，请稍候…');
        return true;
      }
      return false;
    },

    startTimer(){
      if (this.timing) return;
      this.timing = true;
      this.tStart = performance.now();
      this._tickTimer();
      this.timerId = setInterval(this._tickTimer, 200);
    },

    _tickTimer(){
      if (!this.timing) return;
      this.timeText = fmtTime(performance.now() - this.tStart);
    },

    stopTimer(){
      if (this.timerId){
        clearInterval(this.timerId);
        this.timerId = null;
      }
      if (this.timing){
        this.timing = false;
        this.timeText = fmtTime(performance.now() - this.tStart);
      }
    },

    resetRun(){
      this.stopTimer();
      this.timing   = false;
      this.tStart   = 0;
      this.timeText = '00:00';
      this.moves    = 0;
      this.started  = false;
    },

    showToast(msg){
      this.toast = { show: true, msg };
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => {
        this.toast = { show: false, msg };
      }, 2600);
    },

    async onShuffle(){
      const engine = this.engine;
      if (!engine || engine.isBusy()) return;

      this.locked = true;
      this.resetRun();
      engine.clearHistory();
      this.showToast('🔀 正在打乱…');

      try {
        for (const m of genScramble(20)){
          engine.pushHistory(m);
          await engine.turn(m.axis, m.layer, m.dir, 80);
        }
        this.started = true;
        this.startTimer();
        this.showToast('🔀 打乱完成！');
      } finally {
        this.locked = false;
      }
    },

    onReset(){
      if (!this.engine) return;
      if (this.blockIfBusy()) return;

      this.engine.reset();
      this.resetRun();
      this.showToast('↺ 已复原');
    },

    onResetView(){
      if (!this.engine) return;
      this.engine.resetView();
      this.showToast('↺ 视角已还原');
    },

    onPrev(){
      if (!this.engine || this.engine.isBusy()) return;
      this.engine.goPrev();
    },

    onNext(){
      if (!this.engine || this.engine.isBusy()) return;
      this.engine.goNext();
    },

    onRecord(){
      if (!this.engine) return;
      if (this.blockIfBusy()) return;

      if (!this.recording){
        this.recording = true;
        this.recordedMoves = [];
        this.showToast('🔴 开始记录步骤，转动魔方吧');
        return;
      }

      this.recording = false;
      if (this.recordedMoves.length === 0){
        this.showToast('未记录到任何步骤');
        return;
      }
      this.activeModal = 'formula-save';
    },

    onSaveFormula(title){
      const moves = this.recordedMoves;
      const formula = {
        id:       Date.now(),
        title:    title || ('公式 ' + (this.formulas.length + 1)),
        time:     new Date().toLocaleString('zh-CN'),
        notation: moves.map(stepToNotation).join(' '),
        moves:    moves.map(m => ({
          axis:  { x: m.axis.x, y: m.axis.y, z: m.axis.z },
          layer: m.layer,
          dir:   m.dir
        }))
      };

      this.formulas.unshift(formula);
      this.persistFormulas();

      this.recordedMoves = [];
      this.closeModal();
      this.showToast('✓ 已保存公式「' + formula.title + '」');
    },

    async onPlayFormula(id){
      const formula = this.formulas.find(f => f.id === id);
      if (!formula || !this.engine) return;
      if (this.blockIfBusy()) return;

      this.closeModal();
      this.showToast('▶ 执行「' + formula.title + '」');

      for (const m of formula.moves){
        this.engine.pushHistory(m);
        this.moves++;
        await this.engine.turn(m.axis, m.layer, m.dir, 130);
      }
      this.showToast('✓ 公式执行完成');
    },

    onDeleteFormula(id){
      this.formulas = this.formulas.filter(f => f.id !== id);
      this.persistFormulas();
    },

    persistFormulas(){
      localStorage.setItem(FORMULA_KEY, JSON.stringify(this.formulas));
    },

    openSnapshotModal(){
      if (this.blockIfBusy()) return;
      this.activeModal = 'snapshot-save';
    },

    onSaveSnapshot(title){
      const snap = {
        id:    Date.now(),
        title: title || ('快照 ' + (this.snapshots.length + 1)),
        time:  new Date().toLocaleString('zh-CN'),
        cube:  this.engine.capture()
      };

      this.snapshots.unshift(snap);
      this.persistSnapshots();
      this.closeModal();
      this.showToast('✓ 已保存「' + snap.title + '」');
    },

    onRestoreSnapshot(id){
      const snap = this.snapshots.find(s => s.id === id);
      if (!snap || !this.engine) return;
      if (this.blockIfBusy()) return;

      if (!this.engine.restore(snap.cube)){
        this.showToast('快照数据不兼容');
        return;
      }

      this.resetRun();
      this.engine.clearHistory();
      this.closeModal();
      this.showToast('✓ 已恢复「' + snap.title + '」');
    },

    onDeleteSnapshot(id){
      this.snapshots = this.snapshots.filter(s => s.id !== id);
      this.persistSnapshots();
    },

    persistSnapshots(){
      localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(this.snapshots));
    },

    openSnapshotLibrary(){
      if (this.blockIfBusy()) return;
      this.activeModal = 'snapshot-lib';
    },

    openFormulaLibrary(){
      if (this.blockIfBusy()) return;
      this.activeModal = 'formula-lib';
    },

    closeModal(){
      this.activeModal = null;
    }
  }
});
</script>
