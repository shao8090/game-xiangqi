<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D魔方小游戏</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }
        .header {
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            pointer-events: auto;
            margin-top: env(safe-area-inset-top, 4px);
        }
        .header h1 {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
        .header p {
            font-size: 0.75rem;
            color: #1abc9c;
            font-weight: 500;
        }
        .controls {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
            background: rgba(20, 25, 35, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: env(safe-area-inset-bottom, 6px);
        }
        .section-label {
            font-size: 0.68rem;
            color: #95a5a6;
            margin-bottom: 2px;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        button {
            flex: 1;
            padding: 6px 0;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            line-height: 1.2;
            transition: background 0.15s, transform 0.1s;
        }
        button small {
            font-size: 0.65rem;
            opacity: 0.8;
            display: block;
        }
        button:active {
            transform: scale(0.94);
        }
        .btn-cw {
            background: rgba(52, 152, 219, 0.35);
            border: 1px solid rgba(52, 152, 219, 0.4);
        }
        .btn-cw:active {
            background: rgba(52, 152, 219, 0.7);
        }
        .btn-ccw {
            background: rgba(231, 76, 60, 0.35);
            border: 1px solid rgba(231, 76, 60, 0.4);
        }
        .btn-ccw:active {
            background: rgba(231, 76, 60, 0.7);
        }
        .action-btn {
            background: rgba(243, 156, 18, 0.4);
            border: 1px solid rgba(243, 156, 18, 0.4);
            padding: 8px 0;
        }
        .action-btn:active {
            background: rgba(243, 156, 18, 0.8);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="ui-layer">
        <div class="header">
            <h1>3D 掌上魔方</h1>
            <p>👆 直接滑动魔方转动对应层 | 背景滑动转视角</p>
        </div>

        <div class="controls">
            <div class="btn-row">
                <button class="action-btn" id="shuffle-btn">🎲 随机打乱</button>
                <button class="action-btn" id="reset-btn">🔄 一键复原</button>
            </div>
            <div>
                <div class="section-label">↷ 顺时针</div>
                <div class="btn-row">
                    <button class="btn-cw" data-face="U" data-dir="1">上<small>U</small></button>
                    <button class="btn-cw" data-face="D" data-dir="1">下<small>D</small></button>
                    <button class="btn-cw" data-face="L" data-dir="1">左<small>L</small></button>
                    <button class="btn-cw" data-face="R" data-dir="1">右<small>R</small></button>
                    <button class="btn-cw" data-face="F" data-dir="1">前<small>F</small></button>
                    <button class="btn-cw" data-face="B" data-dir="1">后<small>B</small></button>
                </div>
            </div>
            <div>
                <div class="section-label">↶ 逆时针</div>
                <div class="btn-row">
                    <button class="btn-ccw" data-face="U" data-dir="-1">上'<small>U'</small></button>
                    <button class="btn-ccw" data-face="D" data-dir="-1">下'<small>D'</small></button>
                    <button class="btn-ccw" data-face="L" data-dir="-1">左'<small>L'</small></button>
                    <button class="btn-ccw" data-face="R" data-dir="-1">右'<small>R'</small></button>
                    <button class="btn-ccw" data-face="F" data-dir="-1">前'<small>F'</small></button>
                    <button class="btn-ccw" data-face="B" data-dir="-1">后'<small>B'</small></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 基础场景构建 ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4.5, 4.5, 6.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        function updateViewport() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            const yShift = Math.min(h * 0.12, 90);
            camera.setViewOffset(w, h, 0, yShift, w, h);
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        updateViewport();

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. 魔方网格 ---
        const colors = {
            R: 0xb71234, L: 0xff5800, U: 0xffffff, 
            D: 0xffd500, F: 0x009b48, B: 0x0046ad, 
            IN: 0x1e1e1e
        };

        const pieceSize = 0.96;
        const spacing = 1.0;
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        const pieces = [];

        function createCube() {
            while (cubeGroup.children.length > 0) { 
                cubeGroup.remove(cubeGroup.children[0]); 
            }
            pieces.length = 0;

            const boxGeo = new THREE.BoxGeometry(pieceSize, pieceSize, pieceSize);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const materials = [
                            new THREE.MeshLambertMaterial({ color: x === 1 ? colors.R : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: x === -1 ? colors.L : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: y === 1 ? colors.U : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: y === -1 ? colors.D : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: z === 1 ? colors.F : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: z === -1 ? colors.B : colors.IN })
                        ];

                        const piece = new THREE.Mesh(boxGeo, materials);
                        piece.position.set(x * spacing, y * spacing, z * spacing);
                        cubeGroup.add(piece);
                        pieces.push(piece);
                    }
                }
            }
        }
        createCube();

        // --- 3. 任意轴/任意层旋转通用核心 ---
        let isAnimating = false;

        // 通用旋转接口：支持任意轴 ('x','y','z')，任意层 (-1, 0, 1)，方向 (1, -1)
        function rotateLayer(axis, layerValue, dir, customSpeed = null, callback = null) {
            if (isAnimating && customSpeed === null) return;
            isAnimating = true;

            const targetAngle = (Math.PI / 2) * dir;
            const activePieces = pieces.filter(p => Math.abs(p.position[axis] - layerValue * spacing) < 0.1);

            const pivot = new THREE.Object3D();
            scene.add(pivot);
            activePieces.forEach(p => pivot.attach(p));

            const duration = customSpeed || 200;
            const startTime = performance.now();

            function animateRotate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                pivot.rotation[axis] = targetAngle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animateRotate);
                } else {
                    pivot.rotation[axis] = targetAngle;
                    pivot.updateMatrixWorld();
                    activePieces.forEach(p => {
                        cubeGroup.attach(p);
                        p.position.x = Math.round(p.position.x);
                        p.position.y = Math.round(p.position.y);
                        p.position.z = Math.round(p.position.z);
                    });
                    scene.remove(pivot);
                    isAnimating = false;
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animateRotate);
        }

        // --- 4. 点击滑动魔方检测与自动定向 (Raycast & Vector Math) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        const touchState = {
            active: false,
            piece: null,
            normal: null,
            touchPoint: null,
            startX: 0,
            startY: 0
        };

        // 将 3D 方向向量投影至屏幕像素坐标系
        function projectDirectionToScreen(originWorld, dir3D) {
            const p1 = originWorld.clone().project(camera);
            const p2 = originWorld.clone().add(dir3D).project(camera);
            const w = window.innerWidth / 2;
            const h = window.innerHeight / 2;
            return new THREE.Vector2((p2.x - p1.x) * w, -(p2.y - p1.y) * h);
        }

        // 监听 Pointer 事件（完美兼容 PC 鼠标和手机触摸）
        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (isAnimating) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(pieces);
            if (intersects.length > 0) {
                // 点击到魔方：暂时冻结视角旋转，记录触摸面
                controls.enabled = false;
                touchState.active = true;
                touchState.piece = intersects[0].object;
                touchState.touchPoint = intersects[0].point;
                touchState.startX = e.clientX;
                touchState.startY = e.clientY;

                // 提取触摸面的绝对世界法线
                const normal = intersects[0].face.normal.clone();
                normal.transformDirection(touchState.piece.matrixWorld);
                normal.x = Math.round(normal.x);
                normal.y = Math.round(normal.y);
                normal.z = Math.round(normal.z);
                touchState.normal = normal;
            } else {
                controls.enabled = true;
                touchState.active = false;
            }
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!touchState.active || isAnimating) return;

            const dx = e.clientX - touchState.startX;
            const dy = e.clientY - touchState.startY;
            const distance = Math.hypot(dx, dy);

            // 滑动超过 18 像素阈值，判定为转动指令
            if (distance > 18) {
                touchState.active = false;
                controls.enabled = true;

                const N = touchState.normal;
                // 找出与法线垂直的两个切线轴 (T1, T2)
                let T1, T2;
                if (Math.abs(N.x) > 0.5) {
                    T1 = new THREE.Vector3(0, 1, 0);
                    T2 = new THREE.Vector3(0, 0, 1);
                } else if (Math.abs(N.y) > 0.5) {
                    T1 = new THREE.Vector3(1, 0, 0);
                    T2 = new THREE.Vector3(0, 0, 1);
                } else {
                    T1 = new THREE.Vector3(1, 0, 0);
                    T2 = new THREE.Vector3(0, 1, 0);
                }

                // 投影切线到屏幕
                const s1 = projectDirectionToScreen(touchState.touchPoint, T1);
                const s2 = projectDirectionToScreen(touchState.touchPoint, T2);

                const drag = new THREE.Vector2(dx, dy);
                const dot1 = drag.dot(s1.clone().normalize());
                const dot2 = drag.dot(s2.clone().normalize());

                // 判定用户的实际滑动趋势更接近 T1 还是 T2
                let chosenTangent;
                if (Math.abs(dot1) > Math.abs(dot2)) {
                    chosenTangent = T1.clone().multiplyScalar(Math.sign(dot1));
                } else {
                    chosenTangent = T2.clone().multiplyScalar(Math.sign(dot2));
                }

                // 叉乘计算角速度向量: ω = N × Tangent
                const omega = new THREE.Vector3().crossVectors(N, chosenTangent);

                // 确定目标转轴和方向
                let axis = 'x';
                let dir = 1;
                if (Math.abs(omega.x) > 0.5) {
                    axis = 'x';
                    dir = Math.sign(omega.x);
                } else if (Math.abs(omega.y) > 0.5) {
                    axis = 'y';
                    dir = Math.sign(omega.y);
                } else if (Math.abs(omega.z) > 0.5) {
                    axis = 'z';
                    dir = Math.sign(omega.z);
                }

                // 计算属于该转轴的具体层数值 (-1, 0, 1)
                const layerValue = Math.round(touchState.piece.position[axis]);

                // 触发转动！
                rotateLayer(axis, layerValue, dir);
            }
        });

        const cancelTouch = () => {
            touchState.active = false;
            controls.enabled = true;
        };
        renderer.domElement.addEventListener('pointerup', cancelTouch);
        renderer.domElement.addEventListener('pointercancel', cancelTouch);

        // --- 5. 底部按钮兼容 ---
        const faceConfig = {
            'R': { axis: 'x', value: 1,  baseDir: -1 },
            'L': { axis: 'x', value: -1, baseDir: 1 },
            'U': { axis: 'y', value: 1,  baseDir: -1 },
            'D': { axis: 'y', value: -1, baseDir: 1 },
            'F': { axis: 'z', value: 1,  baseDir: -1 },
            'B': { axis: 'z', value: -1, baseDir: 1 },
        };

        document.querySelectorAll('button[data-face]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const button = e.currentTarget;
                const face = button.getAttribute('data-face');
                const dirMultiplier = parseInt(button.getAttribute('data-dir'), 10);
                const cfg = faceConfig[face];
                rotateLayer(cfg.axis, cfg.value, dirMultiplier * cfg.baseDir);
            });
        });

        // 打乱
        function shuffleCube() {
            if (isAnimating) return;
            const axes = ['x', 'y', 'z'];
            const layers = [-1, 0, 1];
            const dirs = [1, -1];
            let count = 18;
            
            function step() {
                if (count <= 0) return;
                const axis = axes[Math.floor(Math.random() * axes.length)];
                const layer = layers[Math.floor(Math.random() * layers.length)];
                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                rotateLayer(axis, layer, dir, 50, () => {
                    count--;
                    step();
                });
            }
            step();
        }

        document.getElementById('shuffle-btn').addEventListener('click', shuffleCube);
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (isAnimating) return;
            createCube();
        });

        window.addEventListener('resize', updateViewport);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
