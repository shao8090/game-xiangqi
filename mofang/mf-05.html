<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五阶魔方 3D</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
        html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
        body{display:flex;flex-direction:column;background:radial-gradient(1200px 800px at 50% 15%,#2b3a67,#1a2238 60%,#10142a)}
        #topbar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:auto auto;gap:6px;padding:8px 12px;color:#fff}
        #topbar .stat{font-size:12px;opacity:.85;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
        #topbar .stat b{font-size:14px;color:#7fe3ff}
        #topbar .btn{justify-self:stretch;align-self:stretch}
        #footer{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;color:#fff;border-top:1px solid rgba(255,255,255,.1)}
        .btn{border:none;cursor:pointer;color:#fff;font-size:13px;padding:7px 14px;border-radius:10px;background:linear-gradient(135deg,#4f6df5,#7b3ff2);box-shadow:0 4px 14px rgba(79,109,245,.4);transition:transform .1s;white-space:nowrap}
        .btn:active{transform:scale(.94)}
        .btn.gray{background:linear-gradient(135deg,#3a4358,#2a3040);box-shadow:0 4px 14px rgba(0,0,0,.35)}
        .btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
        .btn:disabled:active{transform:none}
        .btn.recording{background:linear-gradient(135deg,#e63946,#ff5800);box-shadow:0 4px 14px rgba(230,57,70,.5);animation:pulse 1.2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
        .stat{font-size:12px;opacity:.85;margin-left:4px}
        .stat b{font-size:14px;color:#7fe3ff}
        #wrap{flex:1;position:relative;touch-action:none}
        canvas{display:block}
        #hint{position:fixed;bottom:12px;width:100%;text-align:center;font-size:12px;color:#fff;opacity:.55;pointer-events:none}
        #toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:12px 24px;border-radius:14px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;white-space:nowrap}
        #toast.show{opacity:1}
        #snapshot-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
        #snapshot-modal.show{display:flex}
        .modal-box{background:#1e2436;border-radius:16px;padding:24px;width:90%;max-width:380px;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
        .modal-box h3{margin:0 0 16px;font-size:18px}
        .modal-box input{width:100%;padding:12px;border:1px solid #3a4358;border-radius:10px;background:#10142a;color:#fff;font-size:15px;outline:none;margin-bottom:16px}
        .modal-box input:focus{border-color:#7b3ff2}
        .modal-actions{display:flex;gap:10px;justify-content:flex-end}
        .snapshot-list{max-height:300px;overflow-y:auto;margin-top:8px}
        .snapshot-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#10142a;border-radius:10px;margin-bottom:8px}
        .snapshot-info{flex:1;overflow:hidden}
        .snapshot-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .snapshot-time{font-size:12px;opacity:.5;margin-top:2px}
        .snapshot-actions{display:flex;gap:6px}
        .snapshot-actions button{border:none;cursor:pointer;font-size:12px;padding:6px 10px;border-radius:8px;color:#fff;background:linear-gradient(135deg,#4f6df5,#7b3ff2)}
        .snapshot-actions button.del{background:linear-gradient(135deg,#c41e3a,#ff5800)}
        .empty-tip{text-align:center;opacity:.5;padding:30px 0;font-size:14px}
        .notation-box{background:#10142a;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;max-height:110px;overflow-y:auto;word-break:break-all;color:#7fe3ff;font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:16px}
    </style>
    <script src="./../js/three.min.js"></script>
    <script src="./../js/vue.min.js"></script>
</head>
<body>

    <div id="topbar">
        <button class="btn gray" id="btn-list-snap">� 快照库</button>
        <button class="btn gray" id="btn-formula-lib">� 公式库</button>
        <span class="stat">步数 <b id="steps">0</b></span>
        <button class="btn gray" id="btn-reset">↺ 复原</button>
        <button class="btn" id="btn-save-snap">📸 存快照</button>
        <button class="btn" id="btn-record">⏺ 记录</button>
        <span class="stat">时间 <b id="timer">00:00</b></span>
        <button class="btn" id="btn-scramble">🔀 打乱</button>
    </div>
    <div id="wrap"></div>
    <div id="footer">
        <button class="btn gray" id="btn-undo" style="width: 100%;">◀ 上一步</button>
        <button class="btn gray" id="btn-reset-view">↺ 视角</button>
        <button class="btn gray" id="btn-redo" style="width: 100%;">下一步 ▶</button>
    </div>
    <div id="toast"></div>

    <!-- 通用模态框 -->
    <div id="snapshot-modal">
        <div class="modal-box" id="modal-content"></div>
    </div>

    <script>
    /* ============================================================
     *  五阶魔方 3D · 重构版
     *  模块顺序：
     *  常量 → 工具 → 场景 → 魔方 → 转动引擎 → 历史 → 记号
     *  → 存储 → 弹窗 → 快照 → 公式 → 打乱 → 交互 → UI → 主循环
     * ============================================================ */

    /* ---------------- 1. 常量 ---------------- */
    const SIZE          = 5;
    const CUBE_SIZE     = 1.0;
    const GAP           = 0.04;
    const STEP          = CUBE_SIZE + GAP;
    const OFFSET        = (SIZE - 1) / 2;
    const MAX_LAYER     = (SIZE - 1) / 2;        // ±2
    const HALF_STEP     = STEP / 2;
    const TURN_DURATION = 160;
    const FAST_DURATION = 150;
    const SCRAMBLE_LEN  = 24;
    const MAX_HISTORY   = 600;                   // 历史栈上限，防止内存无限增长

    const COLORS = {
        R: 0xc41e3a, L: 0xff5800, U: 0xffffff,
        D: 0xffd500, F: 0x009e60, B: 0x0051ba,
        INNER: 0x1a1a1a
    };
    const AXES         = ['x', 'y', 'z'];
    const LAYER_COORDS = [-2, -1, 0, 1, 2];
    const TURN_DIRS    = [1, -1, 2];

    /* ---------------- 2. 通用工具 ---------------- */
    const $ = id => document.getElementById(id);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str ?? '';
        return d.innerHTML;
    }
    function loadJSON(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
        catch { return fallback; }
    }
    function saveJSON(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    let toastTimer = null;
    function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function focusInput(id) {
        setTimeout(() => {
            const el = $(id);
            if (!el) return;
            el.focus();
            if (el.select) el.select();
        }, 50);
    }
    function bindEnter(id, fn) {
        const el = $(id);
        if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') fn(); });
    }

    /* ---------------- 3. Three.js 场景 ---------------- */
    const wrap = $('wrap');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    wrap.appendChild(renderer.domElement);
    const dom = renderer.domElement;

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
    dirLight.position.set(6, 10, 8);
    scene.add(dirLight);

    const cubeGroup = new THREE.Group();
    cubeGroup.position.y = 0.7;
    scene.add(cubeGroup);

    /* --- 相机轨道 --- */
    const DEFAULT_VIEW = { theta: 0.8, phi: 1.02, rad: 24 };
    const RAD_MIN = 5.5, RAD_MAX = 28;
    let RAD = DEFAULT_VIEW.rad;
    let theta = DEFAULT_VIEW.theta;
    let phi = DEFAULT_VIEW.phi;

    function updateCamera() {
        camera.position.setFromSphericalCoords(RAD, phi, theta);
        camera.lookAt(0, 0, 0);
    }
    function resetView() {
        theta = DEFAULT_VIEW.theta;
        phi = DEFAULT_VIEW.phi;
        RAD = DEFAULT_VIEW.rad;
        updateCamera();
    }
    function resize() {
        const w = wrap.clientWidth, h = wrap.clientHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    updateCamera();

    /* ---------------- 4. 魔方构建 ---------------- */
    // 材质全局共享：7 个材质实例替代原先的 5×5×5×6 = 750 个
    const MATERIALS = {};
    for (const key in COLORS) {
        MATERIALS[key] = new THREE.MeshLambertMaterial({ color: COLORS[key] });
    }
    const CUBIE_GEOMETRY = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);

    let cubies = [];

    function initCube() {
        while (cubeGroup.children.length) cubeGroup.remove(cubeGroup.children[0]);
        cubies = [];

        for (let x = 0; x < SIZE; x++) {
            for (let y = 0; y < SIZE; y++) {
                for (let z = 0; z < SIZE; z++) {
                    // 面序：+X, -X, +Y, -Y, +Z, -Z
                    const mats = [
                        x === SIZE - 1 ? MATERIALS.R : MATERIALS.INNER,
                        x === 0        ? MATERIALS.L : MATERIALS.INNER,
                        y === SIZE - 1 ? MATERIALS.U : MATERIALS.INNER,
                        y === 0        ? MATERIALS.D : MATERIALS.INNER,
                        z === SIZE - 1 ? MATERIALS.F : MATERIALS.INNER,
                        z === 0        ? MATERIALS.B : MATERIALS.INNER
                    ];
                    const mesh = new THREE.Mesh(CUBIE_GEOMETRY, mats);
                    mesh.position.set(
                        (x - OFFSET) * STEP,
                        (y - OFFSET) * STEP,
                        (z - OFFSET) * STEP
                    );
                    cubeGroup.add(mesh);
                    cubies.push(mesh);
                }
            }
        }
    }

    /* --- 坐标吸附 & 姿态正交化（复用临时矩阵，避免每块新建） --- */
    const _tmpMatrix = new THREE.Matrix4();

    function snapCoord(v) {
        return clamp(Math.round(v / STEP), -MAX_LAYER, MAX_LAYER) * STEP;
    }
    function snapCubie(mesh) {
        mesh.position.set(
            snapCoord(mesh.position.x),
            snapCoord(mesh.position.y),
            snapCoord(mesh.position.z)
        );

        mesh.updateMatrix();
        _tmpMatrix.extractRotation(mesh.matrix);
        const e = _tmpMatrix.elements;
        for (let i = 0; i < 16; i++) e[i] = Math.round(e[i]); // 90° 倍数旋转矩阵元素严格为 -1/0/1
        mesh.quaternion.setFromRotationMatrix(_tmpMatrix);
        mesh.updateMatrix();
    }

    initCube();

    /* ---------------- 5. 转动引擎（串行队列） ---------------- */
    let isAnimating = false;

    function rotateSlice(axis, layerCoord, direction, duration = TURN_DURATION) {
        if (isAnimating) return Promise.resolve();
        isAnimating = true;

        return new Promise(resolve => {
            // 临时节点挂在 cubeGroup 内部，保证轴向与相机视角解耦
            const pivot = new THREE.Group();
            cubeGroup.add(pivot);

            const layerPos = layerCoord * STEP;
            const active = cubies.filter(
                c => Math.abs(c.position[axis] - layerPos) < HALF_STEP
            );
            active.forEach(c => pivot.attach(c));

            const targetAngle = (Math.PI / 2) * direction;
            const startTime = performance.now();

            (function animate(time) {
                const progress = Math.min((time - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                pivot.rotation[axis] = targetAngle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                    return;
                }

                pivot.rotation[axis] = targetAngle;
                pivot.updateMatrixWorld(true);
                active.forEach(c => {
                    cubeGroup.attach(c);
                    snapCubie(c);
                });
                cubeGroup.remove(pivot);

                isAnimating = false;
                resolve();
            })(startTime);
        });
    }

    // 队列：所有转动串行执行，快速连点不丢步
    let moveQueue = Promise.resolve();
    let queueCount = 0;

    function enqueueMove(axis, layer, dir, duration = TURN_DURATION) {
        queueCount++;
        const task = moveQueue.then(() => rotateSlice(axis, layer, dir, duration));
        moveQueue = task.catch(() => {});
        return task.finally(() => { queueCount--; });
    }

    const isBusy = () => isAnimating || queueCount > 0;

    /* ---------------- 6. 历史（上一步 / 下一步） ---------------- */
    let history = [];
    let historyIndex = 0;

    const btnUndo = $('btn-undo');
    const btnRedo = $('btn-redo');

    function updateHistoryUI() {
        btnUndo.disabled = historyIndex <= 0;
        btnRedo.disabled = historyIndex >= history.length;
    }

    function pushHistory(step) {
        if (historyIndex < history.length) history.length = historyIndex; // 丢弃“未来”
        history.push(step);
        if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
        historyIndex = history.length;
        updateHistoryUI();
    }

    function clearHistory() {
        history = [];
        historyIndex = 0;
        updateHistoryUI();
    }

    /* ---------------- 7. 记录器 ---------------- */
    let recording = false;
    let recordedSteps = [];
    let recordedInitialState = null;  // 记录开始时的魔方初始状态

    const btnRecord = $('btn-record');

    function updateRecordUI() {
        btnRecord.classList.toggle('recording', recording);
        btnRecord.textContent = recording
            ? `⏹ 停止记录 (${recordedSteps.length})`
            : '⏺ 记录';
    }

    /**
     * 统一入口：执行一步转动并登记历史 / 记录器
     * @param {'x'|'y'|'z'} axis
     * @param {number} layer  -2..2
     * @param {number} dir    1 | -1 | 2 | -2
     * @param {{duration?:number, track?:boolean, record?:boolean}} opts
     */
    async function performMove(axis, layer, dir, opts = {}) {
        const { duration = TURN_DURATION, track = true, record = true } = opts;

        await enqueueMove(axis, layer, dir, duration);

        if (track) pushHistory({ axis, layer, dir });

        if (record && recording) {
            recordedSteps.push({ axis, layer, dir });
            updateRecordUI();
        }
    }

    async function undoStep() {
        if (isBusy()) return;
        if (historyIndex <= 0) { toast('已经是最早一步了'); return; }
        const step = history[--historyIndex];
        updateHistoryUI();
        await enqueueMove(step.axis, step.layer, -step.dir, FAST_DURATION);
    }

    async function redoStep() {
        if (isBusy()) return;
        if (historyIndex >= history.length) { toast('已经是最新一步了'); return; }
        const step = history[historyIndex++];
        updateHistoryUI();
        await enqueueMove(step.axis, step.layer, step.dir, FAST_DURATION);
    }

    btnUndo.addEventListener('click', undoStep);
    btnRedo.addEventListener('click', redoStep);

    /* ---------------- 8. 公式记号 ---------------- */
    // cw：该层“顺时针”对应的 dir 符号（dir * cw > 0 即顺时针）
    const NOTATION_MAP = {
        'x,2':  { name: 'R',  cw: -1 },
        'x,1':  { name: '2R', cw: -1 },
        'x,0':  { name: 'M',  cw: 1  },
        'x,-1': { name: '2L', cw: 1  },
        'x,-2': { name: 'L',  cw: 1  },
        'y,2':  { name: 'U',  cw: -1 },
        'y,1':  { name: '2U', cw: -1 },
        'y,0':  { name: 'E',  cw: 1  },
        'y,-1': { name: '2D', cw: 1  },
        'y,-2': { name: 'D',  cw: 1  },
        'z,2':  { name: 'F',  cw: -1 },
        'z,1':  { name: '2F', cw: -1 },
        'z,0':  { name: 'S',  cw: -1 },
        'z,-1': { name: '2B', cw: 1  },
        'z,-2': { name: 'B',  cw: 1  }
    };

    function stepToNotation(step) {
        const info = NOTATION_MAP[step.axis + ',' + step.layer];
        if (!info) return step.axis + step.layer + (step.dir > 0 ? '+' : '-');
        if (Math.abs(step.dir) === 2) return info.name + '2';
        return info.name + (step.dir * info.cw > 0 ? '' : "'");
    }

    function movesToNotation(moves) {
        return moves.map(stepToNotation).join(' ');
    }

    /* ---------------- 9. 弹窗控制 ---------------- */
    const modalEl = $('snapshot-modal');
    const modalContent = $('modal-content');

    function openModal(html) {
        modalContent.innerHTML = html;
        modalEl.classList.add('show');
    }
    function closeModal() {
        modalEl.classList.remove('show');
    }
    modalEl.addEventListener('click', e => {
        if (e.target === modalEl) closeModal();
    });

    /* ---------------- 10. 快照系统 ---------------- */
    const SNAPSHOT_KEY = 'cache_005';

    const getSnapshots = () => loadJSON(SNAPSHOT_KEY, []);
    const saveSnapshots = list => saveJSON(SNAPSHOT_KEY, list);

    function captureCubeState() {
        return cubies.map(c => ({
            pos:  { x: c.position.x,   y: c.position.y,   z: c.position.z },
            quat: { x: c.quaternion.x, y: c.quaternion.y, z: c.quaternion.z, w: c.quaternion.w }
        }));
    }

    function restoreCubeState(state) {
        if (!Array.isArray(state) || state.length !== cubies.length) return false;
        state.forEach((s, i) => {
            const c = cubies[i];
            c.position.set(s.pos.x, s.pos.y, s.pos.z);
            c.quaternion.set(s.quat.x, s.quat.y, s.quat.z, s.quat.w);
            snapCubie(c);
        });
        return true;
    }

    function saveSnapshot(title) {
        const snaps = getSnapshots();
        const snap = {
            id: Date.now(),
            title: title || `快照 ${snaps.length + 1}`,
            time: new Date().toLocaleString('zh-CN'),
            cube: captureCubeState()
        };
        snaps.unshift(snap);
        saveSnapshots(snaps);
        toast(`✓ 已保存"${snap.title}"`);
    }

    function deleteSnapshot(id) {
        saveSnapshots(getSnapshots().filter(s => s.id !== id));
        openSnapshotList();
    }

    function restoreSnapshot(id) {
        const snap = getSnapshots().find(s => s.id === id);
        if (!snap) return;
        if (isBusy()) { toast('动画进行中，请稍候…'); return; }
        if (!restoreCubeState(snap.cube)) { toast('快照数据不兼容'); return; }

        stopTimer();
        resetTimerDisplay();
        resetStats();
        clearHistory();          // 状态已跳变，历史作废
        closeModal();
        toast(`✓ 已恢复"${snap.title}"`);
    }

    function openSaveModal() {
        if (isBusy()) { toast('动画进行中，请稍候…'); return; }

        openModal(`
            <h3>📸 保存快照</h3>
            <input type="text" id="snap-title" placeholder="输入快照标题..." maxlength="30">
            <div class="modal-actions">
                <button class="btn gray" id="modal-cancel">取消</button>
                <button class="btn" id="modal-save">保存</button>
            </div>
        `);
        focusInput('snap-title');

        const doSave = () => {
            saveSnapshot($('snap-title').value.trim());
            closeModal();
        };
        $('modal-cancel').onclick = closeModal;
        $('modal-save').onclick = doSave;
        bindEnter('snap-title', doSave);
    }

    function openSnapshotList() {
        const snaps = getSnapshots();

        let html = '<h3>📋 快照库</h3><div class="snapshot-list">';
        if (snaps.length === 0) {
            html += '<div class="empty-tip">暂无快照</div>';
        } else {
            html += snaps.map(s => `
                <div class="snapshot-item">
                    <div class="snapshot-info">
                        <div class="snapshot-title">${escapeHtml(s.title)}</div>
                        <div class="snapshot-time">${s.time}</div>
                    </div>
                    <div class="snapshot-actions">
                        <button onclick="window._restore(${s.id})">恢复</button>
                        <button class="del" onclick="window._delete(${s.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }
        html += '</div><div class="modal-actions" style="margin-top:14px">'
              + '<button class="btn gray" id="modal-close">关闭</button></div>';

        openModal(html);
        $('modal-close').onclick = closeModal;
    }

    window._restore = restoreSnapshot;
    window._delete  = deleteSnapshot;

    $('btn-save-snap').addEventListener('click', openSaveModal);
    $('btn-list-snap').addEventListener('click', openSnapshotList);

    /* ---------------- 11. 公式（步骤）库 ---------------- */
    const FORMULA_KEY = 'formula_005';

    const getFormulas = () => loadJSON(FORMULA_KEY, []);
    const saveFormulas = list => saveJSON(FORMULA_KEY, list);

    function persistFormula(title) {
        const list = getFormulas();
        const moves = recordedSteps.map(s => ({ axis: s.axis, layer: s.layer, dir: s.dir }));
        const formula = {
            id: Date.now(),
            title: title || `公式 ${list.length + 1}`,
            time: new Date().toLocaleString('zh-CN'),
            moves,
            notation: movesToNotation(moves),
            initialState: recordedInitialState  // 保存记录时的初始状态
        };
        list.unshift(formula);
        saveFormulas(list);
        recordedInitialState = null;
        toast(`✓ 已保存「${formula.title}」到步骤库`);
    }

    /* --- 记录按钮 --- */
    function toggleRecording() {
        if (!recording) {
            recording = true;
            recordedSteps = [];
            recordedInitialState = captureCubeState();  // 记录当前魔方状态
            updateRecordUI();
            toast('⏺ 开始记录步骤，转动魔方即可');
            return;
        }

        recording = false;
        updateRecordUI();

        if (recordedSteps.length === 0) {
            toast('⏹ 已停止（未记录到步骤）');
            return;
        }
        openSaveFormulaModal();
    }

    /* --- 保存公式弹窗（记录停止后触发） --- */
    function openSaveFormulaModal() {
        const defaultName = `公式 ${getFormulas().length + 1}`;
        const notation = movesToNotation(recordedSteps);

        openModal(`
            <h3>💾 保存公式</h3>
            <input type="text" id="formula-title-input"
                   value="${escapeHtml(defaultName)}" placeholder="输入公式名称..." maxlength="30">
            <div class="notation-box">${escapeHtml(notation)}</div>
            <div class="modal-actions">
                <button class="btn gray" id="modal-cancel">取消</button>
                <button class="btn" id="modal-save">保存</button>
            </div>
        `);
        focusInput('formula-title-input');

        const doSave = () => {
            const title = $('formula-title-input').value.trim() || defaultName;
            persistFormula(title);
            recordedSteps = [];
            closeModal();
        };
        $('modal-cancel').onclick = () => {
            recordedSteps = [];
            recordedInitialState = null;
            closeModal();
            toast('⏹ 已取消保存');
        };
        $('modal-save').onclick = doSave;
        bindEnter('formula-title-input', doSave);
    }

    /* --- 步骤库列表 --- */
    function openFormulaList() {
        const list = getFormulas();

        let html = '<h3>📜 步骤库</h3><div class="snapshot-list">';
        if (list.length === 0) {
            html += '<div class="empty-tip">暂无公式</div>';
        } else {
            html += list.map(f => `
                <div class="snapshot-item">
                    <div class="snapshot-info">
                        <div class="snapshot-title">${escapeHtml(f.title)}</div>
                        <div class="snapshot-time">${f.time} · ${f.moves.length} 步</div>
                        <div class="snapshot-time" style="color:#7fe3ff;font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.9">${escapeHtml(f.notation || '')}</div>
                    </div>
                    <div class="snapshot-actions">
                        <button onclick="window._viewFormulaSteps(${f.id})">查看步骤</button>
                        <button onclick="window._playFormula(${f.id})">回放</button>
                        <button onclick="window._renameFormula(${f.id})">改名</button>
                        <button class="del" onclick="window._deleteFormula(${f.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }
        html += '</div><div class="modal-actions" style="margin-top:14px">'
              + '<button class="btn gray" id="modal-close">关闭</button></div>';

        openModal(html);
        $('modal-close').onclick = closeModal;
    }

    function deleteFormula(id) {
        saveFormulas(getFormulas().filter(f => f.id !== id));
        openFormulaList();
    }

    function renameFormula(id) {
        const target = getFormulas().find(f => f.id === id);
        if (!target) return;

        openModal(`
            <h3>✏ 重命名公式</h3>
            <input type="text" id="rename-input" value="${escapeHtml(target.title)}"
                   placeholder="输入新名称..." maxlength="30">
            <div class="modal-actions">
                <button class="btn gray" id="modal-cancel">取消</button>
                <button class="btn" id="modal-save">保存</button>
            </div>
        `);
        focusInput('rename-input');

        const doRename = () => {
            const newTitle = $('rename-input').value.trim();
            if (newTitle && newTitle !== target.title) {
                const list = getFormulas();
                const item = list.find(x => x.id === id);
                if (item) {
                    item.title = newTitle;
                    saveFormulas(list);
                    toast(`✓ 已重命名为「${newTitle}」`);
                }
            }
            closeModal();
            openFormulaList();
        };
        $('modal-cancel').onclick = () => { closeModal(); openFormulaList(); };
        $('modal-save').onclick = doRename;
        bindEnter('rename-input', doRename);
    }

    async function playFormula(id) {
        const formula = getFormulas().find(f => f.id === id);
        if (!formula) return;
        if (isBusy()) { toast('动画进行中，请稍候…'); return; }

        closeModal();
        setControlsDisabled(true);

        // 先恢复到记录时的初始状态
        if (formula.initialState) {
            if (!restoreCubeState(formula.initialState)) {
                toast('快照数据不兼容');
                setControlsDisabled(false);
                return;
            }
        }

        for (const m of formula.moves) {
            await performMove(m.axis, m.layer, m.dir, {
                duration: FAST_DURATION, track: true, record: false
            });
        }

        historyIndex = 0;              // 回放完毕，游标归零便于逐步回看
        setControlsDisabled(false);
        toast(`✓ 已回放「${formula.title}」，已回到第一步`);
    }

    /**
     * 查看步骤：恢复到初始状态，用户可用上一步/下一步逐步浏览
     */
    function viewFormulaSteps(id) {
        const formula = getFormulas().find(f => f.id === id);
        if (!formula) return;
        if (isBusy()) { toast('动画进行中，请稍候…'); return; }

        closeModal();

        // 恢复到记录时的初始状态
        if (formula.initialState) {
            if (!restoreCubeState(formula.initialState)) {
                toast('快照数据不兼容');
                return;
            }
        }

        stopTimer();
        resetTimerDisplay();
        resetStats();

        // 将步骤写入历史，游标归零，用户可用下一步逐步浏览
        history = formula.moves.map(m => ({ axis: m.axis, layer: m.layer, dir: m.dir }));
        historyIndex = 0;
        updateHistoryUI();

        toast(`📖 已恢复「${formula.title}」初始状态，使用 ◀ ▶ 浏览步骤`);
    }

    window._playFormula   = playFormula;
    window._viewFormulaSteps = viewFormulaSteps;
    window._renameFormula = renameFormula;
    window._deleteFormula = deleteFormula;

    btnRecord.addEventListener('click', toggleRecording);
    $('btn-formula-lib').addEventListener('click', openFormulaList);

    /* ---------------- 12. 打乱 ---------------- */
    function generateScrambleSequence(length = SCRAMBLE_LEN) {
        const seq = [];
        let lastAxis = '', lastLayer = null;

        for (let i = 0; i < length; i++) {
            let axis, layer;
            do {
                axis  = AXES[Math.floor(Math.random() * AXES.length)];
                layer = LAYER_COORDS[Math.floor(Math.random() * LAYER_COORDS.length)];
            } while (axis === lastAxis && layer === lastLayer);   // 避免同轴同层连打

            seq.push({
                axis,
                layer,
                dir: TURN_DIRS[Math.floor(Math.random() * TURN_DIRS.length)]
            });
            lastAxis = axis;
            lastLayer = layer;
        }
        return seq;
    }

    async function runScramble() {
        if (isBusy()) return;

        setControlsDisabled(true);
        stopTimer();
        resetTimerDisplay();
        resetStats();
        toast('🔀 正在打乱...');

        for (const step of generateScrambleSequence()) {
            const duration = Math.abs(step.dir) === 2 ? 80 : 55;
            await performMove(step.axis, step.layer, step.dir, {
                duration, track: true, record: false
            });
        }

        toast('🔀 打乱完成！');
        setControlsDisabled(false);
    }

    /* ---------------- 13. 控件锁定 ---------------- */
    const LOCKABLE = '#topbar button, #footer button';

    function setControlsDisabled(disabled) {
        document.querySelectorAll(LOCKABLE).forEach(b => { b.disabled = disabled; });
        if (!disabled) updateHistoryUI();
    }

    /* ---------------- 14. 交互：旋转 / 缩放 / 滑转 ---------------- */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    let drag = null;

    dom.addEventListener('pointerdown', e => {
        e.preventDefault();
        dom.setPointerCapture(e.pointerId);

        const rect = dom.getBoundingClientRect();
        ndc.set(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
        );
        raycaster.setFromCamera(ndc, camera);

        const hits = raycaster.intersectObjects(cubies, false);
        if (hits.length && !isBusy()) {
            const hit = hits[0];
            const normal = hit.face.normal.clone()
                .transformDirection(hit.object.matrixWorld);
            normal.set(Math.round(normal.x), Math.round(normal.y), Math.round(normal.z));

            drag = {
                type: 'layer',
                cubie: hit.object,
                normal,
                point: hit.point.clone(),
                sx: e.clientX,
                sy: e.clientY,
                done: false
            };
        } else {
            drag = { type: 'view', sx: e.clientX, sy: e.clientY };
        }
    });

    dom.addEventListener('pointermove', e => {
        if (!drag) return;

        const dx = e.clientX - drag.sx;
        const dy = e.clientY - drag.sy;

        if (drag.type === 'view') {
            theta -= dx * 0.008;
            phi = clamp(phi - dy * 0.008, 0.15, Math.PI - 0.15);
            drag.sx = e.clientX;
            drag.sy = e.clientY;
            updateCamera();
            return;
        }

        if (!drag.done && Math.hypot(dx, dy) > 14) {
            drag.done = true;
            handleCubeDrag(drag, dx, dy);
            drag = null;
        }
    });

    window.addEventListener('pointerup', () => { drag = null; });
    window.addEventListener('pointercancel', () => { drag = null; });

    /* --- 双指捏合缩放 --- */
    let pinchDist0 = 0, pinchRad0 = RAD;

    dom.addEventListener('touchstart', e => {
        if (e.touches.length !== 2) return;
        drag = null;
        pinchDist0 = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        pinchRad0 = RAD;
    }, { passive: false });

    dom.addEventListener('touchmove', e => {
        if (e.touches.length !== 2 || pinchDist0 <= 0) return;
        e.preventDefault();
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        RAD = clamp(pinchRad0 * (pinchDist0 / dist), RAD_MIN, RAD_MAX);
        updateCamera();
    }, { passive: false });

    dom.addEventListener('touchend', () => { pinchDist0 = 0; });

    /* --- 滚轮缩放 --- */
    dom.addEventListener('wheel', e => {
        e.preventDefault();
        RAD = clamp(RAD * (1 + e.deltaY * 0.001), RAD_MIN, RAD_MAX);
        updateCamera();
    }, { passive: false });

    /* --- 滑转解算 --- */
    function screenDir(point, vec) {
        const a = point.clone().project(camera);
        const b = point.clone().add(vec).project(camera);
        return new THREE.Vector2(b.x - a.x, b.y - a.y).normalize();
    }

    function handleCubeDrag(d, dx, dy) {
        const n = d.normal;

        // 面上两个切向
        const tangents = [];
        if (n.x === 0) tangents.push(new THREE.Vector3(1, 0, 0));
        if (n.y === 0) tangents.push(new THREE.Vector3(0, 1, 0));
        if (n.z === 0) tangents.push(new THREE.Vector3(0, 0, 1));

        const dragVec = new THREE.Vector2(dx, -dy).normalize();

        // 选屏幕投影方向与滑动最贴合的切向
        let best = null, bestScore = 0;
        for (const t of tangents) {
            const score = screenDir(d.point, t).dot(dragVec);
            if (Math.abs(score) > Math.abs(bestScore)) {
                bestScore = score;
                best = t.clone().multiplyScalar(Math.sign(score));
            }
        }
        if (!best) return;

        // 面上点速度 a × n 与 best 同向  =>  a = n × best
        const axisVec = new THREE.Vector3().crossVectors(n, best);

        let axis, dir;
        if (Math.abs(axisVec.x) > 0.5)      { axis = 'x'; dir = Math.sign(axisVec.x); }
        else if (Math.abs(axisVec.y) > 0.5) { axis = 'y'; dir = Math.sign(axisVec.y); }
        else                                { axis = 'z'; dir = Math.sign(axisVec.z); }

        const layer = clamp(
            Math.round(d.cubie.position[axis] / STEP), -MAX_LAYER, MAX_LAYER
        );

        startTimer();
        addStep();
        performMove(axis, layer, dir, { duration: TURN_DURATION });
    }

    /* ---------------- 15. 计时器 / 步数 ---------------- */
    let timeStart = 0;
    let timing = false;
    let moveCount = 0;
    let lastTimerText = '';

    const timerEl = $('timer');
    const stepsEl = $('steps');

    function startTimer() {
        if (timing) return;
        timing = true;
        timeStart = performance.now();
    }
    function stopTimer() {
        timing = false;
    }
    function resetTimerDisplay() {
        lastTimerText = '00:00';
        timerEl.innerText = lastTimerText;
    }
    function resetStats() {
        moveCount = 0;
        stepsEl.innerText = '0';
    }
    function addStep() {
        moveCount++;
        stepsEl.innerText = moveCount;
    }
    function fmt(ms) {
        const s = Math.floor(ms / 1000);
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    /* ---------------- 16. 顶部按钮 ---------------- */
    $('btn-scramble').addEventListener('click', runScramble);

    $('btn-reset-view').addEventListener('click', () => {
        resetView();
        toast('↺ 视角已还原');
    });

    $('btn-reset').addEventListener('click', () => {
        if (isBusy()) { toast('动画进行中，请稍候…'); return; }

        stopTimer();
        resetTimerDisplay();
        resetStats();
        resetView();
        cubeGroup.rotation.set(0, 0, 0);
        initCube();
        clearHistory();
        toast('↺ 已复原');
    });

    /* ---------------- 17. 主循环 ---------------- */
    function render(now) {
        requestAnimationFrame(render);

        if (timing) {
            const text = fmt(now - timeStart);
            if (text !== lastTimerText) {   // 仅在秒数变化时写 DOM
                lastTimerText = text;
                timerEl.innerText = text;
            }
        }

        renderer.render(scene, camera);
    }
    requestAnimationFrame(render);

    /* ---------------- 18. 启动初始化 ---------------- */
    updateHistoryUI();
    updateRecordUI();
    </script>
</body>
</html>
