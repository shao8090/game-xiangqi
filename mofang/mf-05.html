<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五阶魔方 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif
        }

        body {
            display: flex;
            flex-direction: column;
            background: radial-gradient(1200px 800px at 50% 15%, #2b3a67, #1a2238 60%, #10142a)
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%
        }

        [v-cloak] {
            display: none
        }

        #hud {
            display: grid;
            grid-template-columns: 1fr auto auto 1fr;
            grid-template-rows: auto auto;
            gap: 6px 8px;
            padding: 10px 12px;
            color: #fff;
            align-items: center
        }

        #hud.buttons-hidden,
        #footer.buttons-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(.96)
        }

        #hud,
        #footer {
            transition: opacity .28s ease, transform .28s ease;
            will-change: opacity, transform
        }

        #hud .r1c1 {
            grid-row: 1;
            grid-column: 1;
            justify-self: start
        }

        #hud .r1c2 {
            grid-row: 1;
            grid-column: 2;
            justify-self: center;
            white-space: nowrap
        }

        #hud .r1c3 {
            grid-row: 1;
            grid-column: 3;
            justify-self: center;
            white-space: nowrap
        }

        #hud .r1c4 {
            grid-row: 1;
            grid-column: 4;
            justify-self: end
        }

        #hud .r2c1 {
            grid-row: 2;
            grid-column: 1;
            justify-self: start
        }

        #hud .r2c2 {
            grid-row: 2;
            grid-column: 2;
            justify-self: center;
            white-space: nowrap
        }

        #hud .r2c3 {
            grid-row: 2;
            grid-column: 3;
            justify-self: center;
            white-space: nowrap
        }

        #hud .r2c4 {
            grid-row: 2;
            grid-column: 4;
            justify-self: end
        }

        #footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 12px;
            flex-wrap: wrap;
            color: #fff;
            background: #ddd;
            border-top: 1px solid rgba(255, 255, 255, .1)
        }

        .btn {
            border: none;
            cursor: pointer;
            color: #fff;
            font-size: 13px;
            padding: 7px 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f6df5, #7b3ff2);
            box-shadow: 0 4px 14px rgba(79, 109, 245, .4);
            transition: transform .1s, opacity .15s;
            white-space: nowrap
        }

        .btn:active {
            transform: scale(.94)
        }

        .btn.gray {
            background: linear-gradient(135deg, #3a4358, #2a3040);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .35)
        }

        .btn:disabled {
            opacity: .32;
            cursor: not-allowed;
            transform: none
        }

        .nav-btn {
            font-size: 15px;
            padding: 10px 22px;
            border-radius: 12px
        }

        .btn.rec.active {
            background: linear-gradient(135deg, #e11d48, #f43f5e);
            box-shadow: 0 4px 14px rgba(225, 29, 72, .5);
            animation: pulse 1.2s ease-in-out infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .6
            }
        }

        .stat {
            font-size: 12px;
            opacity: .85;
            margin-left: 4px;
            white-space: nowrap
        }

        .stat b {
            font-size: 14px;
            color: #7fe3ff
        }

        #wrap {
            flex: 1;
            position: relative;
            touch-action: none;
            min-height: 0
        }

        canvas {
            display: block
        }

        #wrap>canvas {
            width: 100% !important;
            height: 100% !important;
            display: block
        }

        #toast {
            position: fixed;
            left: 50%;
            top: 16%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .78);
            color: #fff;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
            z-index: 200;
            white-space: nowrap;
            max-width: 92vw;
            overflow: hidden;
            text-overflow: ellipsis
        }

        #toast.show {
            opacity: 1
        }

        #snapshot-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100
        }

        #snapshot-modal.show {
            display: flex
        }

        .modal-box {
            background: #1e2436;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 82vh;
            overflow-y: auto;
            color: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .5)
        }

        .modal-box h3 {
            margin: 0 0 14px;
            font-size: 18px
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #3a4358;
            border-radius: 10px;
            background: #10142a;
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px
        }

        .modal-box input:focus {
            border-color: #7b3ff2
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end
        }

        .snapshot-list {
            max-height: none;
            overflow-y: auto;
            margin-top: 4px
        }

        .snapshot-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #10142a;
            border-radius: 10px;
            margin-bottom: 8px
        }

        .snapshot-info {
            flex: 1;
            overflow: hidden;
            min-width: 0
        }

        .snapshot-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff
        }

        .snapshot-time {
            font-size: 11px;
            opacity: .5;
            margin-top: 2px;
            color: #fff
        }

        .snapshot-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0
        }

        .snapshot-actions button {
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            color: #fff;
            background: linear-gradient(135deg, #4f6df5, #7b3ff2)
        }

        .snapshot-actions button.del {
            background: linear-gradient(135deg, #c41e3a, #ff5800)
        }

        .snapshot-actions button.copy {
            background: linear-gradient(135deg, #16a34a, #22c55e)
        }

        .empty-tip {
            text-align: center;
            opacity: .5;
            padding: 18px 0;
            font-size: 13px
        }

        .formula-preview {
            background: #10142a;
            border: 1px solid #3a4358;
            border-radius: 10px;
            padding: 12px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 14px;
            color: #7fe3ff
        }

        .formula-mini {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 11px;
            color: #7fe3ff;
            opacity: .75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px
        }

        .tip-text {
            font-size: 11px;
            opacity: .45;
            line-height: 1.6;
            margin-bottom: 12px
        }

        #drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 150;
            display: none
        }

        #drawer-overlay.show {
            display: block
        }

        #drawer-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 340px;
            max-width: 88vw;
            background: #1e2436;
            z-index: 151;
            transform: translateX(100%);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 24px rgba(0, 0, 0, .4)
        }

        #drawer-panel.open {
            transform: translateX(0)
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid #3a4358;
            flex-shrink: 0
        }

        .drawer-header h3 {
            margin: 0;
            font-size: 17px;
            color: #fff
        }

        .drawer-close {
            border: none;
            background: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            line-height: 1
        }

        .drawer-close:hover {
            background: #3a4358;
            color: #fff
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px
        }

        .preset-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 6px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: #fff;
            margin-left: 6px;
            vertical-align: middle;
            font-weight: 500
        }

        .snapshot-item.is-preset {
            background: linear-gradient(135deg, #152036, #0f1728);
            border: 1px solid rgba(99, 102, 241, .35)
        }
    </style>

    <script src="./../js/three.min.js"></script>
    <script src="./../js/vue.min.js"></script>
</head>

<body>

    <div id="app" v-cloak>
        <div id="hud" :class="{ 'buttons-hidden': !buttonsVisible }">
            <button class="btn gray r1c1" :disabled="uiLocked" @click="openSnapshotList">📋 快照库</button>
            <button class="btn gray r1c2" :disabled="uiLocked" @click="openFormulaList">📜 公式库</button>
            <span class="stat r1c3">步数 <b>{{ stepCount }}</b></span>
            <button class="btn r1c4" :disabled="uiLocked" @click="onReset">↺ 复原</button>

            <button class="btn r2c1" :disabled="uiLocked" @click="openSnapshotSave">📸 存快照</button>
            <button class="btn rec r2c2" :class="{ active: recording }" :disabled="uiLocked" @click="toggleRecord">{{
                recordLabel }}</button>
            <span class="stat r2c3">时间 <b>{{ timerText }}</b></span>
            <button class="btn r2c4" :disabled="uiLocked" @click="onScramble">🔀 打乱</button>
        </div>

        <div id="wrap" ref="wrap"></div>

        <div id="footer" :class="{ 'buttons-hidden': !buttonsVisible }">
            <button class="btn gray nav-btn" :disabled="!canPrev" @click="onPrev">◀ 上一步</button>
            <button class="btn gray" @click="onResetView">↺ 视角</button>
            <button class="btn gray nav-btn" :disabled="!canNext" @click="onNext">下一步 ▶</button>
        </div>

        <div id="toast" :class="{ show: toastShow }">{{ toastMsg }}</div>

        <div id="drawer-overlay" :class="{ show: drawerOpen }" @click.self="closeDrawer"></div>
        <div id="drawer-panel" :class="{ open: drawerOpen }">
            <div class="drawer-header">
                <h3 v-if="drawerType === 'snapshots'">📋 快照库</h3>
                <h3 v-else-if="drawerType === 'formulas'">📜 步骤库</h3>
                <button class="drawer-close" @click="closeDrawer">✕</button>
            </div>
            <div class="drawer-content">
                <template v-if="drawerType === 'snapshots'">
                    <div class="snapshot-list">
                        <div v-if="!sortedSnapshots.length" class="empty-tip">暂无快照</div>
                        <div v-for="s in sortedSnapshots" :key="s.id" class="snapshot-item"
                            :class="{ 'is-preset': s.preset }">
                            <div class="snapshot-info">
                                <div class="snapshot-title">
                                    {{ s.title }}
                                    <span v-if="s.preset" class="preset-badge">预设</span>
                                </div>
                                <div class="snapshot-time">{{ s.time }}</div>
                            </div>
                            <div class="snapshot-actions">
                                <!-- <button class="copy" @click="copySnapshot(s.id)">复制</button> -->
                                <button @click="restoreSnapshot(s.id)">恢复</button>
                                <button v-if="!s.preset" class="del" @click="deleteSnapshot(s.id)">删除</button>
                            </div>
                        </div>
                    </div>
                </template>

                <template v-else-if="drawerType === 'formulas'">
                    <div class="snapshot-list">
                        <div v-if="!sortedFormulas.length" class="empty-tip">暂无公式，点击「⏺ 记录」开始录制</div>
                        <div v-for="f in sortedFormulas" :key="f.id" class="snapshot-item"
                            :class="{ 'is-preset': f.preset }">
                            <div class="snapshot-info">
                                <div class="snapshot-title">
                                    {{ f.title }}
                                    <span v-if="f.preset" class="preset-badge">预设</span>
                                </div>
                                <div class="formula-mini">{{ f.notation }}</div>
                                <div class="snapshot-time">{{ f.time }} · {{ f.moves.length }} 步</div>
                            </div>
                            <div class="snapshot-actions">
                                <button @click="playFormula(f.id)">恢复</button>
                                <button class="del" v-if="!f.preset" @click="deleteFormula(f.id)">删除</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div id="snapshot-modal" :class="{ show: modalType !== null }" @click.self="closeModal">
            <div class="modal-box">
                <template v-if="modalType === 'saveSnapshot'">
                    <h3>📸 保存快照</h3>
                    <input ref="snapInput" type="text" v-model="snapTitle" placeholder="输入快照标题..." maxlength="30"
                        @keydown.enter="doSaveSnapshot">
                    <div class="modal-actions">
                        <button class="btn gray" @click="closeModal">取消</button>
                        <button class="btn" @click="doSaveSnapshot">保存</button>
                    </div>
                </template>

                <template v-else-if="modalType === 'saveFormula'">
                    <h3>💾 保存公式</h3>
                    <div class="formula-preview">{{ formulaPreview }}</div>
                    <div class="tip-text">
                        记法：R/L/U/D/F/B 为最外层，2R/2L/2U/2D/2F/2B 为内层，3R/3U/3F 为中层。
                        ' 表示逆时针，2 表示 180°。共 {{ formulaStepCount }} 步。
                    </div>
                    <input ref="formulaInput" type="text" v-model="formulaTitle" placeholder="给公式起个名字…" maxlength="30"
                        @keydown.enter="doSaveFormula">
                    <div class="modal-actions">
                        <button class="btn gray" @click="closeModal">取消</button>
                        <button class="btn" @click="doSaveFormula">保存</button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
         * 1. 3D 五阶魔方引擎
         * ========================================================================= */
        function createCubeEngine(hooks) {
            hooks = hooks || {};

            /* ---------- 常量 ---------- */
            const SIZE = 5;
            const CUBE_SIZE = 1.0;
            const GAP = 0.04;
            const STEP = CUBE_SIZE + GAP;
            const OFFSET = (SIZE - 1) / 2; // 2.0 -> 坐标为 -2, -1, 0, 1, 2
            const ANIM_DURATION = 160;
            const NAV_DURATION = 140;
            const SCRAMBLE_DUR_SINGLE = 50;
            const SCRAMBLE_DUR_DOUBLE = 75;
            const VEC_POOL_MAX = 64;
            const TOTAL_CUBIES = SIZE * SIZE * SIZE; // 125

            /* ---------- 配色 ---------- */
            const COLORS = {
                R: 0x0051ba,   // 右：蓝
                L: 0xc41e3a,   // 左：红
                U: 0xffd500,   // 上：黄
                D: 0xffffff,   // 下：白
                F: 0x009e60,   // 前：绿
                B: 0xff5800,   // 后：橙
                INNER: 0x1a1a1a
            };
            const FACE_ORDER = ['R', 'L', 'U', 'D', 'F', 'B'];
            const COLOR_TO_NUM = {};
            const NUM_TO_COLOR = { 0: COLORS.INNER };
            FACE_ORDER.forEach((f, i) => {
                COLOR_TO_NUM[COLORS[f]] = i + 1;
                NUM_TO_COLOR[i + 1] = COLORS[f];
            });

            /* ---------- 场景 ---------- */
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
            dirLight.position.set(7, 12, 9);
            scene.add(dirLight);

            const cubeGroup = new THREE.Group();
            cubeGroup.position.y = 0.5;
            scene.add(cubeGroup);

            /* ---------- 共享材质池 ---------- */
            const materialMap = {};
            Object.keys(COLORS).forEach(k => {
                materialMap[COLORS[k]] = new THREE.MeshLambertMaterial({ color: COLORS[k] });
            });

            /* ---------- 几何体 ---------- */
            const boxGeom = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
            const AXIS_X = new THREE.Vector3(1, 0, 0);
            const AXIS_Y = new THREE.Vector3(0, 1, 0);
            const AXIS_Z = new THREE.Vector3(0, 0, 1);

            /* ---------- 临时对象复用 ---------- */
            const _tmpMatrix4 = new THREE.Matrix4();
            const _tmpQuat = new THREE.Quaternion();
            const _tmpWN = new THREE.Vector3();
            const _tmpVecA = new THREE.Vector3();
            const _tmpVecB = new THREE.Vector3();
            const _tmpVecC = new THREE.Vector3();

            /* ---------- 轻量向量池 ---------- */
            const _vecPool = [];
            function getVec(x, y, z) {
                const v = _vecPool.pop() || new THREE.Vector3();
                v.set(x || 0, y || 0, z || 0);
                return v;
            }
            function returnVec(v) {
                if (_vecPool.length < VEC_POOL_MAX) _vecPool.push(v);
            }

            /* ---------- 引擎状态 ---------- */
            let wrapEl = null;
            let dom = null;
            let cubies = [];
            let disposed = false;
            let resizeObserver = null;
            let lastW = 0, lastH = 0;

            /* ---------- 按需渲染 ---------- */
            let needRender = true;
            function markDirty() { needRender = true; }

            /* ---------- 相机轨道 ---------- */
            let RAD = 23;
            const RAD_MIN = 6.0, RAD_MAX = 28;
            let theta = 0.8, phi = 1.02;
            const DEF = { theta: 0.8, phi: 1.02, rad: 23 };

            function updCam() {
                camera.position.setFromSphericalCoords(RAD, phi, theta);
                camera.lookAt(0, 0, 0);
                markDirty();
            }

            function resize() {
                if (!wrapEl) return;
                const w = wrapEl.clientWidth, h = wrapEl.clientHeight;
                if (!w || !h) return;
                if (w === lastW && h === lastH) return;
                lastW = w; lastH = h;
                renderer.setSize(w, h, false);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                markDirty();
            }

            function resetView() {
                theta = DEF.theta; phi = DEF.phi; RAD = DEF.rad;
                updCam();
            }

            /* ---------- 索引 <-> 坐标 (SIZE = 5) ---------- */
            function idxToXYZ(i) {
                return {
                    x: Math.floor(i / 25),
                    y: Math.floor((i % 25) / 5),
                    z: i % 5
                };
            }

            /* ---------- 创建 mesh ---------- */
            function initCube() {
                while (cubeGroup.children.length) {
                    cubeGroup.remove(cubeGroup.children[0]);
                }
                cubies = [];
                for (let i = 0; i < TOTAL_CUBIES; i++) {
                    const materials = [
                        materialMap[COLORS.INNER], materialMap[COLORS.INNER],
                        materialMap[COLORS.INNER], materialMap[COLORS.INNER],
                        materialMap[COLORS.INNER], materialMap[COLORS.INNER]
                    ];
                    const mesh = new THREE.Mesh(boxGeom, materials);
                    cubeGroup.add(mesh);
                    cubies.push(mesh);
                }
                resetCubies();
            }

            /* ---------- 复位 cubies ---------- */
            function resetCubies() {
                for (let i = 0; i < TOTAL_CUBIES; i++) {
                    const { x, y, z } = idxToXYZ(i);
                    const c = cubies[i];
                    c.position.set(
                        (x - OFFSET) * STEP,
                        (y - OFFSET) * STEP,
                        (z - OFFSET) * STEP
                    );
                    c.quaternion.set(0, 0, 0, 1);
                    c.material[0] = materialMap[x === SIZE - 1 ? COLORS.R : COLORS.INNER];
                    c.material[1] = materialMap[x === 0 ? COLORS.L : COLORS.INNER];
                    c.material[2] = materialMap[y === SIZE - 1 ? COLORS.U : COLORS.INNER];
                    c.material[3] = materialMap[y === 0 ? COLORS.D : COLORS.INNER];
                    c.material[4] = materialMap[z === SIZE - 1 ? COLORS.F : COLORS.INNER];
                    c.material[5] = materialMap[z === 0 ? COLORS.B : COLORS.INNER];
                    c.updateMatrix();
                }
                markDirty();
            }

            /* ---------- 坐标吸附 (五阶层取值: -2, -1, 0, 1, 2) ---------- */
            function snapCoord(val) {
                const raw = val / STEP;
                let layer = Math.round(raw);
                layer = Math.max(-2, Math.min(2, layer));
                return layer * STEP;
            }

            function snapCubie(mesh) {
                mesh.position.x = snapCoord(mesh.position.x);
                mesh.position.y = snapCoord(mesh.position.y);
                mesh.position.z = snapCoord(mesh.position.z);

                mesh.updateMatrix();
                _tmpMatrix4.extractRotation(mesh.matrix);
                const m = _tmpMatrix4.elements;
                for (let i = 0; i < 16; i++) m[i] = Math.round(m[i]);
                mesh.quaternion.setFromRotationMatrix(_tmpMatrix4);
                mesh.updateMatrix();
            }

            /* ---------- 动画队列 ---------- */
            let pendingMoves = 0;
            let animChain = Promise.resolve();

            function busy() { return pendingMoves > 0; }

            function rotateSlice(axis, layerCoord, direction, duration) {
                duration = duration || ANIM_DURATION;
                pendingMoves++;
                const run = () => animateSlice(axis, layerCoord, direction, duration);
                const p = animChain.then(run, run);
                animChain = p.then(() => { }, () => { });
                return p.then(
                    v => { pendingMoves--; return v; },
                    e => { pendingMoves--; throw e; }
                );
            }

            function animateSlice(axis, layerCoord, direction, duration) {
                return new Promise((resolve) => {
                    const rotationGroup = new THREE.Group();
                    cubeGroup.add(rotationGroup);

                    const targetLayerPos = layerCoord * STEP;
                    const activeCubies = cubies.filter(
                        c => Math.abs(c.position[axis] - targetLayerPos) < STEP / 2
                    );
                    activeCubies.forEach(c => rotationGroup.attach(c));

                    const targetAngle = (Math.PI / 2) * direction;
                    const startTime = performance.now();

                    function step(time) {
                        if (disposed) { resolve(); return; }

                        const elapsed = time - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const ease = 1 - Math.pow(1 - progress, 3);

                        rotationGroup.rotation[axis] = targetAngle * ease;
                        markDirty();

                        if (progress < 1) {
                            requestAnimationFrame(step);
                        } else {
                            rotationGroup.rotation[axis] = targetAngle;
                            rotationGroup.updateMatrixWorld();
                            activeCubies.forEach(c => {
                                cubeGroup.attach(c);
                                snapCubie(c);
                            });
                            cubeGroup.remove(rotationGroup);
                            markDirty();
                            resolve();
                        }
                    }
                    requestAnimationFrame(step);
                });
            }

            /* ---------- 历史记录 ---------- */
            let moveHistory = [];
            let historyIndex = 0;

            function notifyNav() {
                if (hooks.onNav) hooks.onNav(historyIndex, moveHistory.length);
            }

            function pushHistory(step) {
                moveHistory.length = historyIndex;
                moveHistory.push(step);
                historyIndex++;
                notifyNav();
            }

            function clearHistory() {
                moveHistory = [];
                historyIndex = 0;
                notifyNav();
            }

            function setHistory(moves) {
                moveHistory = moves.map(m => ({ axis: m.axis, layer: m.layer, dir: m.dir }));
                historyIndex = 0;
                notifyNav();
            }

            function goPrev() {
                if (historyIndex <= 0 || busy()) return;
                historyIndex--;
                const s = moveHistory[historyIndex];
                rotateSlice(s.axis, s.layer, -s.dir, NAV_DURATION).then(notifyNav);
                notifyNav();
            }

            function goNext() {
                if (historyIndex >= moveHistory.length || busy()) return;
                const s = moveHistory[historyIndex];
                historyIndex++;
                rotateSlice(s.axis, s.layer, s.dir, NAV_DURATION).then(notifyNav);
                notifyNav();
            }

            /* ---------- 打乱 ---------- */
            function generateScrambleSequence(length) {
                length = length || 30;
                const axes = ['x', 'y', 'z'];
                const coords = [-2, -1, 1, 2]; // 打乱主要在非中心层
                const dirs = [1, -1, 2];
                const seq = [];
                let lastAxis = '', lastLayer = null;

                for (let i = 0; i < length; i++) {
                    let axis, layer, dir;
                    do {
                        axis = axes[(Math.random() * 3) | 0];
                        layer = coords[(Math.random() * coords.length) | 0];
                        dir = dirs[(Math.random() * 3) | 0];
                    } while (axis === lastAxis && layer === lastLayer);

                    seq.push({ axis, layer, dir });
                    lastAxis = axis;
                    lastLayer = layer;
                }
                return seq;
            }

            async function runScramble(length) {
                const seq = generateScrambleSequence(length);
                for (const step of seq) {
                    const duration = Math.abs(step.dir) === 2 ? SCRAMBLE_DUR_DOUBLE : SCRAMBLE_DUR_SINGLE;
                    pushHistory(step);
                    await rotateSlice(step.axis, step.layer, step.dir, duration);
                }
            }

            /* ---------- 快照：位姿 ---------- */
            function captureState() {
                return cubies.map(c => ({
                    pos: { x: c.position.x, y: c.position.y, z: c.position.z },
                    quat: { x: c.quaternion.x, y: c.quaternion.y, z: c.quaternion.z, w: c.quaternion.w }
                }));
            }

            /* ---------- 快照：面片网格（6面 × 5×5） ----------
             * 修复点：只有"确实位于该表面"的小块才允许写入对应面的网格。
             * 原实现遍历全部 125 块，内部块旋转后法线可能指向 ±x/±y/±z，
             * 会把颜色写进 L/D/B 等面，导致快照恢复后颜色错乱。
             */
            function captureFaceGrid() {
                const faces = [];
                for (let f = 0; f < 6; f++) {
                    faces.push(Array(SIZE).fill(null).map(() => Array(SIZE).fill(0)));
                }

                for (const cubie of cubies) {
                    const px = Math.round(cubie.position.x / STEP + OFFSET);
                    const py = Math.round(cubie.position.y / STEP + OFFSET);
                    const pz = Math.round(cubie.position.z / STEP + OFFSET);

                    for (let lf = 0; lf < 6; lf++) {
                        _tmpWN.set(0, 0, 0);
                        if (lf === 0) _tmpWN.set(1, 0, 0);
                        else if (lf === 1) _tmpWN.set(-1, 0, 0);
                        else if (lf === 2) _tmpWN.set(0, 1, 0);
                        else if (lf === 3) _tmpWN.set(0, -1, 0);
                        else if (lf === 4) _tmpWN.set(0, 0, 1);
                        else _tmpWN.set(0, 0, -1);
                        _tmpWN.applyQuaternion(cubie.quaternion);

                        let gf = -1, r = 0, c = 0;
                        if (Math.abs(_tmpWN.x - 1) < 0.5) {
                            if (px !== SIZE - 1) continue;
                            gf = 0; r = py; c = pz;
                        } else if (Math.abs(_tmpWN.x + 1) < 0.5) {
                            if (px !== 0) continue;
                            gf = 1; r = py; c = pz;
                        } else if (Math.abs(_tmpWN.y - 1) < 0.5) {
                            if (py !== SIZE - 1) continue;
                            gf = 2; r = px; c = pz;
                        } else if (Math.abs(_tmpWN.y + 1) < 0.5) {
                            if (py !== 0) continue;
                            gf = 3; r = px; c = pz;
                        } else if (Math.abs(_tmpWN.z - 1) < 0.5) {
                            if (pz !== SIZE - 1) continue;
                            gf = 4; r = px; c = py;
                        } else if (Math.abs(_tmpWN.z + 1) < 0.5) {
                            if (pz !== 0) continue;
                            gf = 5; r = px; c = py;
                        } else {
                            continue;
                        }

                        const mat = cubie.material[lf];
                        const hex = (mat && mat.color) ? mat.color.getHex() : COLORS.INNER;
                        faces[gf][r][c] = COLOR_TO_NUM[hex] || 0;
                    }
                }
                return faces;
            }

            /* ---------- 恢复：面片网格 ---------- */
            function colorOf(v) {
                // 兜底：非法值（0 / undefined / 越界）回落到内部色，避免材质变 undefined
                return NUM_TO_COLOR[v] || COLORS.INNER;
            }

            function restoreFromFaceGridInternal(grid) {
                for (let i = 0; i < cubies.length; i++) {
                    const { x, y, z } = idxToXYZ(i);
                    const c = cubies[i];

                    c.position.set(
                        (x - OFFSET) * STEP,
                        (y - OFFSET) * STEP,
                        (z - OFFSET) * STEP
                    );
                    c.quaternion.set(0, 0, 0, 1);

                    c.material[0] = materialMap[x === SIZE - 1 ? colorOf(grid[0][y][z]) : COLORS.INNER];
                    c.material[1] = materialMap[x === 0 ? colorOf(grid[1][y][z]) : COLORS.INNER];
                    c.material[2] = materialMap[y === SIZE - 1 ? colorOf(grid[2][x][z]) : COLORS.INNER];
                    c.material[3] = materialMap[y === 0 ? colorOf(grid[3][x][z]) : COLORS.INNER];
                    c.material[4] = materialMap[z === SIZE - 1 ? colorOf(grid[4][x][y]) : COLORS.INNER];
                    c.material[5] = materialMap[z === 0 ? colorOf(grid[5][x][y]) : COLORS.INNER];

                    c.updateMatrix();
                }
                markDirty();

                moveHistory = [];
                historyIndex = 0;
                notifyNav();
                return true;
            }

            function isValidFaceGrid(grid) {
                if (!Array.isArray(grid) || grid.length !== 6) return false;
                for (let f = 0; f < 6; f++) {
                    const face = grid[f];
                    if (!Array.isArray(face) || face.length !== SIZE) return false;
                    for (let r = 0; r < SIZE; r++) {
                        const row = face[r];
                        if (!Array.isArray(row) || row.length !== SIZE) return false;
                    }
                }
                return true;
            }

            function restoreFromFaceGrid(grid) {
                if (isValidFaceGrid(grid)) {
                    return restoreFromFaceGridInternal(grid);
                }
                return restoreState(grid);
            }

            /* ---------- 恢复：位姿 ---------- */
            function restoreState(state) {
                if (!state || state.length !== cubies.length) return false;
                state.forEach((s, i) => {
                    const c = cubies[i];
                    c.position.set(s.pos.x, s.pos.y, s.pos.z);
                    c.quaternion.set(s.quat.x, s.quat.y, s.quat.z, s.quat.w);
                    snapCubie(c);

                markDirty();
                return true;

            /* ---------- 交互控制 ---------- */
            const raycaster = new THREE.Raycaster();
            const ndc = new THREE.Vector2();
            const activePointers = new Set();
            let drag = null;
            let pinchDist0 = 0, pinchRad0 = RAD;

            let downTime = 0, downX = 0, downY = 0, tapMoved = false;
            let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

            function onPointerDown(e) {
                activePointers.add(e.pointerId);
                if (activePointers.size > 1) { drag = null; return; }

                e.preventDefault();
                try { dom.setPointerCapture(e.pointerId); } catch (_) { }

                downTime = performance.now();
                downX = e.clientX; downY = e.clientY;
                tapMoved = false;

                const rect = dom.getBoundingClientRect();
                ndc.set(
                    ((e.clientX - rect.left) / rect.width) * 2 - 1,
                    -((e.clientY - rect.top) / rect.height) * 2 + 1
                );
                raycaster.setFromCamera(ndc, camera);
                const hits = raycaster.intersectObjects(cubies, false);

                if (hits.length && !busy()) {
                    const h = hits[0];
                    const localN = (h.face && h.face.normal) ? h.face.normal.clone() : new THREE.Vector3(0, 0, 1);
                    const n = localN.applyQuaternion(h.object.quaternion).round();

                    drag = {
                        type: 'layer', cubie: h.object, n,
                        point: h.point.clone(),
                        sx: e.clientX, sy: e.clientY, done: false
                    };
                } else {
                    drag = { type: 'view', sx: e.clientX, sy: e.clientY };
                }
            }

            function onPointerMove(e) {
                if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) tapMoved = true;

                if (!drag) return;
                const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;

                if (drag.type === 'view') {
                    theta -= dx * 0.008;
                    phi -= dy * 0.008;
                    phi = clamp(phi, 0.15, Math.PI - 0.15);
                    drag.sx = e.clientX; drag.sy = e.clientY;
                    updCam();
                } else if (!drag.done && Math.hypot(dx, dy) > 14) {
                    drag.done = true;
                    handleCubeDrag(drag, dx, dy);
                    drag = null;
                }
            }

            function onPointerUp(e) {
                activePointers.delete(e.pointerId);

                if (drag && e && e.type === 'pointerup' && !tapMoved &&
                    performance.now() - downTime < 350) {
                    const now = performance.now();
                    if (now - lastTapTime < 320 &&
                        Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40) {
                        lastTapTime = 0;
                        if (hooks.onDoubleTap) hooks.onDoubleTap();
                    } else {
                        lastTapTime = now;
                        lastTapX = e.clientX;
                        lastTapY = e.clientY;
                    }
                }

            }

            function onTouchStart(e) {
                if (e.touches.length === 2) {
                    drag = null;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    pinchDist0 = Math.hypot(dx, dy);
                    pinchRad0 = RAD;
                }
            }

            function onTouchMove(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    if (pinchDist0 > 0) {
                        RAD = clamp(pinchRad0 * (pinchDist0 / dist), RAD_MIN, RAD_MAX);
                        updCam();
                    }
                }
            }

            function onTouchEnd() { pinchDist0 = 0; }

            function onWheel(e) {
                e.preventDefault();
                RAD = clamp(RAD * (1 + e.deltaY * 0.001), RAD_MIN, RAD_MAX);
                updCam();
            }

            function scrDirInto(p, v, out) {
                _tmpVecA.set(p.x, p.y, p.z).project(camera);
                _tmpVecB.set(p.x + v.x, p.y + v.y, p.z + v.z).project(camera);
                out.set(_tmpVecB.x - _tmpVecA.x, _tmpVecB.y - _tmpVecA.y, 0).normalize();
                return out;
            }

            function handleCubeDrag(d, dx, dy) {
                const n = d.n;
                const ts = [];
                if (n.x === 0) ts.push(AXIS_X);
                if (n.y === 0) ts.push(AXIS_Y);
                if (n.z === 0) ts.push(AXIS_Z);

                _tmpVecC.set(dx, -dy, 0).normalize();
                const dragV = _tmpVecC;

                let best = null, bs = 0;
                for (const t of ts) {
                    const sd = scrDirInto(d.point, t, _tmpVecA);
                    const s = sd.dot(dragV);
                    if (Math.abs(s) > Math.abs(bs)) {
                        bs = s;
                        if (!best) best = new THREE.Vector3();
                        best.set(t.x * Math.sign(s), t.y * Math.sign(s), t.z * Math.sign(s));
                    }
                }
                if (!best) return;

                const axisVec = new THREE.Vector3().crossVectors(n, best);

                let comp, dir;
                if (Math.abs(axisVec.x) > 0.5) { comp = 'x'; dir = Math.sign(axisVec.x); }
                else if (Math.abs(axisVec.y) > 0.5) { comp = 'y'; dir = Math.sign(axisVec.y); }
                else { comp = 'z'; dir = Math.sign(axisVec.z); }

                const rawLayer = d.cubie.position[comp] / STEP;
                let layerCoord = Math.round(rawLayer);
                layerCoord = Math.max(-2, Math.min(2, layerCoord));

                const step = { axis: comp, layer: layerCoord, dir };
                pushHistory(step);
                if (hooks.onUserMove) hooks.onUserMove(step);
                rotateSlice(comp, layerCoord, dir);
            }

            let ctxLostHandler, ctxRestoredHandler;

            function bindEvents() {
                dom.addEventListener('pointerdown', onPointerDown);
                dom.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);
                dom.addEventListener('touchstart', onTouchStart, { passive: false });
                dom.addEventListener('touchmove', onTouchMove, { passive: false });
                dom.addEventListener('touchend', onTouchEnd);
                dom.addEventListener('wheel', onWheel, { passive: false });
                window.addEventListener('resize', resize);
                window.addEventListener('orientationchange', resize);

                ctxLostHandler = (e) => { e.preventDefault(); console.warn('[cube] WebGL context lost'); };
                ctxRestoredHandler = () => { markDirty(); };
                dom.addEventListener('webglcontextlost', ctxLostHandler);
                dom.addEventListener('webglcontextrestored', ctxRestoredHandler);
            }

            function unbindEvents() {
                if (dom) {
                    dom.removeEventListener('pointerdown', onPointerDown);
                    dom.removeEventListener('pointermove', onPointerMove);
                    dom.removeEventListener('touchstart', onTouchStart);
                    dom.removeEventListener('touchmove', onTouchMove);
                    dom.removeEventListener('touchend', onTouchEnd);
                    dom.removeEventListener('wheel', onWheel);
                    dom.removeEventListener('webglcontextlost', ctxLostHandler);
                    dom.removeEventListener('webglcontextrestored', ctxRestoredHandler);
                }
                window.removeEventListener('pointerup', onPointerUp);
                window.removeEventListener('pointercancel', onPointerUp);
                window.removeEventListener('resize', resize);
                window.removeEventListener('orientationchange', resize);
            }

            let rafId = 0;
            function loop(now) {
                if (disposed) return;
                rafId = requestAnimationFrame(loop);
                if (hooks.onFrame) hooks.onFrame(now);
                if (needRender) {
                    renderer.render(scene, camera);
                    needRender = false;
                }
            }

            function mount(el) {
                wrapEl = el;
                dom = renderer.domElement;
                wrapEl.appendChild(dom);
                resize();
                updCam();
                initCube();
                bindEvents();

                if (typeof ResizeObserver !== 'undefined') {
                    resizeObserver = new ResizeObserver(() => resize());
                    resizeObserver.observe(wrapEl);
                }

                notifyNav();
                rafId = requestAnimationFrame(loop);
            }

            function destroy() {
                if (disposed) return;
                disposed = true;
                cancelAnimationFrame(rafId);
                unbindEvents();

                if (resizeObserver) { resizeObserver.disconnect(); resizeObserver = null; }

                while (cubeGroup.children.length) cubeGroup.remove(cubeGroup.children[0]);
                boxGeom.dispose();
                Object.values(materialMap).forEach(m => m.dispose());

                if (dom && dom.parentNode) dom.parentNode.removeChild(dom);
                renderer.dispose();

                _vecPool.length = 0;
                cubies = [];
                moveHistory = [];
            }

            function resetAll(keepView) {
                clearHistory();
                if (!keepView) resetView();
                cubeGroup.rotation.set(0, 0, 0);
                resetCubies();
            }

            return {
                mount, destroy, busy,
                rotateSlice, runScramble,
                goPrev, goNext, clearHistory, setHistory,
                captureState, captureFaceGrid, restoreState, restoreFromFaceGrid,
                resetAll, resetView, resize,
                get historyIndex() { return historyIndex; },
                get historyLength() { return moveHistory.length; }
            };
        }

        /* =========================================================================
         * 2. 记法解析 & 五阶预设
         * ========================================================================= */
        function notationToMoves(notation) {
            const tokens = String(notation || '').trim().split(/\s+/);
            const moves = [];
            for (const raw of tokens) {
                if (!raw) continue;
                let s = raw;
                let layerPrefix = 1;
                if (s.length > 1 && (s[0] === '2' || s[0] === '3') && /[RLUDFB]/.test(s[1])) {
                    layerPrefix = parseInt(s[0], 10);
                    s = s.slice(1);
                }
                const face = s[0];
                const suffix = s.slice(1);

                let axis, base, cw;
                if (face === 'R') { axis = 'x'; base = 2; cw = -1; }
                else if (face === 'L') { axis = 'x'; base = -2; cw = 1; }
                else if (face === 'U') { axis = 'y'; base = 2; cw = -1; }
                else if (face === 'D') { axis = 'y'; base = -2; cw = 1; }
                else if (face === 'F') { axis = 'z'; base = 2; cw = -1; }
                else if (face === 'B') { axis = 'z'; base = -2; cw = 1; }
                else continue;

                let layer = base;
                if (layerPrefix === 2) {
                    layer = base - Math.sign(base); // ±1
                } else if (layerPrefix === 3) {
                    layer = 0;                      // 0
                }

                let dir;
                if (suffix === '2') dir = 2;
                else if (suffix === "'") dir = -cw;
                else dir = cw;

                moves.push({ axis, layer, dir });
            }
            return moves;
        }

        // 预设快照 1: 单棱翻转 (中间棱块对换/单翻)

        const DEFAULT_SNAPSHOT_ID = 'preset03';

                    timerText: '00:00',
                    stepCount: 0,
                    recording: false,
                    recordedMoves: [],
                    uiLocked: false,
                    buttonsVisible: true,
                    navIndex: 0,
                    navLen: 0,
                    toastMsg: '',
                    toastShow: false,
                    modalType: null,
                    drawerOpen: false,
                    drawerType: null,
                    snapTitle: '',
                    formulaTitle: '',
                    formulaPreview: '',
                    formulaStepCount: 0,
                    snapshots: [],
                    formulas: []
                };
            },

            computed: {
                canPrev() { return this.navIndex > 0; },
                canNext() { return this.navIndex < this.navLen; },
                recordLabel() {
                    return this.recording ? '结束(' + this.recordedMoves.length + ')' : '记录';
                },
                sortedSnapshots() {
                    return [...PRESET_SNAPSHOTS, ...this.snapshots];
                },
                sortedFormulas() {
                    return [...PRESET_FORMULAS, ...this.formulas];
                }
            },

            created() {
                this.snapshots = this.readStorage(SNAPSHOT_KEY, []).filter(s => !s.preset);
                this.formulas = this.readStorage(FORMULA_KEY, []).filter(f => !f.preset);

                this._timing = false;
                this._timeStart = 0;
                this._recordStartState = null;
                this._recordStartGrid = null;
                this._toastTimer = null;
                this.engine = null;
            },

            mounted() {
                this.engine = createCubeEngine({
                    onNav: (idx, len) => { this.navIndex = idx; this.navLen = len; },
                    onUserMove: (step) => {
                        if (this.recording) this.recordedMoves.push(step);
                        this.startTimer();
                        this.stepCount++;
                    },
                    onDoubleTap: () => this.toggleButtons(),
                    onFrame: (now) => {
                        this.tickTimer(now);
                    }
                });
                this.$nextTick(() => {
                    this.engine.mount(this.$refs.wrap);
                    this.loadDefaultSnapshot();
                });
                window.addEventListener('keydown', this.onKeyDown);
            },

            beforeDestroy() {
                if (this.engine) this.engine.destroy();
                clearTimeout(this._toastTimer);
                window.removeEventListener('keydown', this.onKeyDown);
            },

            methods: {
                readStorage(key, fallback) {
                    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
                    catch (e) { return fallback; }
                },
                writeStorage(key, value) {
                    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { }
                },
                toast(msg) {
                    this.toastMsg = msg;
                    this.toastShow = true;
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toastShow = false; }, 2400);
                },
                busyGuard() {
                    if (this.engine && this.engine.busy()) {
                        this.toast('动画进行中,请稍候...');
                        return true;
                    }
                    return false;
                },
                startTimer() {
                    if (this._timing) return;
                    this._timing = true;
                    this._timeStart = performance.now();
                },
                stopTimer() { this._timing = false; },
                tickTimer(now) {
                    if (!this._timing) return;
                    const t = this.fmt(now - this._timeStart);
                    if (t !== this.timerText) this.timerText = t;
                },
                fmt(ms) {
                    const s = Math.floor(ms / 1000);
                    return String(Math.floor(s / 60)).padStart(2, '0') + ':' +
                        String(s % 60).padStart(2, '0');
                },
                resetStats() { this.stepCount = 0; this.timerText = '00:00'; },

                onKeyDown(e) {
                    if (e.target.tagName === 'INPUT') return;
                    switch (e.key) {
                        case 'ArrowLeft': case 'z': e.preventDefault(); this.onPrev(); break;
                        case 'ArrowRight': case 'x': e.preventDefault(); this.onNext(); break;
                        case 'r': e.preventDefault(); this.onReset(); break;
                        case 's': e.preventDefault(); this.onScramble(); break;
                        case 'v': e.preventDefault(); this.onResetView(); break;
                        case ' ': e.preventDefault(); this.toggleRecord(); break;
                        case 'Escape': this.closeModal(); break;
                    }
                },

                loadDefaultSnapshot() {
                    if (!this.engine || !DEFAULT_SNAPSHOT_ID) return;
                    const snap = this.sortedSnapshots.find(s => s.id === DEFAULT_SNAPSHOT_ID);
                    if (!snap || !snap.cube) return;
                    try {
                        if (this.engine.restoreFromFaceGrid(snap.cube)) {
                            this.stopTimer();
                            this.resetStats();
                        }
                    } catch (e) {
                        console.error('默认快照加载失败:', e);
                    }
                },

                onReset() {
                    if (this.busyGuard()) return;
                    if (this.recording) this.abortRecording();
                    this.stopTimer();
                    this.resetStats();
                    this.engine.resetAll();
                    this.toast('已复原');
                },
                async onScramble() {
                    if (this.engine.busy()) return;
                    if (this.recording) this.abortRecording();
                    this.uiLocked = true;
                    this.stopTimer();
                    this.resetStats();
                    this.toast('正在打乱...');
                    try {
                        await this.engine.runScramble(28);
                        this.toast('打乱完成!');
                    } catch (e) {
                        this.toast('打乱过程中出错');
                        console.error('Scramble error:', e);
                    } finally {
                        this.uiLocked = false;
                    }
                },
                onResetView() { this.engine.resetView(); this.toast('视角已还原'); },

                toggleButtons() {
                    this.buttonsVisible = !this.buttonsVisible;
                    if (!this.buttonsVisible) {
                        this.toast('按钮已隐藏，再次双击空白处可恢复');
                    }
                },

                onPrev() { this.engine.goPrev(); },
                onNext() { this.engine.goNext(); },

                abortRecording() {
                    this.recording = false;
                    this.recordedMoves = [];
                    this._recordStartState = null;
                    this._recordStartGrid = null;
                },

                toggleRecord() {
                    if (this.busyGuard()) return;
                    if (!this.recording) {
                        this.recording = true;
                        this.recordedMoves = [];
                        this._recordStartState = this.engine.captureState();
                        this._recordStartGrid = this.engine.captureFaceGrid();
                        this.toast('开始记录步骤,转动魔方吧');
                        return;
                    }
                    this.recording = false;
                    if (this.recordedMoves.length === 0) {
                        this.abortRecording();
                        this.toast('未记录到任何步骤');
                        return;
                    }
                    this.openFormulaSave();
                },

                stepToNotation(axis, layer, dir) {
                    let face, cw;
                    if (axis === 'x') {
                        if (layer >= 0) { face = 'R'; cw = -1; } else { face = 'L'; cw = 1; }
                    } else if (axis === 'y') {
                        if (layer >= 0) { face = 'U'; cw = -1; } else { face = 'D'; cw = 1; }
                    } else {
                        if (layer >= 0) { face = 'F'; cw = -1; } else { face = 'B'; cw = 1; }
                    }

                    let prefix = '';
                    const absL = Math.abs(layer);
                    if (absL === 1) prefix = '2';
                    else if (absL === 0) prefix = '3';

                    const name = prefix + face;
                    if (Math.abs(dir) === 2) return name + '2';
                    return dir === cw ? name : name + "'";
                },
                movesToNotation(moves) {
                    return moves.map(m => this.stepToNotation(m.axis, m.layer, m.dir)).join(' ');
                },

                openModal(type) { this.modalType = type; },
                closeModal() { this.modalType = null; },
                closeDrawer() { this.drawerOpen = false; this.drawerType = null; },

                openSnapshotSave() {
                    if (this.busyGuard()) return;
                    this.snapTitle = '';
                    this.openModal('saveSnapshot');
                    this.$nextTick(() => {
                        const el = this.$refs.snapInput;
                        if (el) el.focus();
                    });
                },
                doSaveSnapshot() {
                    const title = this.snapTitle.trim();
                    this.saveSnapshot(title);
                    this.closeModal();
                },
                saveSnapshot(title) {
                    const snap = {
                        id: Date.now(),
                        title: title || '快照 ' + (this.snapshots.length + 1),
                        time: new Date().toLocaleString('zh-CN'),
                        cube: this.engine.captureFaceGrid()
                    };
                    this.snapshots.unshift(snap);
                    this.writeStorage(SNAPSHOT_KEY, this.snapshots);
                    this.toast('已保存"' + snap.title + '"');
                },
                openSnapshotList() { this.drawerType = 'snapshots'; this.drawerOpen = true; },

                restoreSnapshot(id) {
                    const snap = this.sortedSnapshots.find(s => s.id === id);
                    if (!snap) return;
                    if (this.busyGuard()) return;
                    try {
                        if (snap.cube && snap.cube.length === 6) {
                            if (this.engine.restoreFromFaceGrid(snap.cube)) {
                                this.stopTimer();
                                this.resetStats();
                                this.toast('已恢复"' + snap.title + '"');
                                this.closeDrawer();
                            } else {
                                this.toast('快照数据不兼容');
                            }
                        } else {
                            this.toast('快照数据格式错误');
                        }
                    } catch (e) {
                        this.toast('恢复快照时出错');
                        console.error('Restore snapshot error:', e);
                    }
                },

                copySnapshot(id) {
                    const snap = this.sortedSnapshots.find(s => s.id === id);
                    if (!snap || !snap.cube) { this.toast('快照数据无效'); return; }
                    const copy = {
                        id: Date.now(),
                        title: snap.title + ' 副本',
                        time: new Date().toLocaleString('zh-CN'),
                        cube: snap.cube.map(row => row.slice())
                    };
                    this.snapshots.unshift(copy);
                    this.writeStorage(SNAPSHOT_KEY, this.snapshots);
                    this.toast('已复制为"' + copy.title + '"');
                },

                deleteSnapshot(id) {
                    const target = this.sortedSnapshots.find(s => s.id === id);
                    if (target && target.preset) { this.toast('预设快照不可删除'); return; }
                    this.snapshots = this.snapshots.filter(s => s.id !== id);
                    this.writeStorage(SNAPSHOT_KEY, this.snapshots);
                    this.toast('已删除快照');
                },

                openFormulaSave() {
                    this.formulaPreview = this.movesToNotation(this.recordedMoves);
                    this.formulaStepCount = this.recordedMoves.length;
                    this.formulaTitle = '';
                    this.openModal('saveFormula');
                    this.$nextTick(() => {
                        const el = this.$refs.formulaInput;
                        if (el) el.focus();
                    });
                },
                doSaveFormula() {
                    const title = this.formulaTitle.trim() || '公式 ' + (this.formulas.length + 1);
                    const formula = {
                        id: Date.now(),
                        title,
                        time: new Date().toLocaleString('zh-CN'),
                        notation: this.movesToNotation(this.recordedMoves),
                        moves: this.recordedMoves.map(m => ({ axis: m.axis, layer: m.layer, dir: m.dir })),
                        startState: this._recordStartState || null,
                        cube: this._recordStartGrid || null
                    };
                    this.formulas.unshift(formula);
                    this.writeStorage(FORMULA_KEY, this.formulas);
                    this.abortRecording();
                    this.closeModal();
                    this.toast('已保存公式「' + title + '」');
                },
                openFormulaList() { this.drawerType = 'formulas'; this.drawerOpen = true; },

                deleteFormula(id) {
                    const target = this.sortedFormulas.find(f => f.id === id);
                    if (target && target.preset) { this.toast('预设公式不可删除'); return; }
                    this.formulas = this.formulas.filter(f => f.id !== id);
                    this.writeStorage(FORMULA_KEY, this.formulas);
                    this.toast('已删除公式');
                },

                playFormula(id) {
                    const f = this.sortedFormulas.find(x => x.id === id);
                    if (!f) return;
                    if (this.busyGuard()) return;
                    this.closeDrawer();

                    let msg = '';
                    try {
                        if (f.startState && this.engine.restoreState(f.startState)) {
                            msg = '已还原到录制「' + f.title + '」时的初始状态';
                        } else if (f.cube && this.engine.restoreFromFaceGrid(f.cube)) {
                            msg = '已恢复到「' + f.title + '」的起始快照，可用「下一步 ▶」逐步演示';
                        } else {
                            this.engine.resetAll(true);
                            msg = '已恢复到初始快照，可用「下一步 ▶」逐步演示「' + f.title + '」';
                        }
                    } catch (e) {
                        console.error('Play formula error:', e);
                        this.toast('播放公式时出错');
                        return;
                    }

                    this.stopTimer();
                    this.resetStats();
                    this.engine.setHistory(f.moves);
                    this.toast(msg);
                }
            }
        });
    </script>
</body>

</html>
