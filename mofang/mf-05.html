<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五阶魔方 3D</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
        html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
        body{display:flex;flex-direction:column;background:radial-gradient(1200px 800px at 50% 15%,#2b3a67,#1a2238 60%,#10142a)}
        #topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;color:#fff;gap:8px}
        #topbar .stat{font-size:12px;opacity:.85}
        #topbar .stat b{font-size:14px;color:#7fe3ff}
        #footer{    background: #ddd;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;color:#fff;border-top:1px solid rgba(255,255,255,.1)}
        .btn{border:none;cursor:pointer;color:#fff;font-size:13px;padding:7px 14px;border-radius:10px;background:linear-gradient(135deg,#4f6df5,#7b3ff2);box-shadow:0 4px 14px rgba(79,109,245,.4);transition:transform .1s;white-space:nowrap}
        .btn:active{transform:scale(.94)}
        .btn.gray{background:linear-gradient(135deg,#3a4358,#2a3040);box-shadow:0 4px 14px rgba(0,0,0,.35)}
        .btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
        .btn:disabled:active{transform:none}
        .btn.recording{background:linear-gradient(135deg,#e63946,#ff5800);box-shadow:0 4px 14px rgba(230,57,70,.5);animation:pulse 1.2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
        .stat{font-size:12px;opacity:.85;margin-left:4px}
        .stat b{font-size:14px;color:#7fe3ff}
        #wrap{flex:1;position:relative;touch-action:none}
        canvas{display:block}
        #hint{position:fixed;bottom:12px;width:100%;text-align:center;font-size:12px;color:#fff;opacity:.55;pointer-events:none}
        #toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:12px 24px;border-radius:14px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;white-space:nowrap}
        #toast.show{opacity:1}
        #snapshot-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
        #snapshot-modal.show{display:flex}
        .modal-box{background:#1e2436;border-radius:16px;padding:24px;width:90%;max-width:380px;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
        .modal-box h3{margin:0 0 16px;font-size:18px}
        .modal-box input{width:100%;padding:12px;border:1px solid #3a4358;border-radius:10px;background:#10142a;color:#fff;font-size:15px;outline:none;margin-bottom:16px}
        .modal-box input:focus{border-color:#7b3ff2}
        .modal-actions{display:flex;gap:10px;justify-content:flex-end}
        .snapshot-list{max-height:300px;overflow-y:auto;margin-top:8px}
        .snapshot-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#10142a;border-radius:10px;margin-bottom:8px}
        .snapshot-info{flex:1;overflow:hidden}
        .snapshot-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .snapshot-time{font-size:12px;opacity:.5;margin-top:2px}
        .snapshot-actions{display:flex;gap:6px}
        .snapshot-actions button{border:none;cursor:pointer;font-size:12px;padding:6px 10px;border-radius:8px;color:#fff;background:linear-gradient(135deg,#4f6df5,#7b3ff2)}
        .snapshot-actions button.del{background:linear-gradient(135deg,#c41e3a,#ff5800)}
        .empty-tip{text-align:center;opacity:.5;padding:30px 0;font-size:14px}
        .notation-box{background:#10142a;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;max-height:110px;overflow-y:auto;word-break:break-all;color:#7fe3ff;font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:16px}
    </style>
    <!-- Three.js -->
    <script src="three.min.js"></script>
</head>
<body>

    <div id="topbar">
        <button class="btn gray" id="btn-reset">↺ 复原</button>
        <span class="stat">时间 <b id="timer">00:00</b></span>
        <button class="btn" id="btn-scramble">🔀 打乱</button>
    </div>
    <div id="topbar">
        <button class="btn gray" id="btn-list-snap">📋 快照库</button>
        <span class="stat">步数 <b id="steps">0</b></span>
        <button class="btn gray" id="btn-formula-lib">📜 步骤库</button>
    </div>
    <div id="topbar">
        <button class="btn" id="btn-save-snap">📸 存快照</button>
        <span></span>
        <button class="btn" id="btn-record">⏺ 记录</button>
    </div>
    <div id="wrap"></div>
    <div id="footer">
        <button class="btn gray" id="btn-undo" style="width: 100%;">◀ 上一步</button>
        <button class="btn gray" id="btn-reset-view">↺ 视角</button>
        <button class="btn gray" id="btn-redo" style="width: 100%;">下一步 ▶</button>
    </div>
    <!-- <div id="hint">👆 滑动魔方表面转动一层 · 拖动空白处旋转视角</div> -->
    <div id="toast"></div>

    <!-- 快照模态框 -->
    <div id="snapshot-modal">
        <div class="modal-box" id="modal-content"></div>
    </div>

    <script>
        // --- 核心常量 ---
        const SIZE = 5;
        const CUBE_SIZE = 1.0;
        const GAP = 0.04;
        const STEP = CUBE_SIZE + GAP; // 单块步长
        const OFFSET = (SIZE - 1) / 2; // 1.5

        const COLORS = {
            R: 0xc41e3a, // 红 (右)
            L: 0xff5800, // 橙 (左)
            U: 0xffffff, // 白 (上)
            D: 0xffd500, // 黄 (下)
            F: 0x009e60, // 绿 (前)
            B: 0x0051ba, // 蓝 (后)
            INNER: 0x1a1a1a
        };

        // --- Three.js 场景初始化 ---
        const wrap = document.getElementById('wrap');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        wrap.appendChild(renderer.domElement);
        const dom = renderer.domElement;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
        dirLight.position.set(6, 10, 8);
        scene.add(dirLight);

        // 魔方顶级节点
        const cubeGroup = new THREE.Group();
        cubeGroup.position.y = 0.7; // 向上调整魔方中心位置
        scene.add(cubeGroup);

        /* ---------- 相机轨道 + 缩放 ---------- */
        let RAD = 24;
        const RAD_MIN = 5.5, RAD_MAX = 28;
        let theta = 0.8, phi = 1.02;
        const DEF = { theta: 0.8, phi: 1.02, rad: 24 };

        function updCam() {
            camera.position.setFromSphericalCoords(RAD, phi, theta);
            camera.lookAt(0, 0, 0);
        }
        function resize() {
            const w = wrap.clientWidth, h = wrap.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);
        resize(); updCam();

        let cubies = [];

        function createCubeMaterial(faceColor, isOuter) {
            return new THREE.MeshLambertMaterial({
                color: isOuter ? faceColor : COLORS.INNER,
                roughness: 0.3
            });
        }

        // 初始化 5x5x5 方块
        function initCube() {
            while (cubeGroup.children.length > 0) {
                cubeGroup.remove(cubeGroup.children[0]);
            }
            cubies = [];

            const geom = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);

            for (let x = 0; x < SIZE; x++) {
                for (let y = 0; y < SIZE; y++) {
                    for (let z = 0; z < SIZE; z++) {
                        const materials = [
                            createCubeMaterial(COLORS.R, x === SIZE - 1),
                            createCubeMaterial(COLORS.L, x === 0),
                            createCubeMaterial(COLORS.U, y === SIZE - 1),
                            createCubeMaterial(COLORS.D, y === 0),
                            createCubeMaterial(COLORS.F, z === SIZE - 1),
                            createCubeMaterial(COLORS.B, z === 0)
                        ];

                        const mesh = new THREE.Mesh(geom, materials);
                        mesh.position.set(
                            (x - OFFSET) * STEP,
                            (y - OFFSET) * STEP,
                            (z - OFFSET) * STEP
                        );
                        cubeGroup.add(mesh);
                        cubies.push(mesh);
                    }
                }
            }
        }
        initCube();

        // --- 修复关键点 1：五阶魔方整数坐标吸附与正交化纠错 ---
        function snapCoord(val) {
            const raw = val / STEP;
            // 五阶合法坐标只存在于 [-2, -1, 0, 1, 2]
            let layer = Math.round(raw);
            layer = Math.max(-2, Math.min(2, layer));
            return layer * STEP;
        }

        function snapCubie(mesh) {
            // 1. 位置吸附（防止方块漂移和重叠）
            mesh.position.x = snapCoord(mesh.position.x);
            mesh.position.y = snapCoord(mesh.position.y);
            mesh.position.z = snapCoord(mesh.position.z);

            // 2. 姿态矩阵正交化（消除 90° 旋转累积微小角度倾斜）
            mesh.updateMatrix();
            const rot = new THREE.Matrix4().extractRotation(mesh.matrix);
            const m = rot.elements;
            for (let i = 0; i < 16; i++) {
                m[i] = Math.round(m[i]); // 90度倍数旋转的矩阵元素严格为 -1, 0, 1
            }
            mesh.quaternion.setFromRotationMatrix(rot);
            mesh.updateMatrix();
        }

        // --- 修复关键点 2：在局部坐标系内完成旋转 ---
        let isAnimating = false;

        function rotateSlice(axis, layerCoord, direction, duration = 160) {
            if (isAnimating) return Promise.resolve();
            isAnimating = true;

            return new Promise((resolve) => {
                // 将临时旋转节点放在 cubeGroup 内部，避免因视角转动而引发轴向偏差
                const rotationGroup = new THREE.Group();
                cubeGroup.add(rotationGroup);

                const targetLayerPos = layerCoord * STEP;
                const activeCubies = cubies.filter(c => Math.abs(c.position[axis] - targetLayerPos) < STEP / 2);

                activeCubies.forEach(c => rotationGroup.attach(c));

                const targetAngle = (Math.PI / 2) * direction;
                const startTime = performance.now();

                function animate(time) {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);

                    rotationGroup.rotation[axis] = targetAngle * ease;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        rotationGroup.rotation[axis] = targetAngle;
                        rotationGroup.updateMatrixWorld();

                        activeCubies.forEach(c => {
                            cubeGroup.attach(c);
                            snapCubie(c); // 吸附纠偏
                        });

                        cubeGroup.remove(rotationGroup);
                        isAnimating = false;
                        resolve();
                    }
                }
                requestAnimationFrame(animate);
            });
        }

        /* ==================== 步骤历史 / 动作队列 ==================== */
        // 队列化：所有转动按顺序串行执行，避免快速点击时丢步
        let moveQueue = Promise.resolve();
        let queueCount = 0;

        function enqueueMove(axis, layer, dir, duration = 160) {
            queueCount++;
            const task = moveQueue.then(() => rotateSlice(axis, layer, dir, duration));
            moveQueue = task.catch(() => {});
            return task.finally(() => { queueCount--; });
        }

        function isBusy() {
            return isAnimating || queueCount > 0;
        }

        // 历史记录（用于上一步 / 下一步）
        let history = [];        // 已执行过的所有步骤
        let historyIndex = 0;    // 游标：history[0..historyIndex) 已应用

        // 步骤记录器（用于保存公式）
        let recording = false;
        let recordedSteps = [];

        /**
         * 执行一步转动并登记到历史 / 记录器
         * @param {string} axis  'x' | 'y' | 'z'
         * @param {number} layer -2..2
         * @param {number} dir   1 | -1 | 2 | -2
         * @param {object} opts  { duration, track, record }
         */
        function performMove(axis, layer, dir, opts = {}) {
            const { duration = 160, track = true, record = true } = opts;
            return enqueueMove(axis, layer, dir, duration).then(() => {
                if (track) {
                    // 若在历史中间执行新动作，丢弃后面的“未来”
                    if (historyIndex < history.length) history.length = historyIndex;
                    history.push({ axis, layer, dir });
                    historyIndex = history.length;
                    updateHistoryUI();
                }
                if (record && recording) {
                    recordedSteps.push({ axis, layer, dir });
                    updateRecordUI();
                }
            });
        }

        function updateHistoryUI() {
            const u = document.getElementById('btn-undo');
            const r = document.getElementById('btn-redo');
            if (u) u.disabled = historyIndex <= 0;
            if (r) r.disabled = historyIndex >= history.length;
        }

        function clearHistory() {
            history = [];
            historyIndex = 0;
            updateHistoryUI();
        }

        // 上一步：把最近一步反向转回去
        async function undoStep() {
            if (isBusy()) return;
            if (historyIndex <= 0) { toast('已经是最早一步了'); return; }
            const step = history[historyIndex - 1];
            historyIndex--;
            updateHistoryUI();
            await enqueueMove(step.axis, step.layer, -step.dir, 150);
        }

        // 下一步：重放游标处的那一步
        async function redoStep() {
            if (isBusy()) return;
            if (historyIndex >= history.length) { toast('已经是最新一步了'); return; }
            const step = history[historyIndex];
            historyIndex++;
            updateHistoryUI();
            await enqueueMove(step.axis, step.layer, step.dir, 150);
        }

        document.getElementById('btn-undo').addEventListener('click', undoStep);
        document.getElementById('btn-redo').addEventListener('click', redoStep);

        /* ==================== 步骤记录器 UI ==================== */
        function updateRecordUI() {
            const btn = document.getElementById('btn-record');
            if (!btn) return;
            if (recording) {
                btn.textContent = `⏹ 停止记录 (${recordedSteps.length})`;
                btn.classList.add('recording');
            } else {
                btn.textContent = '⏺ 记录';
                btn.classList.remove('recording');
            }
        }

        function toggleRecording() {
            if (recording) {
                recording = false;
                updateRecordUI();
                if (recordedSteps.length === 0) {
                    toast('⏹ 已停止（未记录到步骤）');
                } else {
                    // 停止记录，弹出名称编辑框让用户修改公式名称
                    const list = getFormulas();
                    const defaultName = `公式 ${list.length + 1}`;
                    const notation = recordedSteps.map(stepToNotation).join(' ');
                    openModal(`
                        <h3>💾 保存公式</h3>
                        <input type="text" id="formula-title-input" value="${escapeHtml(defaultName)}" placeholder="输入公式名称..." maxlength="30">
                        <div class="notation-box">${escapeHtml(notation)}</div>
                        <div class="modal-actions">
                            <button class="btn gray" id="modal-cancel">取消</button>
                            <button class="btn" id="modal-save">保存</button>
                        </div>
                    `);
                    setTimeout(() => {
                        const input = document.getElementById('formula-title-input');
                        input.focus();
                        input.select();
                    }, 50);

                    const doSave = () => {
                        const title = document.getElementById('formula-title-input').value.trim() || defaultName;
                        const f = {
                            id: Date.now(),
                            title,
                            time: new Date().toLocaleString('zh-CN'),
                            moves: recordedSteps.map(s => ({ axis: s.axis, layer: s.layer, dir: s.dir })),
                            notation
                        };
                        list.unshift(f);
                        saveFormulas(list);
                        recordedSteps = [];
                        closeModal();
                        toast(`✓ 已保存「${f.title}」到步骤库`);
                    };
                    document.getElementById('modal-cancel').onclick = () => {
                        recordedSteps = [];
                        closeModal();
                        toast('⏹ 已取消保存');
                    };
                    document.getElementById('modal-save').onclick = doSave;
                    document.getElementById('formula-title-input').addEventListener('keydown', e => {
                        if (e.key === 'Enter') doSave();
                    });
                }
            } else {
                recording = true;
                recordedSteps = [];
                updateRecordUI();
                toast('⏺ 开始记录步骤，转动魔方即可');
            }
        }

        document.getElementById('btn-record').addEventListener('click', toggleRecording);

        /* ==================== 公式记号 ==================== */
        // cw: 该层"顺时针"对应的 dir 符号（dir * cw > 0 即顺时针）
        const NOTATION_MAP = {
            'x,2':  { name: 'R',  cw: -1 },
            'x,1':  { name: '2R', cw: -1 },
            'x,0':  { name: 'M',  cw: 1  },
            'x,-1': { name: '2L', cw: 1  },
            'x,-2': { name: 'L',  cw: 1  },
            'y,2':  { name: 'U',  cw: -1 },
            'y,1':  { name: '2U', cw: -1 },
            'y,0':  { name: 'E',  cw: 1  },
            'y,-1': { name: '2D', cw: 1  },
            'y,-2': { name: 'D',  cw: 1  },
            'z,2':  { name: 'F',  cw: -1 },
            'z,1':  { name: '2F', cw: -1 },
            'z,0':  { name: 'S',  cw: -1 },
            'z,-1': { name: '2B', cw: 1  },
            'z,-2': { name: 'B',  cw: 1  }
        };

        function stepToNotation(step) {
            const info = NOTATION_MAP[step.axis + ',' + step.layer];
            if (!info) return step.axis + step.layer + (step.dir > 0 ? '+' : '-');
            if (Math.abs(step.dir) === 2) return info.name + '2';
            const clockwise = step.dir * info.cw > 0;
            return info.name + (clockwise ? '' : "'");
        }

        /* ==================== 公式库 ==================== */
        const FORMULA_KEY = 'formula_005';

        function getFormulas() {
            try { return JSON.parse(localStorage.getItem(FORMULA_KEY)) || []; }
            catch { return []; }
        }
        function saveFormulas(list) {
            localStorage.setItem(FORMULA_KEY, JSON.stringify(list));
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            }
            return Promise.resolve(fallbackCopy(text));
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
        }

        // 保存公式弹窗
        function openSaveFormulaModal() {
            if (recordedSteps.length === 0) {
                toast('还没有记录到步骤，请先点「记录」');
                return;
            }
            const notation = recordedSteps.map(stepToNotation).join(' ');
            openModal(`
                <h3>💾 保存公式</h3>
                <input type="text" id="formula-title" placeholder="输入公式名称..." maxlength="30">
                <div class="notation-box">${escapeHtml(notation)}</div>
                <div class="modal-actions">
                    <button class="btn gray" id="modal-cancel">取消</button>
                    <button class="btn" id="modal-save">保存</button>
                </div>
            `);
            setTimeout(() => document.getElementById('formula-title').focus(), 50);

            const doSave = () => {
                const title = document.getElementById('formula-title').value.trim();
                saveFormula(title);
                closeModal();
            };
            document.getElementById('modal-cancel').onclick = closeModal;
            document.getElementById('modal-save').onclick = doSave;
            document.getElementById('formula-title').addEventListener('keydown', e => {
                if (e.key === 'Enter') doSave();
            });
        }

        function saveFormula(title) {
            const list = getFormulas();
            const f = {
                id: Date.now(),
                title: title || `公式 ${list.length + 1}`,
                time: new Date().toLocaleString('zh-CN'),
                moves: recordedSteps.map(s => ({ axis: s.axis, layer: s.layer, dir: s.dir })),
                notation: recordedSteps.map(stepToNotation).join(' ')
            };
            list.unshift(f);
            saveFormulas(list);
            toast(`✓ 已保存「${f.title}」`);
        }

        // 公式库弹窗
        function openFormulaList() {
            const list = getFormulas();
            let html = '<h3>📜 步骤库</h3><div class="snapshot-list">';
            if (list.length === 0) {
                html += '<div class="empty-tip">暂无公式</div>';
            } else {
                html += list.map(f => `
                    <div class="snapshot-item">
                        <div class="snapshot-info">
                            <div class="snapshot-title">${escapeHtml(f.title)}</div>
                            <div class="snapshot-time">${f.time} · ${f.moves.length} 步</div>
                            <div class="snapshot-time" style="color:#7fe3ff;font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.9">${escapeHtml(f.notation || '')}</div>
                        </div>
                        <div class="snapshot-actions">
                            <button onclick="window._playFormula(${f.id})">回放</button> 
                            <button onclick="window._renameFormula(${f.id})">改名</button>
                            <button class="del" onclick="window._deleteFormula(${f.id})">删除</button>
                        </div>
                    </div>
                `).join('');
            }
            html += '</div><div class="modal-actions" style="margin-top:14px"><button class="btn gray" id="modal-close">关闭</button></div>';
            openModal(html);
            document.getElementById('modal-close').onclick = closeModal;
        }

        function deleteFormula(id) {
            saveFormulas(getFormulas().filter(f => f.id !== id));
            openFormulaList();
        }

        function copyFormula(id) {
            const f = getFormulas().find(x => x.id === id);
            if (!f) return;
            copyText(f.notation || '').then(() => toast('✓ 公式已复制到剪贴板'));
        }

        function renameFormula(id) {
            const f = getFormulas().find(x => x.id === id);
            if (!f) return;
            openModal(`
                <h3>✏ 重命名公式</h3>
                <input type="text" id="rename-input" value="${escapeHtml(f.title)}" placeholder="输入新名称..." maxlength="30">
                <div class="modal-actions">
                    <button class="btn gray" id="modal-cancel">取消</button>
                    <button class="btn" id="modal-save">保存</button>
                </div>
            `);
            setTimeout(() => {
                const input = document.getElementById('rename-input');
                input.focus();
                input.select();
            }, 50);

            const doRename = () => {
                const newTitle = document.getElementById('rename-input').value.trim();
                if (newTitle && newTitle !== f.title) {
                    const list = getFormulas();
                    const target = list.find(x => x.id === id);
                    if (target) {
                        target.title = newTitle;
                        saveFormulas(list);
                        toast(`✓ 已重命名为「${newTitle}」`);
                    }
                }
                closeModal();
                openFormulaList();
            };
            document.getElementById('modal-cancel').onclick = closeModal;
            document.getElementById('modal-save').onclick = doRename;
            document.getElementById('rename-input').addEventListener('keydown', e => {
                if (e.key === 'Enter') doRename();
            });
        }

        async function playFormula(id) {
            const f = getFormulas().find(x => x.id === id);
            if (!f) return;
            if (isBusy()) { toast('动画进行中，请稍候…'); return; }
            closeModal();
            setButtonsDisabled(true);
            for (const m of f.moves) {
                await performMove(m.axis, m.layer, m.dir, { duration: 150, track: true, record: false });
            }
            // 执行完后回到第一步（重置历史游标）
            historyIndex = 0;
            updateHistoryUI();
            setButtonsDisabled(false);
            toast(`✓ 已回放「${f.title}」，已回到第一步`);
        }

        window._playFormula = playFormula;
        window._copyFormula = copyFormula;
        window._deleteFormula = deleteFormula;
        window._renameFormula = renameFormula;

        document.getElementById('btn-formula-lib').addEventListener('click', openFormulaList);

        /* ==================== 打乱 ==================== */
        // --- 高品质 WCA 打乱算法 ---
        function generateScrambleSequence(length = 24) {
            const axes = ['x', 'y', 'z'];
            const coords = [-2, -1, 0, 1, 2];
            const dirs = [1, -1, 2]; // 包含 180 度双转
            const seq = [];
            let lastAxis = '', lastLayer = null;

            for (let i = 0; i < length; i++) {
                let axis, layer;
                do {
                    axis = axes[Math.floor(Math.random() * axes.length)];
                    layer = coords[Math.floor(Math.random() * coords.length)];
                } while (axis === lastAxis && layer === lastLayer); // 绝不连续在同轴同层打乱

                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                seq.push({ axis, layer, dir });
                lastAxis = axis;
                lastLayer = layer;
            }
            return seq;
        }

        async function runScramble() {
            if (isBusy()) return;
            setButtonsDisabled(true);
            stopTimer();
            document.getElementById('timer').innerText = '00:00';
            resetStats();
            toast('🔀 正在打乱...');

            const seq = generateScrambleSequence(24);
            for (const step of seq) {
                const duration = Math.abs(step.dir) === 2 ? 80 : 55;
                // 打乱过程登记进历史（可用上一步逐步回看），但不计入公式记录
                await performMove(step.axis, step.layer, step.dir, {
                    duration, track: true, record: false
                });
            }

            toast('🔀 打乱完成！');
            setButtonsDisabled(false);
        }

        function setButtonsDisabled(disabled) {
            document.querySelectorAll('button').forEach(b => b.disabled = disabled);
            if (!disabled) updateHistoryUI();
        }

        /* ==================== 交互系统（触控、缩放、滑转） ==================== */
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2();
        let drag = null;

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // --- 指针按下 ---
        dom.addEventListener('pointerdown', e => {
            e.preventDefault();
            dom.setPointerCapture(e.pointerId);
            const rect = dom.getBoundingClientRect();
            ndc.set(
                ((e.clientX - rect.left) / rect.width) * 2 - 1,
                -((e.clientY - rect.top) / rect.height) * 2 + 1
            );
            raycaster.setFromCamera(ndc, camera);
            const hits = raycaster.intersectObjects(cubies);
            if (hits.length && !isBusy()) {
                const h = hits[0];
                const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
                n.set(Math.round(n.x), Math.round(n.y), Math.round(n.z));
                drag = { type: 'layer', cubie: h.object, n, point: h.point.clone(), sx: e.clientX, sy: e.clientY, done: false };
            } else {
                drag = { type: 'view', sx: e.clientX, sy: e.clientY };
            }
        });

        // --- 指针移动 ---
        dom.addEventListener('pointermove', e => {
            if (!drag) return;
            const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
            if (drag.type === 'view') {
                theta -= dx * 0.008;
                phi -= dy * 0.008;
                phi = Math.max(0.15, Math.min(Math.PI - 0.15, phi));
                drag.sx = e.clientX; drag.sy = e.clientY;
                updCam();
            } else if (!drag.done && Math.hypot(dx, dy) > 14) {
                drag.done = true;
                handleCubeDrag(drag, dx, dy);
                drag = null;
            }
        });
        window.addEventListener('pointerup', () => drag = null);
        window.addEventListener('pointercancel', () => drag = null);

        // --- 双指捏合缩放（触摸）---
        let pinchDist0 = 0, pinchRad0 = RAD;
        dom.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                drag = null;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchDist0 = Math.hypot(dx, dy);
                pinchRad0 = RAD;
            }
        }, { passive: false });

        dom.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                if (pinchDist0 > 0) {
                    const scale = pinchDist0 / dist;
                    RAD = clamp(pinchRad0 * scale, RAD_MIN, RAD_MAX);
                    updCam();
                }
            }
        }, { passive: false });

        dom.addEventListener('touchend', () => { pinchDist0 = 0; });

        // --- 鼠标滚轮缩放（PC）---
        dom.addEventListener('wheel', e => {
            e.preventDefault();
            const factor = 1 + e.deltaY * 0.001;
            RAD = clamp(RAD * factor, RAD_MIN, RAD_MAX);
            updCam();
        }, { passive: false });

        // 图层旋转方向解算
        function handleCubeDrag(d, dx, dy) {
            const n = d.n;
            const ts = [];
            if (n.x === 0) ts.push(new THREE.Vector3(1, 0, 0));
            if (n.y === 0) ts.push(new THREE.Vector3(0, 1, 0));
            if (n.z === 0) ts.push(new THREE.Vector3(0, 0, 1));

            const dragV = new THREE.Vector2(dx, -dy).normalize();

            // 在面内两个切向中，选出屏幕投影方向与手指滑动最贴合的那个
            let best = null, bs = 0;
            for (const t of ts) {
                const s = scrDir(d.point, t).dot(dragV);
                if (Math.abs(s) > Math.abs(bs)) {
                    bs = s;
                    best = t.clone().multiplyScalar(Math.sign(s));
                }
            }
            if (!best) return;

            // 旋转轴 a 需满足：面上点速度 a × n 与 best 同向  =>  a = n × best
            // ⚠️ 关键修复：必须保留轴向的符号，否则部分面/方向会转反
            const axisVec = new THREE.Vector3().crossVectors(n, best);

            let comp, dir;
            if (Math.abs(axisVec.x) > 0.5)      { comp = 'x'; dir = Math.sign(axisVec.x); }
            else if (Math.abs(axisVec.y) > 0.5) { comp = 'y'; dir = Math.sign(axisVec.y); }
            else                                { comp = 'z'; dir = Math.sign(axisVec.z); }

            const rawLayer = d.cubie.position[comp] / STEP;
            let layerCoord = Math.round(rawLayer);
            layerCoord = Math.max(-2, Math.min(2, layerCoord));

            startTimer();
            addStep();
            // 走历史队列，并（若正在记录）写入公式记录
            performMove(comp, layerCoord, dir, { duration: 160 });
        }

        function scrDir(p, v) {
            const a = p.clone().project(camera);
            const b = p.clone().add(v).project(camera);
            return new THREE.Vector2(b.x - a.x, b.y - a.y).normalize();
        }

        // --- 计时器与步数 ---
        let timeStart = 0;
        let timing = false;
        let moveCount = 0;

        function startTimer() {
            if (timing) return;
            timing = true;
            timeStart = performance.now();
        }

        function stopTimer() {
            timing = false;
        }

        function resetStats() {
            moveCount = 0;
            document.getElementById('steps').innerText = '0';
        }

        function addStep() {
            moveCount++;
            document.getElementById('steps').innerText = moveCount;
        }

        function fmt(ms) {
            const s = Math.floor(ms / 1000);
            return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        /* ---------- Toast 提示 ---------- */
        let toastTimer;
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // --- 按钮事件 ---
        document.getElementById('btn-scramble').addEventListener('click', runScramble);

        document.getElementById('btn-reset-view').addEventListener('click', () => {
            theta = DEF.theta;
            phi = DEF.phi;
            RAD = DEF.rad;
            updCam();
            toast('↺ 视角已还原');
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (isBusy()) { toast('动画进行中，请稍候…'); return; }
            stopTimer();
            document.getElementById('timer').innerText = '00:00';
            resetStats();
            theta = DEF.theta;
            phi = DEF.phi;
            RAD = DEF.rad;
            updCam();
            cubeGroup.rotation.set(0, 0, 0);
            initCube();
            clearHistory();
            toast('↺ 已复原');
        });

        // ==================== 快照系统 ====================
        const SNAPSHOT_KEY = 'cache_005';

        function getSnapshots() {
            try {
                return JSON.parse(localStorage.getItem(SNAPSHOT_KEY)) || [];
            } catch { return []; }
        }

        function saveSnapshots(list) {
            localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(list));
        }

        // 捕获当前魔方状态
        function captureCubeState() {
            return cubies.map(c => ({
                pos: { x: c.position.x, y: c.position.y, z: c.position.z },
                quat: { x: c.quaternion.x, y: c.quaternion.y, z: c.quaternion.z, w: c.quaternion.w }
            }));
        }

        // 恢复魔方状态（直接设置，无动画）
        function restoreCubeState(state) {
            if (!state || state.length !== cubies.length) return false;
            state.forEach((s, i) => {
                cubies[i].position.set(s.pos.x, s.pos.y, s.pos.z);
                cubies[i].quaternion.set(s.quat.x, s.quat.y, s.quat.z, s.quat.w);
                snapCubie(cubies[i]);
            });
            return true;
        }

        // 保存快照
        function saveSnapshot(title) {
            const snaps = getSnapshots();
            const snap = {
                id: Date.now(),
                title: title || `快照 ${snaps.length + 1}`,
                time: new Date().toLocaleString('zh-CN'),
                cube: captureCubeState()
            };
            snaps.unshift(snap);
            saveSnapshots(snaps);
            toast(`✓ 已保存"${snap.title}"`);
        }

        // 删除快照
        function deleteSnapshot(id) {
            const snaps = getSnapshots().filter(s => s.id !== id);
            saveSnapshots(snaps);
            openSnapshotList();
        }

        // 恢复快照
        function restoreSnapshot(id) {
            const snap = getSnapshots().find(s => s.id === id);
            if (!snap) return;
            if (isBusy()) { toast('动画进行中，请稍候…'); return; }
            if (restoreCubeState(snap.cube)) {
                stopTimer();
                document.getElementById('timer').innerText = '00:00';
                resetStats();
                clearHistory();   // 状态已跳变，历史作废
                toast(`✓ 已恢复"${snap.title}"`);
                closeModal();
            } else {
                toast('快照数据不兼容');
            }
        }

        // 模态框控制
        const modal = document.getElementById('snapshot-modal');
        const modalContent = document.getElementById('modal-content');

        function openModal(html) {
            modalContent.innerHTML = html;
            modal.classList.add('show');
        }
        function closeModal() {
            modal.classList.remove('show');
        }
        modal.addEventListener('click', e => {
            if (e.target === modal) closeModal();
        });

        // 打开保存快照弹窗
        function openSaveModal() {
            if (isBusy()) { toast('动画进行中，请稍候…'); return; }
            openModal(`
                <h3>📸 保存快照</h3>
                <input type="text" id="snap-title" placeholder="输入快照标题..." maxlength="30">
                <div class="modal-actions">
                    <button class="btn gray" id="modal-cancel">取消</button>
                    <button class="btn" id="modal-save">保存</button>
                </div>
            `);
            setTimeout(() => document.getElementById('snap-title').focus(), 50);
            document.getElementById('modal-cancel').onclick = closeModal;
            document.getElementById('modal-save').onclick = () => {
                const title = document.getElementById('snap-title').value.trim();
                saveSnapshot(title);
                closeModal();
            };
            document.getElementById('snap-title').addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    const title = e.target.value.trim();
                    saveSnapshot(title);
                    closeModal();
                }
            });
        }

        // 打开快照列表弹窗
        function openSnapshotList() {
            const snaps = getSnapshots();
            let listHtml = '<h3>📋 快照库</h3><div class="snapshot-list">';
            if (snaps.length === 0) {
                listHtml += '<div class="empty-tip">暂无快照</div>';
            } else {
                listHtml += snaps.map(s => `
                    <div class="snapshot-item">
                        <div class="snapshot-info">
                            <div class="snapshot-title">${escapeHtml(s.title)}</div>
                            <div class="snapshot-time">${s.time}</div>
                        </div>
                        <div class="snapshot-actions">
                            <button onclick="window._restore(${s.id})">恢复</button>
                            <button class="del" onclick="window._delete(${s.id})">删除</button>
                        </div>
                    </div>
                `).join('');
            }
            listHtml += '</div><div class="modal-actions" style="margin-top:14px"><button class="btn gray" id="modal-close">关闭</button></div>';
            openModal(listHtml);
            document.getElementById('modal-close').onclick = closeModal;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 全局暴露给 onclick
        window._restore = restoreSnapshot;
        window._delete = deleteSnapshot;

        // 按钮绑定
        document.getElementById('btn-save-snap').addEventListener('click', openSaveModal);
        document.getElementById('btn-list-snap').addEventListener('click', openSnapshotList);

        // 初始化按钮状态
        updateHistoryUI();
        updateRecordUI();

        function render(now) {
            requestAnimationFrame(render);

            // 更新计时器显示
            if (timing) {
                document.getElementById('timer').innerText = fmt(now - timeStart);
            }

            renderer.render(scene, camera);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
