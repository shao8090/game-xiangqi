
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D魔方小游戏</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; /* 禁止手机端双击缩放和下拉刷新 */
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }
        /* UI 顶层控件 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .header {
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        .header h1 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.8rem;
            color: #bdc3c7;
        }
        /* 底部控制区 */
        .controls {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: env(safe-area-inset-bottom, 10px);
        }
        .btn-row {
            display: flex;
            justify-content: space-around;
            gap: 6px;
        }
        button {
            flex: 1;
            padding: 10px 0;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: background 0.15s, transform 0.1s;
        }
        button:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.96);
        }
        button.action-btn {
            background: #e67e22;
        }
        button.action-btn:active {
            background: #d35400;
        }
        /* 逆时针切换高亮 */
        button.active-toggle {
            background: #e74c3c;
        }
    </style>
    <!-- 引入 Three.js 和 轨道控制器 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="ui-layer">
        <div class="header">
            <h1>3D 掌上魔方</h1>
            <p>单指滑动背景旋转视角 | 双指缩放</p>
        </div>

        <div class="controls">
            <!-- 顶层功能按钮 -->
            <div class="btn-row">
                <button class="action-btn" id="shuffle-btn">随机打乱</button>
                <button class="action-btn" id="reset-btn">一键复原</button>
                <button id="toggle-dir-btn">当前: 顺时针</button>
            </div>
            <!-- 转动层按钮 (对应标准魔方符号: U D L R F B) -->
            <div class="btn-row">
                <button data-face="U">上 (U)</button>
                <button data-face="D">下 (D)</button>
                <button data-face="L">左 (L)</button>
                <button data-face="R">右 (R)</button>
                <button data-face="F">前 (F)</button>
                <button data-face="B">后 (B)</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 初始化场景、相机、渲染器 ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4.5, 4.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 优化手机端视网膜屏幕
        container.appendChild(renderer.domElement);

        // 控制器支持触摸缩放和旋转视角
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. 创建魔方结构 ---
        // 魔方 6 面标准颜色: 
        // 右(+X):红, 左(-X):橙, 上(+Y):白, 下(-Y):黄, 前(+Z):绿, 后(-Z):蓝, 内部:深黑
        const colors = {
            R: 0xb71234, // 右 - 红
            L: 0xff5800, // 左 - 橙
            U: 0xffffff, // 上 - 白
            D: 0xffd500, // 下 - 黄
            F: 0x009b48, // 前 - 绿
            B: 0x0046ad, // 后 - 蓝
            IN: 0x222222 // 内部深灰
        };

        const pieceSize = 0.96; // 留一点微小的缝隙更真实
        const spacing = 1.0;
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        const pieces = [];

        function createCube() {
            // 清理已存在的色块
            while(cubeGroup.children.length > 0){ 
                cubeGroup.remove(cubeGroup.children[0]); 
            }
            pieces.length = 0;

            const boxGeo = new THREE.BoxGeometry(pieceSize, pieceSize, pieceSize);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        // 只为外表面着色，内侧表面黑色
                        const materials = [
                            new THREE.MeshLambertMaterial({ color: x === 1 ? colors.R : colors.IN }), // 右
                            new THREE.MeshLambertMaterial({ color: x === -1 ? colors.L : colors.IN }), // 左
                            new THREE.MeshLambertMaterial({ color: y === 1 ? colors.U : colors.IN }), // 上
                            new THREE.MeshLambertMaterial({ color: y === -1 ? colors.D : colors.IN }), // 下
                            new THREE.MeshLambertMaterial({ color: z === 1 ? colors.F : colors.IN }), // 前
                            new THREE.MeshLambertMaterial({ color: z === -1 ? colors.B : colors.IN })  // 后
                        ];

                        const piece = new THREE.Mesh(boxGeo, materials);
                        piece.position.set(x * spacing, y * spacing, z * spacing);
                        cubeGroup.add(piece);
                        pieces.push(piece);
                    }
                }
            }
        }
        createCube();

        // --- 3. 旋转逻辑 ---
        let isAnimating = false;
        let isClockwise = true;

        // 将旋转轴与层对应
        const faceAxes = {
            'R': { axis: 'x', value: 1,  dir: -1 },
            'L': { axis: 'x', value: -1, dir: 1 },
            'U': { axis: 'y', value: 1,  dir: -1 },
            'D': { axis: 'y', value: -1, dir: 1 },
            'F': { axis: 'z', value: 1,  dir: -1 },
            'B': { axis: 'z', value: -1, dir: 1 },
        };

        function rotateFace(faceKey, customSpeed = null, callback = null) {
            if (isAnimating && customSpeed === null) return;
            isAnimating = true;

            const config = faceAxes[faceKey];
            const direction = (isClockwise ? 1 : -1) * config.dir;
            const targetAngle = (Math.PI / 2) * direction;

            // 筛选出属于该层的 9 个小块
            const activePieces = pieces.filter(piece => {
                return Math.abs(piece.position[config.axis] - config.value * spacing) < 0.1;
            });

            // 创建一个临时的旋转轴心对象
            const pivot = new THREE.Object3D();
            pivot.rotation.set(0, 0, 0);
            scene.add(pivot);

            activePieces.forEach(piece => {
                pivot.attach(piece); // 将方块临时附加到 pivot，保持世界空间位置
            });

            const duration = customSpeed || 200; // 转动动画时长 (ms)
            const startTime = performance.now();

            function animateRotate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 平滑缓动 (ease-out)
                const ease = 1 - Math.pow(1 - progress, 3);
                pivot.rotation[config.axis] = targetAngle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animateRotate);
                } else {
                    // 转动完成：归位并更新坐标
                    pivot.rotation[config.axis] = targetAngle;
                    pivot.updateMatrixWorld();
                    activePieces.forEach(piece => {
                        cubeGroup.attach(piece);
                        // 修正浮点数误差，保证坐标是精确的整数
                        piece.position.x = Math.round(piece.position.x);
                        piece.position.y = Math.round(piece.position.y);
                        piece.position.z = Math.round(piece.position.z);
                    });
                    scene.remove(pivot);
                    isAnimating = false;
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animateRotate);
        }

        // 打乱魔方
        function shuffleCube() {
            if (isAnimating) return;
            const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
            let count = 15; // 打乱步数
            
            function step() {
                if (count <= 0) return;
                const randomFace = faces[Math.floor(Math.random() * faces.length)];
                rotateFace(randomFace, 60, () => {
                    count--;
                    step();
                });
            }
            step();
        }

        // --- 4. 事件监听与 UI 交互 ---
        // 旋转方向切换
        const toggleBtn = document.getElementById('toggle-dir-btn');
        toggleBtn.addEventListener('click', () => {
            isClockwise = !isClockwise;
            toggleBtn.textContent = isClockwise ? '当前: 顺时针' : '当前: 逆时针';
            toggleBtn.classList.toggle('active-toggle', !isClockwise);
        });

        // 绑定转动面按钮
        document.querySelectorAll('button[data-face]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const face = e.target.getAttribute('data-face');
                rotateFace(face);
            });
        });

        // 打乱与复原
        document.getElementById('shuffle-btn').addEventListener('click', shuffleCube);
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (isAnimating) return;
            createCube();
        });

        // 窗口缩放适配手机屏幕
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // --- 5. 渲染主循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
