<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D魔方小游戏</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }
        /* UI 顶层控件 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }
        .header {
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            pointer-events: auto;
            margin-top: env(safe-area-inset-top, 5px);
        }
        .header h1 {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
        .header p {
            font-size: 0.75rem;
            color: #bdc3c7;
        }
        /* 底部控制区 */
        .controls {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(20, 25, 35, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: env(safe-area-inset-bottom, 8px);
        }
        .section-label {
            font-size: 0.7rem;
            color: #95a5a6;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        button {
            flex: 1;
            padding: 7px 0;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            line-height: 1.2;
            transition: background 0.15s, transform 0.1s;
        }
        button small {
            font-size: 0.65rem;
            opacity: 0.8;
            display: block;
        }
        button:active {
            transform: scale(0.94);
        }
        /* 顺时针按键 */
        .btn-cw {
            background: rgba(52, 152, 219, 0.35);
            border: 1px solid rgba(52, 152, 219, 0.4);
        }
        .btn-cw:active {
            background: rgba(52, 152, 219, 0.7);
        }
        /* 逆时针按键 */
        .btn-ccw {
            background: rgba(231, 76, 60, 0.35);
            border: 1px solid rgba(231, 76, 60, 0.4);
        }
        .btn-ccw:active {
            background: rgba(231, 76, 60, 0.7);
        }
        /* 功能按键 */
        .action-btn {
            background: rgba(243, 156, 18, 0.4);
            border: 1px solid rgba(243, 156, 18, 0.4);
            padding: 8px 0;
        }
        .action-btn:active {
            background: rgba(243, 156, 18, 0.8);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="ui-layer">
        <div class="header">
            <h1>3D 掌上魔方</h1>
            <p>单指滑动背景旋转视角 | 双指缩放</p>
        </div>

        <div class="controls">
            <!-- 辅助功能 -->
            <div class="btn-row">
                <button class="action-btn" id="shuffle-btn">🎲 随机打乱</button>
                <button class="action-btn" id="reset-btn">🔄 一键复原</button>
            </div>

            <!-- 第一排：顺时针 -->
            <div>
                <div class="section-label">↷ 顺时针 (Clockwise)</div>
                <div class="btn-row">
                    <button class="btn-cw" data-face="U" data-dir="1">上<small>U</small></button>
                    <button class="btn-cw" data-face="D" data-dir="1">下<small>D</small></button>
                    <button class="btn-cw" data-face="L" data-dir="1">左<small>L</small></button>
                    <button class="btn-cw" data-face="R" data-dir="1">右<small>R</small></button>
                    <button class="btn-cw" data-face="F" data-dir="1">前<small>F</small></button>
                    <button class="btn-cw" data-face="B" data-dir="1">后<small>B</small></button>
                </div>
            </div>

            <!-- 第二排：逆时针 -->
            <div>
                <div class="section-label">↶ 逆时针 (Counter-Clockwise)</div>
                <div class="btn-row">
                    <button class="btn-ccw" data-face="U" data-dir="-1">上'<small>U'</small></button>
                    <button class="btn-ccw" data-face="D" data-dir="-1">下'<small>D'</small></button>
                    <button class="btn-ccw" data-face="L" data-dir="-1">左'<small>L'</small></button>
                    <button class="btn-ccw" data-face="R" data-dir="-1">右'<small>R'</small></button>
                    <button class="btn-ccw" data-face="F" data-dir="-1">前'<small>F'</small></button>
                    <button class="btn-ccw" data-face="B" data-dir="-1">后'<small>B'</small></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 场景与相机 ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4.5, 4.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 统一调整视口与大小（让魔方视觉重心上移）
        function updateViewport() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;

            // 关键改动：将相机投影视口向下偏移，魔方在视觉上就会整体向上移动（避开底部按键）
            const yShift = Math.min(h * 0.12, 90); // 向上偏移约 12% 屏高
            camera.setViewOffset(w, h, 0, yShift, w, h);

            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        updateViewport();

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. 魔方初始化 ---
        const colors = {
            R: 0xb71234, L: 0xff5800, U: 0xffffff, 
            D: 0xffd500, F: 0x009b48, B: 0x0046ad, 
            IN: 0x1e1e1e
        };

        const pieceSize = 0.96;
        const spacing = 1.0;
        const cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        const pieces = [];

        function createCube() {
            while (cubeGroup.children.length > 0) { 
                cubeGroup.remove(cubeGroup.children[0]); 
            }
            pieces.length = 0;

            const boxGeo = new THREE.BoxGeometry(pieceSize, pieceSize, pieceSize);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const materials = [
                            new THREE.MeshLambertMaterial({ color: x === 1 ? colors.R : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: x === -1 ? colors.L : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: y === 1 ? colors.U : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: y === -1 ? colors.D : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: z === 1 ? colors.F : colors.IN }),
                            new THREE.MeshLambertMaterial({ color: z === -1 ? colors.B : colors.IN })
                        ];

                        const piece = new THREE.Mesh(boxGeo, materials);
                        piece.position.set(x * spacing, y * spacing, z * spacing);
                        cubeGroup.add(piece);
                        pieces.push(piece);
                    }
                }
            }
        }
        createCube();

        // --- 3. 旋转逻辑 ---
        let isAnimating = false;

        const faceAxes = {
            'R': { axis: 'x', value: 1,  baseDir: -1 },
            'L': { axis: 'x', value: -1, baseDir: 1 },
            'U': { axis: 'y', value: 1,  baseDir: -1 },
            'D': { axis: 'y', value: -1, baseDir: 1 },
            'F': { axis: 'z', value: 1,  baseDir: -1 },
            'B': { axis: 'z', value: -1, baseDir: 1 },
        };

        function rotateFace(faceKey, dirMultiplier = 1, customSpeed = null, callback = null) {
            if (isAnimating && customSpeed === null) return;
            isAnimating = true;

            const config = faceAxes[faceKey];
            const direction = dirMultiplier * config.baseDir;
            const targetAngle = (Math.PI / 2) * direction;

            const activePieces = pieces.filter(piece => {
                return Math.abs(piece.position[config.axis] - config.value * spacing) < 0.1;
            });

            const pivot = new THREE.Object3D();
            pivot.rotation.set(0, 0, 0);
            scene.add(pivot);

            activePieces.forEach(piece => pivot.attach(piece));

            const duration = customSpeed || 200;
            const startTime = performance.now();

            function animateRotate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                pivot.rotation[config.axis] = targetAngle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animateRotate);
                } else {
                    pivot.rotation[config.axis] = targetAngle;
                    pivot.updateMatrixWorld();
                    activePieces.forEach(piece => {
                        cubeGroup.attach(piece);
                        piece.position.x = Math.round(piece.position.x);
                        piece.position.y = Math.round(piece.position.y);
                        piece.position.z = Math.round(piece.position.z);
                    });
                    scene.remove(pivot);
                    isAnimating = false;
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animateRotate);
        }

        // 打乱
        function shuffleCube() {
            if (isAnimating) return;
            const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
            const dirs = [1, -1];
            let count = 18;
            
            function step() {
                if (count <= 0) return;
                const randomFace = faces[Math.floor(Math.random() * faces.length)];
                const randomDir = dirs[Math.floor(Math.random() * dirs.length)];
                rotateFace(randomFace, randomDir, 50, () => {
                    count--;
                    step();
                });
            }
            step();
        }

        // --- 4. 按钮事件 ---
        document.querySelectorAll('button[data-face]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const button = e.currentTarget;
                const face = button.getAttribute('data-face');
                const dir = parseInt(button.getAttribute('data-dir'), 10);
                rotateFace(face, dir);
            });
        });

        document.getElementById('shuffle-btn').addEventListener('click', shuffleCube);
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (isAnimating) return;
            createCube();
        });

        window.addEventListener('resize', updateViewport);

        // --- 5. 渲染循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
